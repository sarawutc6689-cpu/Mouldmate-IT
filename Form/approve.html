<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อนุมัติคำขอ | IT Request System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 30px 20px;
  }
  .top-bar { max-width: 1000px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
  .top-bar a { color: white; text-decoration: none; font-size: 14px; }
  .top-bar .user-info { color: white; font-size: 14px; display: flex; align-items: center; gap: 12px; }
  .btn-logout {
    background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4);
    padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 13px;
  }

  /* Login Screen */
  .login-wrap {
    display: flex; align-items: center; justify-content: center; min-height: 70vh;
  }
  .login-card {
    background: white; border-radius: 20px; padding: 40px; max-width: 380px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;
  }
  .login-card .icon { font-size: 44px; margin-bottom: 12px; }
  .login-card h2 { font-size: 20px; margin-bottom: 24px; color: #333; }
  .login-card input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1.5px solid #e0e0f0;
    border-radius: 10px; font-size: 14px;
  }
  .login-card button {
    width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .login-error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

  /* Dashboard */
  .dashboard { display: none; max-width: 1000px; margin: 0 auto; }
  .header { text-align: center; color: white; margin-bottom: 24px; }
  .header h1 { font-size: 26px; margin-bottom: 6px; }

  .filter-bar {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-bar select, .filter-bar input {
    padding: 9px 14px; border-radius: 10px; border: none; font-size: 13px;
  }

  .request-card {
    background: white; border-radius: 16px; padding: 22px 26px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .request-card .top-row {
    display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;
  }
  .ticket-id { font-weight: 700; color: #667eea; font-size: 15px; }
  .badge {
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .badge.pending { background: #fff3cd; color: #856404; }
  .badge.approved { background: #d4edda; color: #155724; }
  .badge.rejected { background: #f8d7da; color: #721c24; }

  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px 20px; font-size: 13px; color: #555; margin-bottom: 12px;
  }
  .info-grid b { color: #333; }
  .objective-box {
    background: #f7f7ff; padding: 10px 14px; border-radius: 8px; font-size: 13px;
    color: #555; margin-bottom: 14px;
  }

  .action-row { display: flex; gap: 10px; }
  .btn-approve, .btn-reject {
    padding: 9px 20px; border: none; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .btn-approve { background: #43e97b; color: white; }
  .btn-reject { background: #f5576c; color: white; }

  .empty-state {
    text-align: center; color: white; padding: 60px 20px; opacity: 0.85;
  }
  .empty-state .icon { font-size: 50px; margin-bottom: 12px; }

  /* Reject Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white; border-radius: 16px; padding: 28px; max-width: 400px; width: 90%;
  }
  .modal-box h3 { margin-bottom: 14px; font-size: 17px; }
  .modal-box textarea {
    width: 100%; min-height: 90px; padding: 12px; border: 1.5px solid #e0e0f0;
    border-radius: 10px; font-size: 13px; margin-bottom: 14px; font-family: inherit;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button { padding: 9px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-cancel { background: #eee; color: #555; }
  .btn-confirm-reject { background: #f5576c; color: white; }
</style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">← กลับหน้าหลัก</a>
    <div class="user-info" id="userInfo" style="display:none;">
      <span id="userName"></span>
      <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <!-- Login Screen -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <div class="icon">🔐</div>
      <h2>เข้าสู่ระบบอนุมัติ</h2>
      <input type="email" id="loginEmail" placeholder="อีเมล">
      <input type="password" id="loginPassword" placeholder="รหัสผ่าน">
      <button onclick="login()">เข้าสู่ระบบ</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>✅ รายการคำขอที่รอดำเนินการ</h1>
    </div>
    <div class="filter-bar">
      <select id="statusFilter" onchange="loadRequests()">
        <option value="รออนุมัติ">รออนุมัติ</option>
        <option value="อนุมัติแล้ว">อนุมัติแล้ว</option>
        <option value="ปฏิเสธ">ปฏิเสธ</option>
        <option value="">ทั้งหมด</option>
      </select>
    </div>
    <div id="requestList"></div>
  </div>

  <!-- Reject Modal -->
  <div class="modal-overlay" id="rejectModal">
    <div class="modal-box">
      <h3>ระบุเหตุผลการปฏิเสธ</h3>
      <textarea id="rejectReason" placeholder="กรอกเหตุผล..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRejectModal()">ยกเลิก</button>
        <button class="btn-confirm-reject" onclick="confirmReject()">ยืนยันปฏิเสธ</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentRejectId = null;

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      showDashboard(session.user);
    }
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errBox.textContent = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
      errBox.style.display = 'block';
      return;
    }
    showDashboard(data.user);
  }

  async function logout() {
    await supabase.auth.signOut();
    location.reload();
  }

  async function showDashboard(user) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('userInfo').style.display = 'flex';

    const { data: profile } = await supabase.from('profiles').select('name, section').eq('id', user.id).single();
    document.getElementById('userName').textContent = `👤 ${profile?.name || user.email} (${profile?.section || '-'})`;

    loadRequests();
  }

  async function loadRequests() {
    const status = document.getElementById('statusFilter').value;
    let query = supabase.from('requests').select('*').order('created_at', { ascending: false });
    if (status) query = query.eq('status', status);

    const { data, error } = await query;
    const list = document.getElementById('requestList');

    if (error) {
      list.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>โหลดข้อมูลไม่สำเร็จ: ${error.message}</p></div>`;
      return;
    }
    if (!data || data.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>ไม่มีคำขอในสถานะนี้</p></div>`;
      return;
    }

    const badgeClass = { 'รออนุมัติ': 'pending', 'อนุมัติแล้ว': 'approved', 'ปฏิเสธ': 'rejected' };

    list.innerHTML = data.map(r => `
      <div class="request-card">
        <div class="top-row">
          <span class="ticket-id">${r.ticket_id}</span>
          <span class="badge ${badgeClass[r.status]}">${r.status}</span>
        </div>
        <div class="info-grid">
          <div><b>ชื่อ:</b> ${r.name_thai}</div>
          <div><b>แผนก:</b> ${r.department || '-'}</div>
          <div><b>ตำแหน่ง:</b> ${r.position || '-'}</div>
          <div><b>ประเภท:</b> ${r.email_type || '-'}</div>
          <div><b>ผู้อนุมัติ:</b> ${r.approval_manager || '-'}</div>
          <div><b>วันที่ยื่น:</b> ${new Date(r.created_at).toLocaleDateString('th-TH')}</div>
        </div>
        <div class="objective-box"><b>วัตถุประสงค์:</b> ${r.objective || '-'}</div>
        ${r.status === 'รออนุมัติ' ? `
          <div class="action-row">
            <button class="btn-approve" onclick="approveRequest('${r.id}')">✓ อนุมัติ</button>
            <button class="btn-reject" onclick="openRejectModal('${r.id}')">✕ ปฏิเสธ</button>
          </div>` : ''}
        ${r.status === 'ปฏิเสธ' && r.reject_reason ? `<div class="objective-box"><b>เหตุผลที่ปฏิเสธ:</b> ${r.reject_reason}</div>` : ''}
      </div>
    `).join('');
  }

  async function approveRequest(id) {
    const { error } = await supabase.from('requests')
      .update({ status: 'อนุมัติแล้ว', approval_date: new Date().toISOString() })
      .eq('id', id);
    if (error) { alert('เกิดข้อผิดพลาด: ' + error.message); return; }
    loadRequests();
  }

  function openRejectModal(id) {
    currentRejectId = id;
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').classList.add('show');
  }
  function closeRejectModal() {
    document.getElementById('rejectModal').classList.remove('show');
    currentRejectId = null;
  }
  async function confirmReject() {
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { alert('กรุณาระบุเหตุผล'); return; }

    const { error } = await supabase.from('requests')
      .update({ status: 'ปฏิเสธ', reject_reason: reason, approval_date: new Date().toISOString() })
      .eq('id', currentRejectId);

    closeRejectModal();
    if (error) { alert('เกิดข้อผิดพลาด: ' + error.message); return; }
    loadRequests();
  }

  checkSession();
</script>
</body>
</html>
