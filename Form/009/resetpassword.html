<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ - ระบบนำอุปกรณ์ออกนอกบริษัท</title>
<style>
    :root {
      --primary:#1a56db; --primary-dark:#1e40af;
      --sidebar-bg1:#0f2050; --sidebar-bg2:#1a3a7a;
      --bg:#f0f4f8; --white:#ffffff; --border:#e2e8f0;
      --text:#1e293b; --text-muted:#64748b; --danger:#ef4444;
      --radius:10px; --shadow:0 4px 20px rgba(15,32,80,.15);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Sarabun','TH Sarabun New','Noto Sans Thai',Tahoma,sans-serif;
      font-size:16px;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--sidebar-bg1) 0%,var(--sidebar-bg2) 100%);
      padding:20px;
    }
    .card{
      background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
      width:100%;max-width:380px;padding:34px 30px;
    }
    .logo{text-align:center;margin-bottom:26px;}
    .logo .title{font-size:17px;font-weight:700;color:var(--text);line-height:1.4;}
    .logo .sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
    label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}
    .field{margin-bottom:18px;}
    input{
      width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;
      font-size:16px;font-family:inherit;color:var(--text);
    }
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.12);}
    .btn{
      width:100%;padding:12px;background:var(--primary);color:#fff;border:none;
      border-radius:8px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
      margin-top:6px;transition:background .15s;
    }
    .btn:hover{background:var(--primary-dark);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .error-msg{
      background:#fef2f2;color:var(--danger);border:1px solid #fecaca;
      border-radius:8px;padding:10px 13px;font-size:14px;margin-bottom:16px;display:none;
    }
    .error-msg.show{display:block;}
    .success-msg{
      background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;
      border-radius:8px;padding:14px;font-size:14px;text-align:center;
    }
    .hint{font-size:12px;color:var(--text-muted);margin-top:-10px;margin-bottom:16px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="title">ตั้งรหัสผ่านใหม่</div>
    <div class="sub">ระบบนำอุปกรณ์ออกนอกบริษัท</div>
  </div>

  <div id="checkingMsg" style="text-align:center;color:var(--text-muted);font-size:14px;">กำลังตรวจสอบลิงก์...</div>

  <div id="invalidLinkMsg" class="error-msg">
    ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว กรุณากลับไปหน้าเข้าสู่ระบบแล้วขอลิงก์ใหม่อีกครั้ง
  </div>

  <form id="resetForm" style="display:none;">
    <div class="error-msg" id="errorMsg"></div>
    <div class="field">
      <label for="newPassword">รหัสผ่านใหม่</label>
      <input type="password" id="newPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
      <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="btnSave">บันทึกรหัสผ่านใหม่</button>
  </form>

  <div id="successMsg" class="success-msg" style="display:none;">
    ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว กำลังพาไปหน้าเข้าสู่ระบบ...
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const checkingMsg = document.getElementById('checkingMsg');
  const invalidLinkMsg = document.getElementById('invalidLinkMsg');
  const resetForm = document.getElementById('resetForm');
  const errorMsg = document.getElementById('errorMsg');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }

  // เมื่อผู้ใช้คลิกลิงก์จากอีเมล Supabase จะสร้าง session ชั่วคราว (type=recovery)
  // ให้อัตโนมัติจาก URL hash ต้องรอ event PASSWORD_RECOVERY หรือเช็ค session ก่อนแสดงฟอร์ม
  let recoveryReady = false;

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      recoveryReady = true;
      checkingMsg.style.display = 'none';
      resetForm.style.display = 'block';
    }
  });

  // เผื่อกรณี event ยิงไปแล้วก่อนที่ listener จะติดตั้งทัน ให้เช็ค session ตรงๆ ด้วย
  (async () => {
    await new Promise((r) => setTimeout(r, 800));
    if (recoveryReady) return;
    const { data: { session } } = await sb.auth.getSession();
    checkingMsg.style.display = 'none';
    if (session) {
      resetForm.style.display = 'block';
    } else {
      invalidLinkMsg.classList.add('show');
    }
  })();

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;

    if (p1.length < 6) {
      showError('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
      return;
    }
    if (p1 !== p2) {
      showError('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
      return;
    }

    const btnSave = document.getElementById('btnSave');
    btnSave.disabled = true;
    btnSave.textContent = 'กำลังบันทึก...';

    const { error } = await sb.auth.updateUser({ password: p1 });

    btnSave.disabled = false;
    btnSave.textContent = 'บันทึกรหัสผ่านใหม่';

    if (error) {
      showError('บันทึกไม่สำเร็จ: ' + error.message);
      return;
    }

    resetForm.style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  });
</script>
</body>
</html>
