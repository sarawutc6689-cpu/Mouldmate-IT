<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามสถานะคำขอเบิกอุปกรณ์ - FM009</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Sarabun', sans-serif; margin: 0; background: #f4f5f7; }
  .topbar { background:#1f2937; color:#fff; padding:14px 20px; }
  .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
  .card { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .search-row { display:flex; gap:8px; flex-wrap:wrap; }
  input, select, button { padding:10px; font-size:15px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
  input { flex:1; min-width:200px; }
  button { cursor:pointer; border:none; color:#fff; background:#2563eb; padding:10px 20px; }
  button:hover { background:#1d4ed8; }
  .status-pending { color:#b45309; font-weight:bold; }
  .status-approved { color:#16a34a; font-weight:bold; }
  .status-rejected { color:#dc2626; font-weight:bold; }
  table { width:100%; border-collapse: collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; font-size:14px; }
  .muted { color:#6b7280; font-size:13px; }
  .err { color:#dc2626; font-size:14px; }
  .empty { text-align:center; color:#9ca3af; padding:30px 0; }
</style>
</head>
<body>

<div class="topbar">
  <strong>FM009 · ติดตามสถานะคำขอเบิกอุปกรณ์</strong>
</div>

<div class="container">
  <div class="card">
    <p class="muted">ค้นหาด้วยเลข Ticket (เช่น TK241205-001) หรือรหัสพนักงาน</p>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="เลข Ticket หรือ รหัสพนักงาน">
      <button onclick="searchRequests()">ค้นหา</button>
    </div>
    <p class="err" id="search-error"></p>
  </div>

  <div id="results"></div>
</div>

<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE'; // TODO: ใส่ anon key จริง
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchRequests();
  });

  async function searchRequests() {
    const keyword = document.getElementById('search-input').value.trim();
    const errEl = document.getElementById('search-error');
    const resultsEl = document.getElementById('results');
    errEl.textContent = '';
    resultsEl.innerHTML = '';

    if (!keyword) {
      errEl.textContent = 'กรุณากรอกเลข Ticket หรือรหัสพนักงาน';
      return;
    }

    resultsEl.innerHTML = '<p class="muted">กำลังค้นหา...</p>';

    // ค้นหาแบบ OR: ตรงกับ ticket_no หรือ employee_code
    const { data: requests, error } = await sb
      .from('fm009_requests')
      .select('*')
      .or(`ticket_no.ilike.%${keyword}%,employee_code.eq.${keyword}`)
      .order('request_date', { ascending: false });

    if (error) {
      resultsEl.innerHTML = '';
      errEl.textContent = 'ค้นหาไม่สำเร็จ: ' + error.message;
      return;
    }

    if (!requests || requests.length === 0) {
      resultsEl.innerHTML = '<div class="card empty">ไม่พบคำขอที่ตรงกับ "' + keyword + '"</div>';
      return;
    }

    resultsEl.innerHTML = '';
    for (const req of requests) {
      const card = document.createElement('div');
      card.className = 'card';

      const statusClass = 'status-' + req.status;
      const statusText = { pending: 'รอดำเนินการ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธแล้ว' }[req.status] || req.status;

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>${req.ticket_no}</strong>
          </div>
          <span class="${statusClass}">${statusText}</span>
        </div>
        <p class="muted" style="margin:8px 0;">
          พนักงาน: ${req.employee_name} (${req.employee_code}) &nbsp;|&nbsp;
          แผนก: ${req.department || '-'} <br>
          วันที่ยื่น: ${new Date(req.request_date).toLocaleString('th-TH')}
        </p>
        <p><strong>เหตุผล:</strong> ${req.reason || '-'}</p>
        <div id="items-${req.id}" class="muted">กำลังโหลดรายการอุปกรณ์...</div>
      `;
      resultsEl.appendChild(card);
      loadItems(req.id);
    }
  }

  async function loadItems(requestId) {
    const { data: items, error } = await sb
      .from('fm009_request_items')
      .select('*')
      .eq('request_id', requestId);

    const el = document.getElementById('items-' + requestId);
    if (error) {
      el.innerHTML = '<span class="err">โหลดรายการอุปกรณ์ล้มเหลว</span>';
      return;
    }
    if (!items || items.length === 0) {
      el.innerHTML = '<span class="muted">ไม่มีรายการอุปกรณ์</span>';
      return;
    }

    let table = '<table><tr><th>อุปกรณ์</th><th>ยี่ห้อ</th><th>รุ่น</th><th>S/N</th><th>จำนวน</th></tr>';
    for (const it of items) {
      table += `<tr><td>${it.item_name}</td><td>${it.brand || '-'}</td><td>${it.model || '-'}</td><td>${it.serial_no || '-'}</td><td>${it.quantity}</td></tr>`;
    }
    table += '</table>';
    el.innerHTML = table;
  }
</script>

</body>
</html>
