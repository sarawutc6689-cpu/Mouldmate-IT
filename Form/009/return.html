<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกการคืนอุปกรณ์ - FM009</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Sarabun', sans-serif; margin: 0; background: #f4f5f7; }
  .topbar { background:#1f2937; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
  .card { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .login-box { max-width:360px; margin:80px auto; }
  input, button, select, textarea { padding:10px; font-size:15px; border-radius:6px; border:1px solid #ccc; width:100%; box-sizing:border-box; margin-bottom:10px; font-family: inherit; }
  button { cursor:pointer; border:none; color:#fff; }
  .btn-primary { background:#2563eb; }
  .btn-save { background:#16a34a; }
  .status-pending { color:#b45309; font-weight:bold; }
  .status-approved { color:#16a34a; font-weight:bold; }
  .status-rejected { color:#dc2626; font-weight:bold; }
  .status-returned { color:#2563eb; font-weight:bold; }
  table { width:100%; border-collapse: collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; font-size:14px; }
  #app-view { display:none; }
  .err { color:#dc2626; font-size:13px; }
  .ok { color:#16a34a; font-size:13px; }
  .muted { color:#6b7280; font-size:13px; }
  .search-row { display:flex; gap:8px; }
  .search-row input { flex:1; }
  .search-row button { width:auto; padding:10px 20px; background:#2563eb; }
</style>
</head>
<body>

<div id="login-view" class="login-box card">
  <h2>เข้าสู่ระบบแอดมิน</h2>
  <p class="muted">ต้องเป็นบัญชีที่มีสิทธิ์ role = admin เท่านั้น</p>
  <input type="email" id="login-email" placeholder="อีเมล">
  <input type="password" id="login-password" placeholder="รหัสผ่าน">
  <button class="btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
  <p class="err" id="login-error"></p>
</div>

<div id="app-view">
  <div class="topbar">
    <div>FM009 · บันทึกการคืนอุปกรณ์</div>
    <div>
      <span id="user-email" style="margin-right:16px;"></span>
      <button onclick="handleLogout()" style="background:#374151;width:auto;padding:6px 14px;">ออกจากระบบ</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <p class="muted">ค้นหาคำขอด้วยเลข Ticket หรือรหัสพนักงาน</p>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="เลข Ticket หรือ รหัสพนักงาน">
        <button onclick="searchRequests()">ค้นหา</button>
      </div>
      <p class="err" id="search-error"></p>
    </div>

    <div id="results"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE'; // TODO: ใส่ anon key จริง
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isAdmin = false;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      onLoginSuccess(session.user);
    }
  });

  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchRequests();
  });

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    if (!email || !password) {
      errEl.textContent = 'กรุณากรอกอีเมลและรหัสผ่าน';
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;
      return;
    }
    onLoginSuccess(data.user);
  }

  async function handleLogout() {
    await sb.auth.signOut();
    isAdmin = false;
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('app-view').style.display = 'none';
  }

  function onLoginSuccess(user) {
    const role = user.app_metadata && user.app_metadata.role;
    if (role !== 'admin') {
      document.getElementById('login-error').textContent = 'บัญชีนี้ไม่มีสิทธิ์แอดมิน (role != admin) ไม่สามารถบันทึกการคืนอุปกรณ์ได้';
      sb.auth.signOut();
      return;
    }
    isAdmin = true;
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    document.getElementById('user-email').textContent = user.email + ' (admin)';
  }

  async function searchRequests() {
    const keyword = document.getElementById('search-input').value.trim();
    const errEl = document.getElementById('search-error');
    const resultsEl = document.getElementById('results');
    errEl.textContent = '';
    resultsEl.innerHTML = '';

    if (!keyword) {
      errEl.textContent = 'กรุณากรอกเลข Ticket หรือรหัสพนักงาน';
      return;
    }

    resultsEl.innerHTML = '<p class="muted">กำลังค้นหา...</p>';

    const { data: requests, error } = await sb
      .from('fm009_requests')
      .select('*')
      .or(`ticket_no.ilike.%${keyword}%,employee_code.eq.${keyword}`)
      .order('request_date', { ascending: false });

    if (error) {
      resultsEl.innerHTML = '';
      errEl.textContent = 'ค้นหาไม่สำเร็จ: ' + error.message;
      return;
    }

    if (!requests || requests.length === 0) {
      resultsEl.innerHTML = '<div class="card muted" style="text-align:center;">ไม่พบคำขอที่ตรงกับ "' + keyword + '"</div>';
      return;
    }

    resultsEl.innerHTML = '';
    for (const req of requests) {
      renderRequestCard(req);
    }
  }

  async function renderRequestCard(req) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'req-card-' + req.id;

    const statusClass = 'status-' + req.status;
    const statusText = { pending: 'รอดำเนินการ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธแล้ว' }[req.status] || req.status;

    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${req.ticket_no}</strong></div>
        <span class="${statusClass}">${statusText}</span>
      </div>
      <p class="muted" style="margin:8px 0;">
        พนักงาน: ${req.employee_name} (${req.employee_code}) &nbsp;|&nbsp; แผนก: ${req.department || '-'}<br>
        วันที่ยื่น: ${new Date(req.request_date).toLocaleString('th-TH')}
      </p>
      <div id="items-${req.id}" class="muted">กำลังโหลดรายการอุปกรณ์...</div>
      <div id="return-area-${req.id}"></div>
    `;
    document.getElementById('results').appendChild(card);
    loadItemsAndReturnStatus(req);
  }

  async function loadItemsAndReturnStatus(req) {
    const { data: items, error: itemsErr } = await sb
      .from('fm009_request_items')
      .select('*')
      .eq('request_id', req.id);

    const itemsEl = document.getElementById('items-' + req.id);
    if (itemsErr) {
      itemsEl.innerHTML = '<span class="err">โหลดรายการอุปกรณ์ล้มเหลว</span>';
    } else if (!items || items.length === 0) {
      itemsEl.innerHTML = '<span class="muted">ไม่มีรายการอุปกรณ์</span>';
    } else {
      let table = '<table><tr><th>อุปกรณ์</th><th>ยี่ห้อ</th><th>รุ่น</th><th>S/N</th><th>จำนวน</th></tr>';
      for (const it of items) {
        table += `<tr><td>${it.item_name}</td><td>${it.brand || '-'}</td><td>${it.model || '-'}</td><td>${it.serial_no || '-'}</td><td>${it.quantity}</td></tr>`;
      }
      table += '</table>';
      itemsEl.innerHTML = table;
    }

    // เช็คว่ามีการคืนแล้วหรือยัง (ป้องกันบันทึกซ้ำโดยไม่ได้ตั้งใจ)
    const { data: existingReturns, error: retErr } = await sb
      .from('fm009_returns')
      .select('*')
      .eq('request_id', req.id)
      .order('return_date', { ascending: false });

    const areaEl = document.getElementById('return-area-' + req.id);

    if (retErr) {
      areaEl.innerHTML = '<p class="err">โหลดประวัติการคืนล้มเหลว</p>';
      return;
    }

    let historyHtml = '';
    if (existingReturns && existingReturns.length > 0) {
      historyHtml = '<p class="ok">มีบันทึกการคืนแล้ว ' + existingReturns.length + ' ครั้ง:</p><table><tr><th>วันที่คืน</th><th>สภาพ</th><th>ผู้รับคืน</th><th>หมายเหตุ</th></tr>';
      for (const r of existingReturns) {
        historyHtml += `<tr><td>${new Date(r.return_date).toLocaleString('th-TH')}</td><td>${r.condition || '-'}</td><td>${r.received_by || '-'}</td><td>${r.note || '-'}</td></tr>`;
      }
      historyHtml += '</table>';
    }

    if (req.status !== 'approved') {
      areaEl.innerHTML = historyHtml + '<p class="muted">บันทึกการคืนได้เฉพาะคำขอที่อนุมัติแล้วเท่านั้น</p>';
      return;
    }

    areaEl.innerHTML = historyHtml + `
      <hr style="margin:16px 0; border:none; border-top:1px solid #eee;">
      <p><strong>บันทึกการคืนอุปกรณ์ใหม่</strong></p>
      <label class="muted">วันที่คืน</label>
      <input type="datetime-local" id="return-date-${req.id}" value="${new Date().toISOString().slice(0,16)}">
      <label class="muted">สภาพอุปกรณ์ตอนคืน</label>
      <select id="condition-${req.id}">
        <option value="ปกติ">ปกติ</option>
        <option value="ชำรุดเล็กน้อย">ชำรุดเล็กน้อย</option>
        <option value="ชำรุดหนัก">ชำรุดหนัก</option>
        <option value="สูญหาย">สูญหาย</option>
      </select>
      <label class="muted">ผู้รับคืน</label>
      <input type="text" id="received-by-${req.id}" placeholder="ชื่อผู้รับคืนอุปกรณ์">
      <label class="muted">หมายเหตุ</label>
      <textarea id="note-${req.id}" rows="2" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"></textarea>
      <button class="btn-save" onclick="saveReturn(${req.id})">บันทึกการคืน</button>
      <p class="err" id="save-error-${req.id}"></p>
    `;
  }

  async function saveReturn(requestId) {
    const errEl = document.getElementById('save-error-' + requestId);
    errEl.textContent = '';

    const returnDateVal = document.getElementById('return-date-' + requestId).value;
    const condition = document.getElementById('condition-' + requestId).value;
    const receivedBy = document.getElementById('received-by-' + requestId).value.trim();
    const note = document.getElementById('note-' + requestId).value.trim();

    if (!returnDateVal) {
      errEl.textContent = 'กรุณาระบุวันที่คืน';
      return;
    }
    if (!receivedBy) {
      errEl.textContent = 'กรุณาระบุผู้รับคืนอุปกรณ์';
      return;
    }

    // RLS policy fm009_returns: insert ต้องมี role admin ใน app_metadata เท่านั้น
    const { error } = await sb.from('fm009_returns').insert({
      request_id: requestId,
      return_date: new Date(returnDateVal).toISOString(),
      condition: condition,
      received_by: receivedBy,
      note: note || null
    });

    if (error) {
      errEl.textContent = 'บันทึกไม่สำเร็จ: ' + error.message;
      return;
    }

    alert('บันทึกการคืนอุปกรณ์เรียบร้อยแล้ว');
    // reload card เดิมเพื่อแสดงประวัติล่าสุด
    const { data: req } = await sb.from('fm009_requests').select('*').eq('id', requestId).single();
    if (req) {
      document.getElementById('req-card-' + requestId).remove();
      renderRequestCard(req);
    }
  }
</script>

</body>
</html>
