<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อนุมัติคำขอเบิกอุปกรณ์ - FM009</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Sarabun', sans-serif; margin: 0; background: #f4f5f7; }
  .topbar { background:#1f2937; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  .card { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .login-box { max-width:360px; margin:80px auto; }
  input, button, select { padding:10px; font-size:15px; border-radius:6px; border:1px solid #ccc; width:100%; box-sizing:border-box; margin-bottom:10px; }
  button { cursor:pointer; border:none; color:#fff; }
  .btn-primary { background:#2563eb; }
  .btn-approve { background:#16a34a; width:auto; padding:8px 16px; margin-right:8px; }
  .btn-reject { background:#dc2626; width:auto; padding:8px 16px; }
  .status-pending { color:#b45309; font-weight:bold; }
  .status-approved { color:#16a34a; font-weight:bold; }
  .status-rejected { color:#dc2626; font-weight:bold; }
  table { width:100%; border-collapse: collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; font-size:14px; }
  #app-view { display:none; }
  .err { color:#dc2626; font-size:13px; }
  .muted { color:#6b7280; font-size:13px; }
</style>
</head>
<body>

<div id="login-view" class="login-box card">
  <h2>เข้าสู่ระบบผู้อนุมัติ</h2>
  <p class="muted">ใช้อีเมลที่ผูกไว้เป็น manager_email ของพนักงานเท่านั้น</p>
  <input type="email" id="login-email" placeholder="อีเมล">
  <input type="password" id="login-password" placeholder="รหัสผ่าน">
  <button class="btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
  <p class="err" id="login-error"></p>
</div>

<div id="app-view">
  <div class="topbar">
    <div>FM009 · อนุมัติคำขอเบิกอุปกรณ์</div>
    <div>
      <span id="user-email" style="margin-right:16px;"></span>
      <button onclick="handleLogout()" style="background:#374151;width:auto;padding:6px 14px;">ออกจากระบบ</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <label>กรองสถานะ: </label>
      <select id="status-filter" onchange="loadRequests()">
        <option value="pending">รอดำเนินการ</option>
        <option value="approved">อนุมัติแล้ว</option>
        <option value="rejected">ปฏิเสธแล้ว</option>
        <option value="all">ทั้งหมด</option>
      </select>
    </div>

    <div id="requests-list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE'; // TODO: ใส่ anon key จริง
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUserEmail = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      onLoginSuccess(session.user.email);
    }
  });

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    if (!email || !password) {
      errEl.textContent = 'กรุณากรอกอีเมลและรหัสผ่าน';
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;
      return;
    }
    onLoginSuccess(data.user.email);
  }

  async function handleLogout() {
    await sb.auth.signOut();
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('app-view').style.display = 'none';
  }

  function onLoginSuccess(email) {
    currentUserEmail = email;
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    document.getElementById('user-email').textContent = email;
    loadRequests();
  }

  async function loadRequests() {
    const statusFilter = document.getElementById('status-filter').value;
    const listEl = document.getElementById('requests-list');
    listEl.innerHTML = '<p class="muted">กำลังโหลด...</p>';

    // RLS จะกรองให้อัตโนมัติเฉพาะ request ที่ manager_email = auth.email() ของผู้ login
    // (ต้องมี SELECT policy คู่กับ approve policy ด้วย มิฉะนั้นจะไม่เห็นข้อมูลเลย)
    let query = sb.from('fm009_requests').select('*').order('request_date', { ascending: false });
    if (statusFilter !== 'all') {
      query = query.eq('status', statusFilter);
    }

    const { data: requests, error } = await query;

    if (error) {
      listEl.innerHTML = '<p class="err">โหลดข้อมูลล้มเหลว: ' + error.message + '</p>';
      return;
    }

    if (!requests || requests.length === 0) {
      listEl.innerHTML = '<p class="muted">ไม่มีคำขอในหมวดนี้</p>';
      return;
    }

    listEl.innerHTML = '';
    for (const req of requests) {
      const card = document.createElement('div');
      card.className = 'card';

      const statusClass = 'status-' + req.status;
      const statusText = { pending: 'รอดำเนินการ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธแล้ว' }[req.status] || req.status;

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between;">
          <div>
            <strong>${req.ticket_no}</strong> &nbsp;|&nbsp; ${req.employee_name} (${req.employee_code})
          </div>
          <span class="${statusClass}">${statusText}</span>
        </div>
        <p class="muted">แผนก: ${req.department || '-'} &nbsp;|&nbsp; วันที่ยื่น: ${new Date(req.request_date).toLocaleString('th-TH')}</p>
        <p><strong>เหตุผล:</strong> ${req.reason || '-'}</p>
        <div id="items-${req.id}" class="muted">กำลังโหลดรายการอุปกรณ์...</div>
        ${req.status === 'pending' ? `
          <div style="margin-top:12px;">
            <button class="btn-approve" onclick="updateStatus(${req.id}, 'approved')">อนุมัติ</button>
            <button class="btn-reject" onclick="updateStatus(${req.id}, 'rejected')">ปฏิเสธ</button>
          </div>
        ` : ''}
      `;
      listEl.appendChild(card);
      loadItems(req.id);
    }
  }

  async function loadItems(requestId) {
    const { data: items, error } = await sb
      .from('fm009_request_items')
      .select('*')
      .eq('request_id', requestId);

    const el = document.getElementById('items-' + requestId);
    if (error) {
      el.innerHTML = '<span class="err">โหลดรายการอุปกรณ์ล้มเหลว</span>';
      return;
    }
    if (!items || items.length === 0) {
      el.innerHTML = '<span class="muted">ไม่มีรายการอุปกรณ์</span>';
      return;
    }

    let table = '<table><tr><th>อุปกรณ์</th><th>ยี่ห้อ</th><th>รุ่น</th><th>S/N</th><th>จำนวน</th></tr>';
    for (const it of items) {
      table += `<tr><td>${it.item_name}</td><td>${it.brand || '-'}</td><td>${it.model || '-'}</td><td>${it.serial_no || '-'}</td><td>${it.quantity}</td></tr>`;
    }
    table += '</table>';
    el.innerHTML = table;
  }

  async function updateStatus(requestId, newStatus) {
    const label = newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ';
    if (!confirm(`ยืนยัน${label}คำขอนี้?`)) return;

    // RLS policy fm009_requests_approve_by_assigned_manager จะเช็คให้เองว่า
    // auth.email() ตรงกับ manager_email ของ request นี้หรือไม่ ถ้าไม่ตรง update จะถูกปฏิเสธ
    const { error } = await sb
      .from('fm009_requests')
      .update({ status: newStatus })
      .eq('id', requestId);

    if (error) {
      alert('ดำเนินการไม่สำเร็จ: ' + error.message);
      return;
    }
    loadRequests();
  }
</script>

</body>
</html>
