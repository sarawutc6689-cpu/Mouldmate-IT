<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการเจ้าหน้าที่ (บัญชีผู้ใช้ระบบ)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230D2B4E%22%2F%3E%3Cg%20transform%3D%22translate%2810%2C10%29%20scale%281.83%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%222.5%22%20y%3D%223.5%22%20width%3D%2219%22%20height%3D%2213%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M8%2021h8M12%2016.5V21%22%2F%3E%3Cpath%20d%3D%22M8%2010l2.6%202.6L16%207.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'AngsanaUPC', 'Angsana New', 'Sarabun', sans-serif;
    --navy:        #0D2B4E;
    --navy-deep:   #071C35;
    --navy-mid:    #1A4A7A;
    --navy-light:  #2D6FA8;
    --sky:         #3B8FD4;
    --sky-light:   #D6E9F8;
    --sky-pale:    #EDF5FC;
    --gold:        #B8952A;

    --success:       #1A6B3A;
    --success-light: #E3F4EB;
    --warning:       #8A5500;
    --warning-light: #FFF4DC;
    --danger:        #A01B1B;
    --danger-light:  #FDECEA;

    --white:      #FFFFFF;
    --bg:         #F0F5FB;
    --surface:    #FAFCFF;
    --border:     #C8D8EA;
    --border-soft:#DDE8F2;
    --text:       #0D1F35;
    --text-mid:   #2C4A6A;
    --text-muted: #5D7A96;
    --text-faint: #8CA3B8;

    --sidebar-w:  256px;
    --radius-sm:  6px;
    --radius-md:  10px;
    --radius-lg:  14px;
    --shadow-sm:  0 1px 4px rgba(13,43,78,0.08);
    --shadow-md:  0 4px 16px rgba(13,43,78,0.10);
    --shadow-lg:  0 8px 32px rgba(13,43,78,0.14);
  }

  body {
    font-family: var(--font);
    font-size: 16pt;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── LOGIN PAGE ────────────────────────────────── */
  #login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
  }
  .login-box {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 48px 40px 40px;
    width: 420px;
    max-width: 95vw;
    box-shadow: var(--shadow-lg);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo-icon {
    width: 64px; height: 64px;
    background: var(--navy);
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32pt;
    margin-bottom: 14px;
  }
  .login-logo-title {
    font-family: var(--font);
    font-size: 20pt; font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .login-logo-sub {
    font-size: 13pt;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .login-roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .role-btn {
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    cursor: pointer;
    text-align: center;
    background: var(--white);
    transition: all 0.18s;
    font-family: var(--font);
  }
  .role-btn:hover { border-color: var(--sky); background: var(--sky-pale); }
  .role-btn.selected { border-color: var(--navy-mid); background: var(--sky-pale); }
  .role-btn-icon { font-size: 28pt; margin-bottom: 8px; }
  .role-btn-label { font-size: 15pt; font-weight: 700; color: var(--navy); display: block; }
  .role-btn-sub { font-size: 12pt; color: var(--text-muted); }
  .login-field { margin-bottom: 16px; }
  .login-field label { font-size: 13pt; font-weight: 600; color: var(--text-mid); display: block; margin-bottom: 6px; }
  .login-field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-family: var(--font);
    color: var(--text);
    transition: all 0.18s;
  }
  .login-field input:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px rgba(59,143,212,0.15); }
  .login-error {
    background: var(--danger-light);
    border: 1px solid rgba(160,27,27,0.20);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13pt;
    color: var(--danger);
    margin-bottom: 16px;
    display: none;
  }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.18s;
  }
  .login-btn:hover { background: var(--navy-mid); }
  .login-divider {
    text-align: center;
    font-size: 13pt;
    color: var(--text-faint);
    margin: 16px 0;
  }
  .user-login-btn {
    width: 100%;
    padding: 13px;
    background: var(--success-light);
    color: var(--success);
    border: 1.5px solid rgba(26,107,58,0.25);
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.18s;
  }
  .user-login-btn:hover { background: #C8EDD7; }

  /* ── ROLE BADGE ────────────────────────────────── */
  .role-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12pt; font-weight: 700;
    margin-right: 10px;
  }
  .role-badge.admin { background: var(--sky-light); color: var(--navy-mid); }
  .role-badge.user  { background: var(--success-light); color: var(--success); }
  .role-badge.tech  { background: var(--warning-light); color: var(--warning); }
  .logout-btn {
    padding: 7px 16px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13pt; font-weight: 600;
    cursor: pointer;
    color: var(--text-mid);
    font-family: var(--font);
    transition: all 0.18s;
  }
  .logout-btn:hover { background: var(--danger-light); color: var(--danger); border-color: rgba(160,27,27,0.25); }

  /* ── SIDEBAR ──────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--navy);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    z-index: 200;
    box-shadow: 3px 0 20px rgba(13,43,78,0.25);
  }
  .sidebar-header {
    padding: 26px 22px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: var(--navy-deep);
  }
  .sidebar-emblem {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .sidebar-emblem-icon {
    width: 36px; height: 36px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18pt; flex-shrink: 0;
  }
  .sidebar-logo {
    font-family: var(--font);
    font-size: 14pt; font-weight: 700;
    color: #FFFFFF; line-height: 1.4;
  }
  .sidebar-subtitle {
    font-size: 11pt;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.4px;
  }
  .nav-section { padding: 10px 0; }
  .nav-label {
    font-size: 10pt; font-weight: 700;
    color: rgba(255,255,255,0.32);
    text-transform: uppercase; letter-spacing: 2px;
    padding: 10px 22px 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 22px;
    cursor: pointer;
    font-size: 14.5pt;
    color: rgba(255,255,255,0.62);
    transition: all 0.18s ease;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.92); border-left-color: rgba(255,255,255,0.20); }
  .nav-item.active { background: rgba(59,143,212,0.20); color: #FFFFFF; border-left-color: var(--sky); font-weight: 600; }
  .nav-item.active .nav-icon { color: var(--sky); }
  .nav-icon { font-size: 17pt; width: 20px; text-align: center; }
  .nav-item.editor-only { display: none; }
  .nav-item.editor-only.show { display: flex; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 22px;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: var(--navy-deep);
  }
  .footer-line { font-size: 12pt; color: rgba(255,255,255,0.32); display: flex; align-items: center; gap: 8px; padding: 3px 0; }

  /* ── MAIN ─────────────────────────────────────────── */
  #app { display: none; width: 100%; }
  #app.show { display: flex; }
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .page-title { font-family: var(--font); font-size: 19pt; font-weight: 700; color: var(--navy); }
  .page-subtitle { font-size: 13pt; color: var(--text-muted); margin-top: 2px; }
  .content { padding: 32px; flex: 1; }

  /* ── CARDS ────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: var(--shadow-md); }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; padding-bottom: 16px;
    border-bottom: 2px solid var(--sky-pale);
  }
  .card-title {
    font-family: var(--font);
    font-size: 17pt; font-weight: 700; color: var(--navy);
    display: flex; align-items: center; gap: 10px;
  }
  .card-title-icon {
    width: 32px; height: 32px;
    background: var(--sky-pale);
    border: 1px solid var(--sky-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16pt;
  }

  /* ── STATS ────────────────────────────────────────── */
  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 28px; }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
    transition: all 0.2s;
  }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
  .stat-card.blue::before  { background: var(--navy-mid); }
  .stat-card.green::before { background: var(--success); }
  .stat-card.amber::before { background: var(--warning); }
  .stat-card.gray::before  { background: var(--text-muted); }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-label { font-size: 12pt; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .stat-value { font-family: var(--font); font-size: 36pt; font-weight: 700; line-height: 1; margin-bottom: 6px; }
  .stat-sub { font-size: 13pt; color: var(--text-muted); }
  .stat-card.blue  .stat-value { color: var(--navy-mid); }
  .stat-card.green .stat-value { color: var(--success); }
  .stat-card.amber .stat-value { color: var(--warning); }
  .stat-card.gray  .stat-value { color: var(--text-mid); }

  /* ── CHART ────────────────────────────────────────── */
  .chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding: 0 4px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; background: var(--sky-light); border-radius: 5px 5px 0 0; transition: all 0.4s; min-height: 3px; }
  .bar.active { background: var(--navy-mid); }
  .bar-val { font-size: 12pt; font-weight: 700; color: var(--navy-mid); }
  .bar-lbl { font-size: 11pt; color: var(--text-muted); }

  /* ── TABLES ───────────────────────────────────────── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 14pt; }
  thead tr { background: var(--navy); }
  th { color: rgba(255,255,255,0.85); font-size: 12pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; padding: 13px 16px; text-align: left; white-space: nowrap; }
  td { padding: 13px 16px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; color: var(--text-mid); }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover td { background: var(--sky-pale); }
  tbody tr[data-key] { cursor: pointer; }
  tbody tr.selected-row td { background: #d2e8fc; }
  tbody tr.selected-row:hover td { background: #c3ddf7; }
  tbody tr.selected-row td:first-child { box-shadow: inset 4px 0 0 var(--navy-light); }

  /* ── BADGES ───────────────────────────────────────── */
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12pt; font-weight: 600; letter-spacing: 0.2px; }
  .badge-success { background: var(--success-light); color: var(--success); }
  .badge-warning { background: var(--warning-light); color: var(--warning); }
  .badge-danger  { background: var(--danger-light);  color: var(--danger); }
  .badge-blue    { background: var(--sky-light);     color: var(--navy-mid); }
  .badge-gray    { background: var(--bg); color: var(--text-mid); border: 1px solid var(--border-soft); }

  /* ── FORMS ────────────────────────────────────────── */
  .form-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .form-group  { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 13pt; font-weight: 600; color: var(--text-mid); letter-spacing: 0.2px; }
  input, select, textarea {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 15pt;
    font-family: var(--font);
    color: var(--text);
    background: var(--white);
    width: 100%;
    transition: all 0.18s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--sky);
    box-shadow: 0 0 0 3px rgba(59,143,212,0.15);
  }
  input[readonly] { background: var(--bg); color: var(--text-mid); cursor: default; }
  textarea { resize: vertical; min-height: 90px; }

  /* ── CHECKLIST ────────────────────────────────────── */
  .check-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer; font-size: 14pt;
    transition: all 0.18s;
    background: var(--white);
  }
  .check-item:hover { border-color: var(--sky); background: var(--sky-pale); color: var(--navy); }
  .check-item input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; accent-color: var(--navy-mid); }
  .check-item.checked { border-color: var(--success); background: var(--success-light); color: var(--success); font-weight: 600; }

  /* ── BUTTONS ──────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    font-size: 14pt; font-weight: 600;
    cursor: pointer; border: none;
    transition: all 0.18s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .btn-primary  { background: var(--navy); color: var(--white); box-shadow: 0 2px 8px rgba(13,43,78,0.25); }
  .btn-primary:hover  { background: var(--navy-mid); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,43,78,0.30); }
  .btn-success  { background: var(--success); color: var(--white); box-shadow: 0 2px 8px rgba(26,107,58,0.25); }
  .btn-success:hover  { background: #145C2F; transform: translateY(-1px); }
  .btn-danger   { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(160,27,27,0.25); }
  .btn-danger:hover   { background: #FDD9D7; }
  .btn-outline  { background: var(--white); border: 1.5px solid var(--border); color: var(--text-mid); }
  .btn-outline:hover  { background: var(--sky-pale); border-color: var(--sky); color: var(--navy); }
  .btn-sm { padding: 7px 16px; font-size: 13pt; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── MODAL ────────────────────────────────────────── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(7,28,53,0.60);
    backdrop-filter: blur(6px);
    z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 32px;
    width: 780px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-soft);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 26px; padding-bottom: 18px;
    border-bottom: 2px solid var(--sky-pale);
  }
  .modal-title { font-family: var(--font); font-size: 19pt; font-weight: 700; color: var(--navy); }
  .modal-close {
    background: var(--bg); border: 1px solid var(--border);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 18pt; cursor: pointer; color: var(--text-muted);
    transition: all 0.18s; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
  .modal-footer {
    margin-top: 28px; display: flex; justify-content: flex-end; gap: 12px;
    padding-top: 20px; border-top: 1px solid var(--border-soft);
  }

  /* ── MISC ─────────────────────────────────────────── */
  .search-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-bar select { max-width: 230px; }
  .progress-bar { height: 8px; background: var(--sky-light); border-radius: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--navy-mid); border-radius: 8px; transition: width 0.5s; }
  .progress-fill.success { background: var(--success); }
  .progress-fill.warning { background: var(--warning); }
  .loading { display: flex; align-items: center; gap: 14px; color: var(--text-muted); padding: 60px; justify-content: center; font-size: 15pt; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--sky-light); border-top-color: var(--navy-mid); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px; color: var(--text-faint); font-size: 15pt; }
  .location-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .location-name { font-size: 14pt; width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--text-mid); }
  .location-stat { font-size: 13pt; color: var(--text-muted); min-width: 90px; text-align: right; font-weight: 600; }
  .section-divider { border: none; border-top: 1px solid var(--border-soft); margin: 24px 0; }
  .section-heading { font-size: 13pt; font-weight: 700; color: var(--text-mid); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.8px; }

  /* ── INFO BOX ─────────────────────────────────────── */
  .info-box {
    background: var(--sky-pale);
    border: 1px solid var(--sky-light);
    border-left: 4px solid var(--navy-mid);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    margin-bottom: 22px;
  }

  const el = document.createElement('div');
  el.className = 'toast-item ' + (type === 'err' ? 'err' : 'ok'); el.textContent = msg;
  $('toast').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 7000 : 3200);
}
function genPassword(len = 10) {           // ตัดตัวที่สับสนง่าย (0/O, 1/l/I) ออก
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', a = new Uint32Array(len);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a, n => chars[n % chars.length]).join('');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('คัดลอกแล้ว'); } catch (e2) { toast('คัดลอกไม่สำเร็จ — เลือกข้อความแล้วกด Ctrl+C', 'err'); }
    t.remove();
  }
}
async function loadProfile(uid) {
  try {
    const { data, error } = await sb.from('profiles').select('id,name,role,email').eq('id', uid).maybeSingle();
    if (error) throw error;
    return data;
  } catch (e) { console.error('loadProfile', e); return null; }
}

// เรียก Edge Function (รันบนเซิร์ฟเวอร์ — secret key ไม่อยู่ในหน้าเว็บนี้)
async function callFn(action, payload) {
  const { data, error } = await sb.functions.invoke(FUNCTION_NAME, { body: { action, ...(payload || {}) } });
  if (error) {
    let msg = error.message || 'เรียกฟังก์ชันไม่สำเร็จ', status = error.context && error.context.status;
    try { if (error.context && typeof error.context.json === 'function') { const b = await error.context.json(); if (b && b.error) msg = b.error; else if (b && b.message) msg = b.message; } } catch (e) {}
    const e = new Error(msg); e.status = status; e.kind = error.name; throw e;
  }
  if (!data || data.ok === false) throw new Error((data && data.error) || 'เกิดข้อผิดพลาด');
  return data;
}

async function submitLogin() {
  const err = $('login-err'), fail = m => { err.textContent = '❌ ' + m; err.style.display = 'block'; };
  if (!KEY_OK) return fail('ยังไม่ได้ใส่ SUPABASE_ANON_KEY ที่ถูกต้องในโค้ด (ห้ามใช้ secret / service_role key)');
  const email = $('login-email').value.trim(), password = $('login-pw').value;
  if (!email || !password) return fail('กรุณากรอกอีเมลและรหัสผ่าน');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('login-pw').value = ''; return fail(error.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message); }
  const profile = await loadProfile(data.user.id);
  if (!profile) { try { await sb.auth.signOut(); } catch (e) {} return fail('บัญชีนี้ยังไม่ได้ตั้งสิทธิ์ในตาราง profiles'); }
  closeModal(); setRole(profile); await enter();
}
async function logout() {
  try { await sb.auth.signOut(); } catch (e) { console.error(e); }
  state.users = []; state.loaded = false; state.problem = null; setRole(null); renderPage(); toast('ออกจากระบบแล้ว');
}
async function enter() {                      // เข้าหน้าตามสิทธิ์: admin → โหลดรายชื่อ
  if (isAdmin()) await reload(true); else renderPage();
}

async function reload(quiet) {
  try {
    const d = await callFn('list');
    state.users = d.users.sort((a, b) => nat(a.name || a.email, b.name || b.email));
    state.loaded = true; state.problem = null;

  } catch (e) { state.problem = e; state.loaded = false; console.error(e); }

}
function problemHtml(e) {
  const notDeployed = e.status === 404 || /FunctionsFetchError|FunctionsRelayError/.test(e.kind || '') || /Failed to send a request|not found/i.test(e.message);
  const jwt = /invalid jwt/i.test(e.message) || e.status === 401 && /jwt/i.test(e.message);
  if (notDeployed) return `<div class="card"><h3 style="margin-bottom:8px">⚙️ ยังไม่ได้ติดตั้งฟังก์ชัน <code>${esc(FUNCTION_NAME)}</code></h3>
    <p style="margin-bottom:10px">หน้านี้สร้างบัญชีผ่าน Edge Function บนเซิร์ฟเวอร์ Supabase (เพื่อไม่ให้ secret key อยู่ในหน้าเว็บ) ติดตั้งครั้งเดียว:</p>
    <ol style="margin-left:22px;line-height:1.9">
      <li>Supabase Dashboard → <b>Edge Functions</b> → <b>Deploy a new function</b> (เลือก Via Editor)</li>
      <li>ตั้งชื่อฟังก์ชันว่า <code>${esc(FUNCTION_NAME)}</code> แล้ววางโค้ดจากไฟล์ <code>manage-users/index.ts</code> ทั้งไฟล์ → กด <b>Deploy</b></li>
      <li>กลับมาที่หน้านี้แล้วกด "ลองใหม่"</li></ol>
    <p style="margin-top:10px;color:var(--text-muted)">รายละเอียดข้อผิดพลาด: ${esc(e.message)}</p>
    <div style="margin-top:14px"><button class="btn btn-primary" onclick="reload()">${svg('refresh')} ลองใหม่</button></div></div>`;
  if (jwt) return `<div class="card"><h3 style="margin-bottom:8px">🔑 ฟังก์ชันปฏิเสธ token (Invalid JWT)</h3>
    <p style="margin-bottom:10px">เกิดกับโปรเจคที่ใช้ key แบบใหม่ ให้ไปที่ Edge Functions → <code>${esc(FUNCTION_NAME)}</code> → Settings แล้วปิด <b>Verify JWT</b> (ฟังก์ชันตรวจสิทธิ์ด้วยตัวเองอยู่แล้ว ทุกครั้งที่เรียก) จากนั้นกด "ลองใหม่"</p>
    <button class="btn btn-primary" onclick="reload()">${svg('refresh')} ลองใหม่</button></div>`;
  return `<div class="card"><div class="empty">⚠️ โหลดรายชื่อไม่สำเร็จ: ${esc(e.message)}<br><br><button class="btn btn-primary" onclick="reload()">${svg('refresh')} ลองใหม่</button></div></div>`;
}

function renderPage() {

            <option value="__none__">ยังไม่มีสิทธิ์</option><option value="__off__">ปิดใช้งานอยู่</option></select>

function filteredUsers() {
  const rf = $('u-role').value, q = $('u-q').value.trim().toLowerCase();
  state.roleFilter = rf; state.q = $('u-q').value;
  return state.users.filter(u => (!rf || (rf === '__none__' ? !u.hasProfile : rf === '__off__' ? u.disabled : u.role === rf)) &&
    (!q || [u.name, u.email, u.username].some(v => String(v || '').toLowerCase().includes(q))));
}
function applyFilter() {
  const list = filteredUsers();
  const rows = list.map(u => {
    const roleCell = u.isMe
      ? `<span class="badge badge-blue">${esc(roleLabel(u.role))}</span> <span class="muted-s">(คุณ)</span>`
      : `<select class="role-sel" data-id="${esc(u.id)}" onchange="changeRole(this)">
           ${u.hasProfile ? '' : '<option value="" selected>— กำหนดสิทธิ์ —</option>'}
           ${ROLES.map(r => `<option value="${r.key}" ${u.role === r.key ? 'selected' : ''}>${r.label}</option>`).join('')}</select>`;
    const status = u.disabled ? '<span class="badge badge-danger">ปิดใช้งาน</span>'
      : !u.hasProfile ? '<span class="badge badge-warning">ยังไม่มีสิทธิ์</span>' : '<span class="badge badge-success">ใช้งานอยู่</span>';
    const acts = `<div class="btn-group">
      <button class="btn btn-outline btn-sm" data-id="${esc(u.id)}" onclick="openEditModal(this.dataset.id)">${svg('edit')} แก้ไข</button>
      <button class="btn btn-outline btn-sm" data-id="${esc(u.id)}" onclick="openResetModal(this.dataset.id)">${svg('lock')} รหัสผ่าน</button>
      ${u.isMe ? '' : `<button class="btn btn-outline btn-sm" data-id="${esc(u.id)}" onclick="toggleActive(this.dataset.id)">${u.disabled ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</button>
      <button class="btn btn-danger btn-sm" data-id="${esc(u.id)}" onclick="deleteUser(this.dataset.id)">${svg('trash')} ลบ</button>`}</div>`;
    return `<tr data-key="${esc(u.id)}"${u.disabled ? ' style="opacity:.62"' : ''}>
      <td class="sticky-col"><strong>${esc(u.name || '(ไม่มีชื่อ)')}</strong></td><td>${esc(u.email)}</td><td>${esc(u.username)}</td>
      <td>${roleCell}</td><td>${status}</td>
      <td><span class="clip muted">${u.lastSignIn ? esc(fmtDT(u.lastSignIn)) : 'ยังไม่เคยเข้าใช้'}</span></td>
      <td><span class="clip muted">${esc(fmtD(u.createdAt))}</span></td><td class="sticky-act">${acts}</td></tr>`;
  }).join('');
  $('u-summary').textContent = `${list.length} บัญชี` + (state.users.some(u => !u.hasProfile) ? `  ·  ⚠ ยังไม่มีสิทธิ์ ${state.users.filter(u => !u.hasProfile).length} บัญชี` : '');
  $('u-table').innerHTML = list.length
    ? `<table><thead><tr><th class="sticky-col">ชื่อ</th><th>อีเมล (ใช้เข้าสู่ระบบ)</th><th>Username</th><th>สิทธิ์</th><th>สถานะ</th><th>เข้าใช้ล่าสุด</th><th>สร้างเมื่อ</th><th class="sticky-act"></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">ไม่พบบัญชีที่ตรงกับการค้นหา</div>`;
  applySelection(); fitTables();
}
function applySelection() {
  document.querySelectorAll('#content tbody tr[data-key]').forEach(tr => tr.classList.toggle('selected-row', state.sel !== null && tr.dataset.key === String(state.sel)));
}
$('content').addEventListener('click', e => { const tr = e.target.closest('tbody tr[data-key]'); if (tr) { state.sel = tr.dataset.key; applySelection(); } });
function fitTables() {
  document.querySelectorAll('#content .table-wrap.fit').forEach(el => {
    const top = el.getBoundingClientRect().top + window.scrollY, h = Math.max(260, window.innerHeight - top - 24);
    el.style.maxHeight = h + 'px';
    const over = document.documentElement.scrollHeight - window.innerHeight;
    if (over > 0) el.style.maxHeight = Math.max(260, h - over) + 'px';
  });
}
window.addEventListener('resize', fitTables);

async function submitAdd(btn) {
  const err = $('n-err'), fail = m => { err.textContent = '❌ ' + m; err.style.display = 'block'; };
  const v = { name: $('n-name').value.trim(), email: $('n-email').value.trim().toLowerCase(), username: $('n-username').value.trim(), role: $('n-role').value, password: $('n-pw').value };
  if (!v.name) return fail('กรุณากรอกชื่อ-สกุล');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return fail('รูปแบบอีเมลไม่ถูกต้อง');
  if (!v.role) return fail('กรุณาเลือกสิทธิ์');
  if (v.password.length < 8) return fail('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร');
  btn.disabled = true;
  try {
    await callFn('create', v);

    <div class="form-group"><label>Username</label><input id="e-username" value="${esc(u.username)}"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" data-id="${esc(id)}" onclick="submitEdit(this)">${svg('save')} บันทึก</button></div>`;
  $('modal').classList.add('show'); setTimeout(() => $('e-name').focus(), 30);
}
async function submitEdit(btn) {
  const u = userOf(btn.dataset.id), name = $('e-name').value.trim(), username = $('e-username').value.trim();
  if (!name) return toast('กรุณากรอกชื่อ-สกุล', 'err');
  const payload = { id: u.id, name, username };
  if (!u.hasProfile) return toast('บัญชีนี้ยังไม่มีสิทธิ์ — เลือกสิทธิ์ในคอลัมน์ "สิทธิ์" ก่อน', 'err');
  btn.disabled = true;
  try { await callFn('update', payload); closeModal(); await reload(true); toast('บันทึกแล้ว'); }
  catch (e) { btn.disabled = false; toast(e.message, 'err'); }
}
async function changeRole(sel) {
  const u = userOf(sel.dataset.id), role = sel.value; if (!u || !role) return;
  if (!confirm(`เปลี่ยนสิทธิ์ของ ${nameOf(u)} เป็น ${roleLabel(role)} ?\n\n${(ROLES.find(r => r.key === role) || {}).desc || ''}`)) { sel.value = u.role || ''; return; }
  try { await callFn('update', { id: u.id, role }); await reload(true); toast(`เปลี่ยนสิทธิ์ ${nameOf(u)} เป็น ${roleLabel(role)} แล้ว`); }
  catch (e) { sel.value = u.role || ''; toast(e.message, 'err'); }
}
function openResetModal(id) {
  const u = userOf(id); if (!u) return;
  $('modal-box').classList.remove('wide'); $('modal-title').textContent = '🔑 ตั้งรหัสผ่านใหม่';
  $('modal-body').innerHTML = `
    <div class="muted-s" style="margin-bottom:12px">บัญชี: <b>${esc(nameOf(u))}</b> (${esc(u.email)})</div>${pwField('r-pw')}
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" data-id="${esc(id)}" onclick="submitReset(this)">${svg('save')} ตั้งรหัสผ่านใหม่</button></div>`;
  $('r-pw').value = genPassword(); $('modal').classList.add('show');
}
async function submitReset(btn) {
  const u = userOf(btn.dataset.id), password = $('r-pw').value;
  if (password.length < 8) return toast('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร', 'err');
  btn.disabled = true;
  try { await callFn('reset_password', { id: u.id, password }); showCredentials('ตั้งรหัสผ่านใหม่แล้ว', nameOf(u), u.email, password); }
  catch (e) { btn.disabled = false; toast(e.message, 'err'); }
}
async function toggleActive(id) {
  const u = userOf(id); if (!u) return; const enable = u.disabled;
  if (!confirm(enable ? `เปิดใช้งานบัญชี ${nameOf(u)} อีกครั้ง?` : `ปิดใช้งานบัญชี ${nameOf(u)} ?\n\nจะเข้าสู่ระบบไม่ได้อีก แต่ข้อมูลและประวัติที่เคยบันทึกยังอยู่ (เปิดใช้ใหม่ได้ทุกเมื่อ)`)) return;
  try { await callFn('set_active', { id, active: enable }); await reload(true); toast(enable ? 'เปิดใช้งานแล้ว' : 'ปิดใช้งานแล้ว'); }
  catch (e) { toast(e.message, 'err'); }
}
async function deleteUser(id) {
  const u = userOf(id); if (!u) return;
  if (!confirm(`ลบบัญชี ${nameOf(u)} (${u.email}) ถาวร?\n\nลบแล้วกู้คืนไม่ได้ — ถ้าแค่ไม่ต้องการให้เข้าระบบ แนะนำให้ใช้ "ปิดใช้งาน" แทน`)) return;
  try { await callFn('delete', { id }); if (state.sel === id) state.sel = null; await reload(true); toast('ลบบัญชี ' + nameOf(u) + ' แล้ว'); }
  catch (e) { toast(e.message, 'err'); }
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
(async function init() {
  $('footer-year').textContent = new Date().getFullYear();
  $('asset-link').href = ASSET_PAGE_URL; $('pm-link').href = PM_PAGE_URL;
  if (LOGO_URL) document.querySelectorAll('.brand-logo').forEach(el => {
    const def = el.innerHTML, img = new Image(); img.alt = 'logo'; img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit';
    img.onerror = () => { el.innerHTML = def; el.style.background = ''; el.style.padding = ''; };
    img.src = LOGO_URL; el.innerHTML = ''; el.appendChild(img); el.style.background = '#fff'; el.style.padding = '4px';
  });
  setRole(null); renderPage();
  if (!KEY_OK) { $('content').innerHTML = `<div class="card"><div class="empty">⚠️ ยังไม่ได้ใส่ <b>SUPABASE_ANON_KEY</b> ที่ถูกต้องในโค้ด (ใช้ anon / publishable key เท่านั้น — ห้ามใช้ secret / service_role key)</div></div>`; return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { const p = await loadProfile(data.session.user.id); if (p) { setRole(p); await enter(); } }
  } catch (e) { console.error(e); }
})();

</script>
</body>
</html>
