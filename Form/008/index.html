<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบำรุงรักษาคอมพิวเตอร์ (Supabase)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#0D2B4E; --navy-deep:#071C35; --navy-mid:#1A4A7A; --navy-light:#2D6FA8; --sky:#3B8FD4; --sky-light:#D6E9F8; --sky-pale:#EDF5FC; --gold:#B8952A; --success:#1A6B3A; --success-light:#E3F4EB; --warning:#8A5500; --warning-light:#FFF4DC; --danger:#A01B1B; --danger-light:#FDECEA; --white:#FFFFFF; --bg:#F0F5FB; --surface:#FAFCFF; --border:#C8D8EA; --border-soft:#DDE8F2; --text:#0D1F35; --text-mid:#2C4A6A; --text-muted:#5D7A96; --text-faint:#8CA3B8; --sidebar-w:256px; --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --shadow-sm:0 1px 4px rgba(13,43,78,0.08); --shadow-md:0 4px 16px rgba(13,43,78,0.10); --shadow-lg:0 8px 32px rgba(13,43,78,0.14); }
  body { font-family: 'Noto Sans Thai', 'Sarabun', sans-serif; font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; }

  /* ── Login ── */
  #login-page { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 100vh; background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-mid) 100%); }
  .login-box { background: var(--white); border-radius: var(--radius-lg); padding: 48px 40px 40px; width: 420px; max-width: 95vw; box-shadow: var(--shadow-lg); }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo-title { font-family: 'Noto Serif Thai', serif; font-size: 20px; font-weight: 700; color: var(--navy); }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 14px; color: var(--text-mid); margin-bottom: 6px; }
  .login-field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); }
  .login-btn { width: 100%; padding: 13px; background: var(--navy); color: var(--white); border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }
  .login-btn:hover { background: var(--navy-mid); }
  .user-login-btn { width: 100%; padding: 13px; background: var(--success-light); color: var(--success); border: 1.5px solid rgba(26,107,58,0.25); border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }
  .login-error { background: var(--danger-light); padding: 10px 14px; font-size: 13px; color: var(--danger); margin-bottom: 16px; display: none; border-radius: var(--radius-sm); }

  /* ── Layout ── */
  #app { display: none; width: 100%; }
  #app.show { display: flex; }
  #sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; }
  .sidebar-header { padding: 26px 22px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-logo { color: #FFF; font-family: 'Noto Serif Thai', serif; font-weight: 700; font-size: 17px; line-height: 1.4; }
  .nav-section { padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; padding: 11px 14px; color: rgba(255,255,255,0.78); border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; transition: background .15s; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: var(--navy-light); color: #fff; font-weight: 600; }
  .nav-item.admin-only { display: none; }
  .nav-item.admin-only.show { display: flex; }
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border); }
  .page-title { font-family: 'Noto Serif Thai', serif; font-size: 20px; font-weight: 700; color: var(--navy); }
  .content { padding: 32px; }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .badge.admin { background: var(--sky-light); color: var(--navy-mid); }
  .badge.user { background: var(--success-light); color: var(--success); }
  .badge.ok { background: var(--success-light); color: var(--success); }
  .badge.wait { background: var(--warning-light); color: var(--warning); }

  /* ── Components ── */
  .btn { padding: 8px 16px; border: 1.5px solid var(--border); background: var(--white); color: var(--text-mid); border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--sky-pale); }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.primary:hover { background: var(--navy-mid); }
  .btn.danger { color: var(--danger); border-color: rgba(160,27,27,0.3); }
  .btn.danger:hover { background: var(--danger-light); }
  .btn.small { padding: 4px 12px; font-size: 13px; }
  .logout-btn { padding: 7px 16px; border: 1.5px solid var(--border); background: #fff; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-mid); }
  .logout-btn:hover { background: var(--danger-light); color: var(--danger); }

  .card { background: var(--white); border: 1px solid var(--border-soft); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 22px 24px; margin-bottom: 24px; }
  .card h3 { font-family: 'Noto Serif Thai', serif; font-size: 17px; color: var(--navy); margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--white); border: 1px solid var(--border-soft); border-left: 4px solid var(--sky); border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .stat.good { border-left-color: var(--success); }
  .stat.warn { border-left-color: var(--gold); }
  .stat-num { font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .stat-label { font-size: 14px; color: var(--text-muted); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .table-wrap { background: var(--white); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow-x: auto; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; background: var(--sky-pale); color: var(--navy); font-weight: 600; font-size: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border-soft); font-size: 15px; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }
  .empty { padding: 36px; text-align: center; color: var(--text-muted); }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .field label { display: block; font-size: 14px; color: var(--text-mid); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus, .login-field input:focus { outline: 2px solid var(--sky); outline-offset: 1px; border-color: var(--sky); }
  .field.full { grid-column: 1 / -1; }

  .error-box { background: var(--danger-light); border: 1px solid rgba(160,27,27,0.25); color: var(--danger); border-radius: var(--radius-md); padding: 18px 22px; }
  .error-box b { display: block; margin-bottom: 6px; }
  .error-box code { background: rgba(255,255,255,0.7); padding: 1px 6px; border-radius: 4px; }
  .loading { color: var(--text-muted); }

  /* ── Modal (เดิมไม่มี CSS ทำให้ปุ่ม ✕ โผล่มุมขวาบน) ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(7,28,53,0.55); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: var(--radius-lg); width: 520px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border-soft); }
  .modal-title { font-family: 'Noto Serif Thai', serif; font-weight: 700; color: var(--navy); font-size: 18px; }
  .modal-close { border: none; background: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
  #modal-body { padding: 24px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  @media (max-width: 800px) {
    #sidebar { position: static; width: 100%; height: auto; }
    #app.show { flex-direction: column; }
    #main { margin-left: 0; }
    .content { padding: 16px; }
    .topbar { padding: 0 16px; }
  }
</style>

</head>
<body>

<div id="login-page">
  <div class="login-box">
    <div class="login-logo"><div class="login-logo-title">ระบบบำรุงรักษาคอมพิวเตอร์</div></div>
    <div class="login-field">
      <label for="admin-password">รหัสผ่าน Admin</label>
      <input type="password" id="admin-password" placeholder="ใส่รหัสผ่าน Admin" onkeydown="if(event.key==='Enter')loginAdmin()">
    </div>
    <div class="login-error" id="login-error">❌ รหัสผ่านไม่ถูกต้อง</div>
    <button class="login-btn" onclick="loginAdmin()">เข้าสู่ระบบ (Admin)</button>
    <div style="text-align:center;margin:16px 0;color:#8CA3B8;">─── หรือ ───</div>
    <button class="user-login-btn" onclick="loginUser()">👁 เข้าดูข้อมูล (ไม่ต้องรหัส)</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">ระบบบำรุงรักษา<br>คอมพิวเตอร์</div>
    </div>
    <div class="nav-section">
      <div class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">Dashboard</div>
      <div class="nav-item admin-only" data-page="record-pm" onclick="showPage('record-pm')">บันทึก PM</div>
      <div class="nav-item" data-page="history" onclick="showPage('history')">ประวัติการ PM</div>
      <div class="nav-item" data-page="computers" onclick="showPage('computers')">ข้อมูลเครื่อง</div>
      <div class="nav-item admin-only" data-page="staff" onclick="showPage('staff')">เจ้าหน้าที่แผนก</div>
      <div class="nav-item admin-only" data-page="users" onclick="showPage('users')">รายชื่อผู้ใช้งาน</div>
    </div>
  </div>

  <div id="main">
    <div class="topbar">
      <div class="page-title" id="page-title">Dashboard</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="role-badge"></span>
        <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── STATE & UTILS ──────────────────────────────────
let state = { page: 'dashboard', role: null, session: null };
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const PAGE_TITLES = { dashboard:'Dashboard', 'record-pm':'บันทึก PM', history:'ประวัติการ PM', computers:'ข้อมูลเครื่อง', staff:'เจ้าหน้าที่แผนก', users:'รายชื่อผู้ใช้งาน' };
const ADMIN_PAGES = ['record-pm', 'staff', 'users'];

const $ = id => document.getElementById(id);
function esc(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? esc(d) : dt.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
}
function openModal(title, html) { $('modal-title').textContent = title; $('modal-body').innerHTML = html; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ── AUTH ────────────────────────────────────────────
async function loginAdmin() {
  const pw = $('admin-password').value;
  const err = $('login-error');
  if (!KEY_OK) { err.textContent = '❌ ยังไม่ได้ใส่ SUPABASE_ANON_KEY จริงในโค้ด'; err.style.display = 'block'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: pw });
  if (error) { err.textContent = '❌ ' + (error.message === 'Invalid login credentials' ? 'รหัสผ่านไม่ถูกต้อง' : error.message); err.style.display = 'block'; return; }
  state.session = data.session;
  startApp('admin');
}
function loginUser() { state.session = null; startApp('user'); }
function startApp(role) {
  state.role = role;
  $('login-page').style.display = 'none';
  $('app').classList.add('show');
  if (role === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.classList.add('show'));
  $('role-badge').innerHTML = role === 'admin' ? '<span class="badge admin">Admin</span>' : '<span class="badge user">ผู้ดูข้อมูล</span>';
  showPage('dashboard');
}
async function logout() {
  if (!confirm('ออกจากระบบ?')) return;
  await sb.auth.signOut();
  location.reload();
}

// ── SUPABASE DATA ACCESS (โยน error ออกมา ไม่กลืนเงียบ) ──
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data || [];
}
const getComputers = () => q(sb.from('pm_computers').select('*').order('id'));
const getStaff     = () => q(sb.from('pm_staff').select('*').order('name'));
const getUsers     = () => q(sb.from('pm_users').select('*').order('name'));
const getRecordPM  = () => q(sb.from('pm_record_pm').select('*').order('record_date', { ascending: false }));

// ── ROUTER ──────────────────────────────────────────
const RENDERERS = {
  dashboard: renderDashboard,
  'record-pm': renderRecordPM,
  history: renderHistory,
  computers: renderComputers,
  staff: () => renderSimpleTable('pm_staff', getStaff, 'เพิ่มเจ้าหน้าที่'),
  users: () => renderSimpleTable('pm_users', getUsers, 'เพิ่มผู้ใช้งาน'),
};

async function showPage(page) {
  if (ADMIN_PAGES.includes(page) && state.role !== 'admin') page = 'dashboard';
  state.page = page;
  $('page-title').textContent = PAGE_TITLES[page] || page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  await renderPage(page);
}

async function renderPage(page) {
  $('content').innerHTML = '<div class="loading">กำลังโหลด...</div>';
  try {
    await RENDERERS[page]();
  } catch (e) {
    console.error(e);
    let hint = '';
    if (!KEY_OK) hint = 'สาเหตุที่น่าจะเป็น: ยังไม่ได้ใส่ <code>SUPABASE_ANON_KEY</code> จริงในโค้ด';
    else if (/permission|policy|RLS|row-level/i.test(e.message)) hint = 'ตาราง Supabase ยังไม่ได้ตั้ง Row Level Security policy ให้อ่านข้อมูลได้';
    else if (/relation|does not exist|schema cache/i.test(e.message)) hint = 'ไม่พบตาราง/คอลัมน์นี้ใน Supabase ตรวจสอบชื่อตารางและคอลัมน์อีกครั้ง';
    $('content').innerHTML = `<div class="error-box"><b>โหลดข้อมูลไม่สำเร็จ</b>${esc(e.message)}<br>${hint}</div>`;
  }
}

// ── DASHBOARD ───────────────────────────────────────
async function renderDashboard() {
  const [computers, records] = await Promise.all([getComputers(), getRecordPM()]);
  const now = new Date();
  const m = now.getMonth() + 1, y = now.getFullYear();

  // รองรับปี ค.ศ. และ พ.ศ. ในคอลัมน์ year, และใช้ record_date เป็นตัวสำรอง
  const isThisMonth = r => {
    if (r.month && r.year) return Number(r.month) === m && (Number(r.year) === y || Number(r.year) === y + 543);
    if (r.record_date) { const d = new Date(r.record_date); return d.getMonth() + 1 === m && d.getFullYear() === y; }
    return false;
  };
  const doneCodes = new Set(records.filter(isThisMonth).map(r => String(r.computer_code)));
  const pending = computers.filter(c => !doneCodes.has(String(c.id)));

  const pendingRows = pending.slice(0, 10).map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.location)}</td></tr>`).join('');
  const recentRows = records.slice(0, 5).map(r => `<tr><td>${fmtDate(r.record_date)}</td><td>${esc(r.computer_code)}</td><td>${esc(r.operator)}</td></tr>`).join('');

  $('content').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${computers.length}</div><div class="stat-label">เครื่องทั้งหมด</div></div>
      <div class="stat good"><div class="stat-num">${computers.length - pending.length}</div><div class="stat-label">PM แล้วเดือน${THAI_MONTHS[m-1]}</div></div>
      <div class="stat warn"><div class="stat-num">${pending.length}</div><div class="stat-label">ยังไม่ได้ PM เดือนนี้</div></div>
      <div class="stat"><div class="stat-num">${records.length}</div><div class="stat-label">บันทึก PM ทั้งหมด</div></div>
    </div>
    <div class="card">
      <h3>เครื่องที่ยังไม่ได้ PM เดือนนี้</h3>
      ${pending.length ? `<div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>สถานที่</th></tr></thead><tbody>${pendingRows}</tbody></table></div>
        ${pending.length > 10 ? `<p style="margin-top:8px;color:var(--text-muted);font-size:14px">และอีก ${pending.length - 10} เครื่อง</p>` : ''}`
        : '<div class="empty">PM ครบทุกเครื่องแล้วในเดือนนี้ 🎉</div>'}
    </div>
    <div class="card">
      <h3>บันทึก PM ล่าสุด</h3>
      ${records.length ? `<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>รหัสเครื่อง</th><th>ผู้ทำ</th></tr></thead><tbody>${recentRows}</tbody></table></div>` : '<div class="empty">ยังไม่มีบันทึก PM</div>'}
    </div>`;
}

// ── บันทึก PM ───────────────────────────────────────
async function renderRecordPM() {
  const [computers, staff] = await Promise.all([getComputers(), getStaff()]);
  const now = new Date();
  const monthOpts = THAI_MONTHS.map((n, i) => `<option value="${i+1}" ${i === now.getMonth() ? 'selected' : ''}>${n}</option>`).join('');
  const yearOpts = [0, -1, -2].map(d => { const y = now.getFullYear() + d; return `<option value="${y}">${y + 543}</option>`; }).join('');
  const compOpts = computers.map(c => `<option value="${esc(c.id)}">${esc(c.id)} — ${esc(c.name)}</option>`).join('');
  const staffOpts = staff.map(s => `<option value="${esc(s.name)}">`).join('');

  $('content').innerHTML = `
    <div class="card">
      <h3>บันทึกผลการบำรุงรักษา</h3>
      <div class="form-grid">
        <div class="field"><label for="pm-computer">เครื่องคอมพิวเตอร์</label><select id="pm-computer"><option value="">— เลือกเครื่อง —</option>${compOpts}</select></div>
        <div class="field"><label for="pm-month">เดือน</label><select id="pm-month">${monthOpts}</select></div>
        <div class="field"><label for="pm-year">ปี (พ.ศ.)</label><select id="pm-year">${yearOpts}</select></div>
        <div class="field"><label for="pm-operator">ผู้ดำเนินการ</label><input id="pm-operator" list="staff-list" placeholder="เลือกหรือพิมพ์ชื่อ"><datalist id="staff-list">${staffOpts}</datalist></div>
        <div class="field full"><label for="pm-remark">หมายเหตุ</label><textarea id="pm-remark" rows="3"></textarea></div>
      </div>
      <div class="modal-actions"><button class="btn primary" onclick="submitPM()">บันทึก PM</button></div>
    </div>`;
}

async function submitPM() {
  const computer_code = $('pm-computer').value;
  const operator = $('pm-operator').value.trim();
  if (!computer_code) return alert('กรุณาเลือกเครื่อง');
  if (!operator) return alert('กรุณาระบุผู้ดำเนินการ');
  const row = {
    computer_code,
    month: parseInt($('pm-month').value),
    year: parseInt($('pm-year').value),   // เก็บเป็น ค.ศ. (Dashboard รองรับทั้ง ค.ศ./พ.ศ.)
    operator,
    remark: $('pm-remark').value.trim(),
    record_date: new Date().toISOString().slice(0, 10),
  };
  const { error } = await sb.from('pm_record_pm').insert(row);
  if (error) return alert('บันทึกไม่สำเร็จ: ' + error.message);
  alert('บันทึกเรียบร้อย');
  showPage('history');
}

// ── ประวัติ PM ──────────────────────────────────────
async function renderHistory() {
  const records = await getRecordPM();
  const isAdmin = state.role === 'admin';
  const rows = records.map(r => `<tr>
    <td>${fmtDate(r.record_date)}</td>
    <td>${esc(r.computer_code)}</td>
    <td>${r.month ? THAI_MONTHS[r.month - 1] : ''}</td>
    <td>${esc(r.operator)}</td>
    <td>${esc(r.remark)}</td>
    ${isAdmin ? `<td><button class="btn danger small" data-id="${esc(r.id)}" onclick="deletePM(this.dataset.id)">ลบ</button></td>` : ''}
  </tr>`).join('');
  $('content').innerHTML = records.length
    ? `<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>รหัสเครื่อง</th><th>รอบเดือน</th><th>ผู้ทำ</th><th>หมายเหตุ</th>${isAdmin ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`
    : '<div class="card empty">ยังไม่มีประวัติการ PM</div>';
}

async function deletePM(id) {
  if (!confirm('ยืนยันการลบ?')) return;
  const { error } = await sb.from('pm_record_pm').delete().eq('id', id);
  if (error) alert(error.message); else renderHistory();
}

// ── ข้อมูลเครื่อง ────────────────────────────────────
async function renderComputers() {
  const computers = await getComputers();
  const isAdmin = state.role === 'admin';
  const rows = computers.map(c => `<tr>
    <td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.location)}</td><td>${esc(c.ip)}</td>
    ${isAdmin ? `<td><button class="btn danger small" data-id="${esc(c.id)}" onclick="deleteComputer(this.dataset.id)">ลบ</button></td>` : ''}
  </tr>`).join('');
  $('content').innerHTML = `
    <div class="toolbar">
      <div style="color:var(--text-muted)">ทั้งหมด ${computers.length} เครื่อง</div>
      ${isAdmin ? '<button class="btn primary" onclick="openComputerForm()">+ เพิ่มเครื่อง</button>' : ''}
    </div>
    ${computers.length
      ? `<div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>สถานที่</th><th>IP</th>${isAdmin ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="card empty">ยังไม่มีข้อมูลเครื่อง</div>'}`;
}

function openComputerForm() {
  openModal('เพิ่มเครื่องคอมพิวเตอร์', `
    <div class="form-grid">
      <div class="field"><label>รหัสเครื่อง</label><input id="c-id"></div>
      <div class="field"><label>ชื่อเครื่อง</label><input id="c-name"></div>
      <div class="field"><label>สถานที่</label><input id="c-location"></div>
      <div class="field"><label>IP</label><input id="c-ip"></div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveComputer()">บันทึก</button></div>`);
}
async function saveComputer() {
  const row = { id: $('c-id').value.trim(), name: $('c-name').value.trim(), location: $('c-location').value.trim(), ip: $('c-ip').value.trim() };
  if (!row.id || !row.name) return alert('กรุณากรอกรหัสและชื่อเครื่อง');
  const { error } = await sb.from('pm_computers').insert(row);
  if (error) return alert(error.message);
  closeModal(); renderComputers();
}
async function deleteComputer(id) {
  if (!confirm('ยืนยันการลบ?')) return;
  const { error } = await sb.from('pm_computers').delete().eq('id', id);
  if (error) alert(error.message); else renderComputers();
}

// ── เจ้าหน้าที่ / ผู้ใช้งาน (แสดงทุกคอลัมน์ที่มีในตารางอัตโนมัติ) ──
async function renderSimpleTable(table, getter, addLabel) {
  const rows = await getter();
  const cols = rows.length ? Object.keys(rows[0]).filter(k => k !== 'created_at') : ['id', 'name'];
  const body = rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}
    <td><button class="btn danger small" data-id="${esc(r.id)}" onclick="deleteRow('${table}', this.dataset.id)">ลบ</button></td></tr>`).join('');
  $('content').innerHTML = `
    <div class="toolbar">
      <div style="color:var(--text-muted)">ทั้งหมด ${rows.length} รายการ</div>
      <button class="btn primary" onclick="addNamedRow('${table}')">+ ${addLabel}</button>
    </div>
    ${rows.length
      ? `<div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>`
      : '<div class="card empty">ยังไม่มีข้อมูล</div>'}`;
}
function addNamedRow(table) {
  openModal('เพิ่มรายการ', `
    <div class="field"><label>ชื่อ</label><input id="n-name"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveNamedRow('${table}')">บันทึก</button></div>`);
}
async function saveNamedRow(table) {
  const name = $('n-name').value.trim();
  if (!name) return alert('กรุณากรอกชื่อ');
  const { error } = await sb.from(table).insert({ name });
  if (error) return alert(error.message);
  closeModal(); showPage(state.page);
}
async function deleteRow(table, id) {
  if (!confirm('ยืนยันการลบ?')) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) alert(error.message); else showPage(state.page);
}

// ── INIT ────────────────────────────────────────────
// กลับเข้าโหมด admin อัตโนมัติถ้ามี session อยู่แล้ว
sb.auth.getSession().then(({ data }) => {
  if (data && data.session) { state.session = data.session; startApp('admin'); }
});
</script>
</body>
</html>
