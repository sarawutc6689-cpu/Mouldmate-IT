<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยื่นคำขอ IT | IT Request System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px;
  }
  .top-bar {
    max-width: 700px; width: 100%; margin-bottom: 20px;
  }
  .top-bar a {
    color: white; text-decoration: none; font-size: 14px; opacity: 0.9;
  }
  .header { text-align: center; color: white; margin-bottom: 30px; }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: 0.9; }

  .card {
    background: white; border-radius: 20px; padding: 36px;
    max-width: 700px; width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .section-title {
    font-size: 15px; font-weight: 700; color: #667eea;
    margin: 24px 0 14px; padding-bottom: 8px;
    border-bottom: 2px solid #f0f0ff;
  }
  .section-title:first-child { margin-top: 0; }

  .form-group { margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  label {
    display: block; font-size: 13px; font-weight: 600;
    color: #444; margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0f0;
    border-radius: 10px; font-size: 14px; font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #667eea;
  }
  textarea { resize: vertical; min-height: 80px; }

  .search-group { display: flex; gap: 8px; }
  .search-group input { flex: 1; }
  .btn-search {
    padding: 0 18px; background: #667eea; color: white; border: none;
    border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    white-space: nowrap;
  }
  .btn-search:hover { background: #5568d3; }

  .autofill-box {
    background: #f7f7ff; border-radius: 10px; padding: 12px 16px;
    margin-top: 10px; font-size: 13px; color: #555; display: none;
  }
  .autofill-box.show { display: block; }
  .autofill-box b { color: #333; }

  .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
  .radio-option {
    display: flex; align-items: center; gap: 6px; font-size: 14px;
  }
  .radio-option input { width: auto; }

  .btn-submit {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 12px; font-size: 16px;
    font-weight: 700; cursor: pointer; margin-top: 24px;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    padding: 14px 18px; border-radius: 10px; font-size: 14px;
    margin-top: 16px; display: none;
  }
  .msg.success { background: #e6f9ed; color: #1a7f4b; display: block; }
  .msg.error { background: #fde8e8; color: #c0392b; display: block; }
  .ticket-id { font-weight: 700; font-size: 16px; }
</style>
</head>
<body>

  <div class="top-bar"><a href="index.html">← กลับหน้าหลัก</a></div>

  <div class="header">
    <h1>📝 แบบฟอร์มคำขอใช้งานระบบ IT</h1>
    <p>กรุณากรอกข้อมูลให้ครบถ้วนเพื่อดำเนินการอนุมัติ</p>
  </div>

  <div class="card">
    <form id="requestForm">

      <div class="section-title">ข้อมูลผู้ยื่นคำขอ</div>
      <div class="form-group">
        <label>รหัสพนักงานผู้ยื่นคำขอ</label>
        <div class="search-group">
          <input type="text" id="requesterCode" placeholder="กรอกรหัสพนักงาน">
          <button type="button" class="btn-search" onclick="searchRequester()">ค้นหา</button>
        </div>
        <div class="autofill-box" id="requesterInfo"></div>
      </div>

      <div class="section-title">ข้อมูลผู้ใช้งาน (เจ้าของบัญชี)</div>
      <div class="form-group">
        <label>รหัสพนักงานผู้ใช้งาน</label>
        <div class="search-group">
          <input type="text" id="targetCode" placeholder="กรอกรหัสพนักงาน">
          <button type="button" class="btn-search" onclick="searchTarget()">ค้นหา</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ชื่อ-นามสกุล (ไทย)</label>
          <input type="text" id="nameThai" readonly>
        </div>
        <div class="form-group">
          <label>Name (English)</label>
          <input type="text" id="nameEng" readonly>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>แผนก</label>
          <input type="text" id="department" readonly>
        </div>
        <div class="form-group">
          <label>ตำแหน่ง</label>
          <input type="text" id="position" readonly>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ฝ่าย/Section</label>
          <input type="text" id="section" readonly>
        </div>
        <div class="form-group">
          <label>เบอร์โทรศัพท์</label>
          <input type="text" id="telephone" readonly>
        </div>
      </div>

      <div class="section-title">รายละเอียดคำขอ</div>
      <div class="form-group">
        <label>ประเภทคำขอ</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="emailType" value="สร้างบัญชีใหม่" required> สร้างบัญชีใหม่</label>
          <label class="radio-option"><input type="radio" name="emailType" value="แก้ไขสิทธิ์การใช้งาน"> แก้ไขสิทธิ์</label>
          <label class="radio-option"><input type="radio" name="emailType" value="ยกเลิกบัญชี"> ยกเลิกบัญชี</label>
        </div>
      </div>
      <div class="form-group">
        <label>วัตถุประสงค์</label>
        <textarea id="objective" required placeholder="ระบุเหตุผล/วัตถุประสงค์ของการขอ"></textarea>
      </div>
      <div class="form-group">
        <label>หมายเหตุเพิ่มเติม</label>
        <textarea id="comment" placeholder="(ถ้ามี)"></textarea>
      </div>

      <div class="section-title">ผู้อนุมัติ</div>
      <div class="form-group">
        <label>เลือกผู้อนุมัติ</label>
        <select id="approvalManager" required>
          <option value="">-- กำลังโหลดรายชื่อ --</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ส่งคำขอ</button>
      <div class="msg" id="msgBox"></div>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'YOUR_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let targetEmployee = null;

  async function loadApprovers() {
    const { data, error } = await supabase.from('approvers').select('name, section, position').order('name');
    const select = document.getElementById('approvalManager');
    if (error || !data) {
      select.innerHTML = '<option value="">โหลดรายชื่อไม่สำเร็จ</option>';
      return;
    }
    select.innerHTML = '<option value="">-- เลือกผู้อนุมัติ --</option>' +
      data.map(a => `<option value="${a.name}">${a.name} (${a.position || '-'})</option>`).join('');
  }

  async function searchRequester() {
    const code = document.getElementById('requesterCode').value.trim();
    if (!code) return;
    const { data, error } = await supabase.from('employees').select('*').eq('employees_code', code).maybeSingle();
    const box = document.getElementById('requesterInfo');
    if (error || !data) {
      box.textContent = 'ไม่พบรหัสพนักงานนี้ในระบบ';
      box.classList.add('show');
      return;
    }
    box.innerHTML = `<b>${data.name_thai}</b> — ${data.position || '-'} | ${data.department || '-'}`;
    box.classList.add('show');
  }

  async function searchTarget() {
    const code = document.getElementById('targetCode').value.trim();
    if (!code) return;
    const { data, error } = await supabase.from('employees').select('*').eq('employees_code', code).maybeSingle();
    if (error || !data) {
      showMsg('error', 'ไม่พบรหัสพนักงานผู้ใช้งานนี้ในระบบ');
      return;
    }
    targetEmployee = data;
    document.getElementById('nameThai').value = data.name_thai || '';
    document.getElementById('nameEng').value = data.name_eng || '';
    document.getElementById('department').value = data.department || '';
    document.getElementById('position').value = data.position || '';
    document.getElementById('section').value = data.section || '';
    document.getElementById('telephone').value = data.telephone || '';
  }

  function showMsg(type, text) {
    const box = document.getElementById('msgBox');
    box.className = 'msg ' + type;
    box.innerHTML = text;
  }

  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!targetEmployee) {
      showMsg('error', 'กรุณาค้นหาและเลือกข้อมูลผู้ใช้งานก่อน');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังส่ง...';

    const formData = {
      requester_code: document.getElementById('requesterCode').value.trim() || null,
      employees_code: targetEmployee.employees_code,
      name_thai: targetEmployee.name_thai,
      name_eng: targetEmployee.name_eng,
      telephone: targetEmployee.telephone,
      section: targetEmployee.section,
      department: targetEmployee.department,
      position: targetEmployee.position,
      objective: document.getElementById('objective').value.trim(),
      comment: document.getElementById('comment').value.trim() || null,
      approval_manager: document.getElementById('approvalManager').value,
      email_type: document.querySelector('input[name="emailType"]:checked')?.value || null
    };

    const { data, error } = await supabase.from('requests').insert(formData).select('ticket_id').single();

    submitBtn.disabled = false;
    submitBtn.textContent = 'ส่งคำขอ';

    if (error) {
      showMsg('error', 'เกิดข้อผิดพลาด: ' + error.message);
      return;
    }

    showMsg('success', `ส่งคำขอสำเร็จ! หมายเลขคำขอของคุณคือ <span class="ticket-id">${data.ticket_id}</span>`);
    document.getElementById('requestForm').reset();
    document.getElementById('requesterInfo').classList.remove('show');
    targetEmployee = null;
  });

  loadApprovers();
</script>
</body>
</html>
