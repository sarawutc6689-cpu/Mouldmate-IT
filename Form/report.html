<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานสรุปผล | IT Request System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 30px 20px;
  }
  .top-bar { max-width: 1100px; margin: 0 auto 20px; }
  .top-bar a { color: white; text-decoration: none; font-size: 14px; }
  .header { text-align: center; color: white; margin-bottom: 30px; }
  .header h1 { font-size: 26px; margin-bottom: 6px; }

  .container { max-width: 1100px; margin: 0 auto; }

  .stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px; margin-bottom: 30px;
  }
  .stat-card {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 20px; text-align: center; color: white;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .stat-card .number { font-size: 30px; font-weight: 700; display: block; }
  .stat-card .label { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .chart-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
  }
  .chart-card {
    background: white; border-radius: 16px; padding: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .chart-card h3 { font-size: 15px; margin-bottom: 16px; color: #333; }

  .table-card {
    background: white; border-radius: 16px; padding: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .table-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .table-header h3 { font-size: 16px; color: #333; }
  .filter-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-controls select, .filter-controls input {
    padding: 8px 12px; border: 1.5px solid #e0e0f0; border-radius: 8px; font-size: 13px;
  }
  .btn-export {
    background: #43e97b; color: white; border: none; padding: 9px 18px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  th { color: #888; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.pending { background: #fff3cd; color: #856404; }
  .badge.approved { background: #d4edda; color: #155724; }
  .badge.rejected { background: #f8d7da; color: #721c24; }

  @media (max-width: 700px) {
    .chart-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="top-bar"><a href="index.html">← กลับหน้าหลัก</a></div>

  <div class="header">
    <h1>📊 รายงานสรุปผลคำขอ IT</h1>
  </div>

  <div class="container">
    <div class="stats-bar">
      <div class="stat-card"><span class="number" id="statTotal">–</span><span class="label">ทั้งหมด</span></div>
      <div class="stat-card"><span class="number" id="statPending">–</span><span class="label">รออนุมัติ</span></div>
      <div class="stat-card"><span class="number" id="statApproved">–</span><span class="label">อนุมัติแล้ว</span></div>
      <div class="stat-card"><span class="number" id="statRejected">–</span><span class="label">ปฏิเสธ</span></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>สัดส่วนสถานะคำขอ</h3>
        <canvas id="statusChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>จำนวนคำขอตามแผนก</h3>
        <canvas id="sectionChart"></canvas>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3>รายการคำขอทั้งหมด</h3>
        <div class="filter-controls">
          <select id="filterStatus" onchange="loadTable()">
            <option value="">ทุกสถานะ</option>
            <option value="รออนุมัติ">รออนุมัติ</option>
            <option value="อนุมัติแล้ว">อนุมัติแล้ว</option>
            <option value="ปฏิเสธ">ปฏิเสธ</option>
          </select>
          <input type="text" id="searchBox" placeholder="ค้นหาชื่อ/ticket..." oninput="loadTable()">
          <button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Ticket ID</th><th>ชื่อ</th><th>แผนก</th><th>ประเภท</th><th>สถานะ</th><th>วันที่ยื่น</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRequests = [];
  let statusChartInstance, sectionChartInstance;

  async function loadAll() {
    const { data, error } = await supabase.from('requests').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error.message); return; }
    allRequests = data || [];
    renderStats();
    renderCharts();
    loadTable();
  }

  function renderStats() {
    const total = allRequests.length;
    const pending = allRequests.filter(r => r.status === 'รออนุมัติ').length;
    const approved = allRequests.filter(r => r.status === 'อนุมัติแล้ว').length;
    const rejected = allRequests.filter(r => r.status === 'ปฏิเสธ').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statRejected').textContent = rejected;
  }

  function renderCharts() {
    const statusCounts = {
      'รออนุมัติ': allRequests.filter(r => r.status === 'รออนุมัติ').length,
      'อนุมัติแล้ว': allRequests.filter(r => r.status === 'อนุมัติแล้ว').length,
      'ปฏิเสธ': allRequests.filter(r => r.status === 'ปฏิเสธ').length
    };

    if (statusChartInstance) statusChartInstance.destroy();
    statusChartInstance = new Chart(document.getElementById('statusChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(statusCounts),
        datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#ffc107', '#43e97b', '#f5576c'] }]
      },
      options: { plugins: { legend: { position: 'bottom' } } }
    });

    const sectionCounts = {};
    allRequests.forEach(r => {
      const s = r.section || 'ไม่ระบุ';
      sectionCounts[s] = (sectionCounts[s] || 0) + 1;
    });

    if (sectionChartInstance) sectionChartInstance.destroy();
    sectionChartInstance = new Chart(document.getElementById('sectionChart'), {
      type: 'bar',
      data: {
        labels: Object.keys(sectionCounts),
        datasets: [{ label: 'จำนวนคำขอ', data: Object.values(sectionCounts), backgroundColor: '#667eea' }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  }

  function loadTable() {
    const status = document.getElementById('filterStatus').value;
    const search = document.getElementById('searchBox').value.toLowerCase();

    let filtered = allRequests;
    if (status) filtered = filtered.filter(r => r.status === status);
    if (search) filtered = filtered.filter(r =>
      r.name_thai?.toLowerCase().includes(search) || r.ticket_id?.toLowerCase().includes(search)
    );

    const badgeClass = { 'รออนุมัติ': 'pending', 'อนุมัติแล้ว': 'approved', 'ปฏิเสธ': 'rejected' };
    const tbody = document.getElementById('tableBody');

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding:24px;">ไม่พบข้อมูล</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td>${r.ticket_id}</td>
        <td>${r.name_thai}</td>
        <td>${r.department || '-'}</td>
        <td>${r.email_type || '-'}</td>
        <td><span class="badge ${badgeClass[r.status]}">${r.status}</span></td>
        <td>${new Date(r.created_at).toLocaleDateString('th-TH')}</td>
      </tr>
    `).join('');
  }

  function exportCSV() {
    const headers = ['Ticket ID', 'ชื่อ', 'แผนก', 'ตำแหน่ง', 'ประเภท', 'สถานะ', 'วันที่ยื่น'];
    const rows = allRequests.map(r => [
      r.ticket_id, r.name_thai, r.department, r.position, r.email_type, r.status,
      new Date(r.created_at).toLocaleDateString('th-TH')
    ]);
    let csv = '\uFEFF' + [headers, ...rows].map(row => row.map(v => `"${v || ''}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `it-requests-${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  loadAll();
</script>
</body>
</html>
