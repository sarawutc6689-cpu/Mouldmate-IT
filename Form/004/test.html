<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานการยืมอุปกรณ์สารสนเทศ | ระบบจัดการแบบฟอร์ม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* นำ CSS เดิมของคุณมาไว้ที่นี่ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Sarabun', sans-serif; background: #F0F4FA; color: #1E2F45; line-height: 1.5; font-size: 15px; }
  .app-container { display: flex; min-height: 100vh; }
  .sidebar { width: 280px; background: #FFFFFF; border-right: 1px solid #E4ECF5; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; padding: 20px; box-shadow: 0 0 20px rgba(0, 28, 48, 0.02); }
  .main-content { margin-left: 280px; flex: 1; padding: 28px 36px; width: calc(100% - 280px); }
  .hero-card { background: linear-gradient(115deg, #FFFFFF 0%, #F6FAFF 100%); border-radius: 32px; padding: 24px 32px; margin-bottom: 28px; border: 1px solid #E9F0F8; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
  .summary-card { background: white; border-radius: 28px; padding: 18px 20px; border: 1px solid #E9F0F8; display: flex; align-items: center; gap: 16px; }
  .table-card { background: white; border-radius: 28px; border: 1px solid #ECF3FA; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 16px; border-bottom: 1px solid #F0F6FD; text-align: left; }
  .btn-return-sm { background: #FFFAF0; border: 1px solid #F7DEB4; padding: 5px 14px; border-radius: 30px; color: #B7762E; cursor: pointer; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 45, 70, 0.4); backdrop-filter: blur(3px); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 36px; max-width: 520px; width: 100%; padding: 24px; }
  /* (CSS ส่วนอื่นๆ ที่เหลือของคุณยังทำงานได้ตามปกติ) */
</style>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h2>แบบฟอร์มขอยืมอุปกรณ์</h2>
    <div class="nav-menu">
      <button class="nav-item" onclick="window.location.href='index.html'">📋 แบบฟอร์มขอยืม</button>
      <button class="nav-item active">📊 รายงานการยืม</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <h1>รายงานการยืมอุปกรณ์</h1>
    <div class="hero-card">
      <h2>📋 สรุปสถานะการยืม-คืน</h2>
    </div>
    
    <div class="summary-grid">
      <div class="summary-card"><div><div class="number" id="sumAll">0</div><div class="label">รายการทั้งหมด</div></div></div>
      <div class="summary-card"><div><div class="number" id="sumActive">0</div><div class="label">กำลังยืม</div></div></div>
    </div>

    <div class="table-card">
      <div id="tableContainer">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<!-- Modal Return -->
<div class="modal-overlay" id="returnModal">
  <div class="modal">
    <h3>บันทึกการรับคืน</h3>
    <input type="text" id="returnSignature" placeholder="ชื่อผู้ส่งคืน">
    <input type="date" id="returnDateInput">
    <button onclick="confirmReturn()" id="saveReturnBtn">บันทึกการคืน</button>
    <button onclick="closeModal()">ยกเลิก</button>
  </div>
</div>

<script>
  // ตั้งค่า Supabase
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let fullData = [], currentReturnRecord = null;

  async function loadReports() {
    const { data, error } = await sb
      .from('equipment_requests')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) { alert("โหลดข้อมูลพลาด: " + error.message); return; }

    fullData = (data || []).map(r => ({
      requestNo: r.ticket_id,
      borrowerName: r.employee_name,
      equipment: r.equipment_name,
      returnDate: r.return_date,
      status: r.status
    }));

    renderTable();
  }

  function renderTable() {
    let html = `<table><thead><tr><th>เลขที่คำขอ</th><th>ชื่อผู้ยืม</th><th>อุปกรณ์</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>`;
    fullData.forEach(r => {
      html += `<tr>
        <td>${r.requestNo}</td>
        <td>${r.borrowerName}</td>
        <td>${r.equipment}</td>
        <td>${r.status}</td>
        <td>${!r.returnDate ? `<button class="btn-return-sm" onclick='openReturnModal("${r.requestNo}")'>คืนอุปกรณ์</button>` : 'คืนแล้ว'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('tableContainer').innerHTML = html;
  }

  function openReturnModal(reqNo) {
    currentReturnRecord = { requestNo: reqNo };
    document.getElementById('returnModal').classList.add('show');
  }

  async function confirmReturn() {
    const { error } = await sb.rpc('update_return_status', {
      p_ticket_id: currentReturnRecord.requestNo,
      p_inspector_name: document.getElementById('returnSignature').value,
      p_inspector_note: '',
      p_status: 'คืนแล้ว'
    });

    if (!error) { alert("สำเร็จ!"); location.reload(); }
    else alert("พลาด: " + error.message);
  }

  function closeModal() { document.getElementById('returnModal').classList.remove('show'); }

  window.onload = loadReports;
</script>
</body>
</html>
