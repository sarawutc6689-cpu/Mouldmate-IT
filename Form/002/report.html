<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานคำขอ IT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Sarabun',Tahoma,Geneva,Verdana,sans-serif;}
    :root{--primary:#2F7FB8;--primary-light:#E7F2FB;--primary-bg:#F7FBFE;--white:#ffffff;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;}
    body{background:var(--primary-bg);min-height:100vh;font-size:14px;}

    .topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
    .topbar h1{font-size:17px;color:var(--gray-800);display:flex;align-items:center;gap:10px;}
    .topbar h1 i{color:var(--primary);}
    .btn-ghost{background:var(--gray-50);border:1px solid var(--gray-200);color:var(--gray-600);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn-ghost:hover{background:var(--primary-light);color:var(--primary);}
    .btn-ghost.danger:hover{background:#fee2e2;color:var(--danger);border-color:#fecaca;}

    .content{padding:24px;max-width:1200px;margin:0 auto;}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
    .stat-card{background:var(--white);border-radius:16px;padding:18px;border:1px solid var(--gray-200);text-align:center;}
    .stat-value{font-size:26px;font-weight:800;color:var(--gray-800);}
    .stat-label{font-size:12.5px;color:var(--gray-600);margin-top:4px;}
    .stat-card.pending .stat-value{color:var(--warning);}
    .stat-card.approved .stat-value{color:var(--success);}
    .stat-card.rejected .stat-value{color:var(--danger);}

    .charts-row{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;}
    @media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
    .chart-card{background:var(--white);border-radius:18px;padding:20px;border:1px solid var(--gray-200);}
    .chart-card h3{font-size:15px;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
    .chart-card h3 i{color:var(--primary);}
    .chart-container{height:280px;position:relative;}

    .section-card{background:var(--white);border-radius:18px;padding:20px;border:1px solid var(--gray-200);}
    .section-card h3{font-size:15px;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
    .section-card h3 i{color:var(--primary);}
    table{width:100%;border-collapse:collapse;}
    th{text-align:left;padding:10px 12px;background:var(--gray-50);color:var(--gray-600);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--gray-200);}
    td{padding:10px 12px;border-bottom:1px solid var(--gray-200);color:var(--gray-700);font-size:13px;}
    .empty-state{text-align:center;padding:40px;color:var(--gray-600);}
</style>
</head>
<body>

<div class="topbar">
    <h1><i class="fas fa-chart-bar"></i> รายงานคำขอ IT</h1>
    <div style="display:flex;gap:10px;">
        <a href="approve.html" class="btn-ghost"><i class="fas fa-clipboard-check"></i> หน้าอนุมัติ</a>
        <a href="manage-approvers.html" class="btn-ghost"><i class="fas fa-user-shield"></i> จัดการผู้อนุมัติ</a>
        <button class="btn-ghost danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
    </div>
</div>

<div class="content">
    <div class="stat-row">
        <div class="stat-card pending"><div class="stat-value" id="statPending">-</div><div class="stat-label">รออนุมัติ</div></div>
        <div class="stat-card approved"><div class="stat-value" id="statApproved">-</div><div class="stat-label">อนุมัติแล้ว</div></div>
        <div class="stat-card rejected"><div class="stat-value" id="statRejected">-</div><div class="stat-label">ปฏิเสธ</div></div>
    </div>

    <div class="charts-row">
        <div class="chart-card">
            <h3><i class="fas fa-chart-bar"></i> จำนวนคำขอรายเดือน (6 เดือนล่าสุด)</h3>
            <div class="chart-container"><canvas id="volumeChart"></canvas></div>
        </div>
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> สัดส่วนสถานะ</h3>
            <div class="chart-container"><canvas id="statusChart"></canvas></div>
        </div>
    </div>

    <div class="section-card">
        <h3><i class="fas fa-building"></i> จำนวนคำขอแยกตามฝ่าย</h3>
        <div id="sectionTableWrap">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>กำลังโหลดข้อมูล...</div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL      = 'https://fnbkcgkuykdabbensvif.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ALLOWED_ROLES = ['admin']; // รายงานภาพรวมทุกฝ่าย เปิดเฉพาะ admin
    let currentProfile = null;
    let statsRows = [];
    let volumeChart, statusChart;

    function showAccessDenied(message) {
        document.body.innerHTML = `
            <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--primary-bg,#F7FBFE);padding:20px;">
                <div style="background:#fff;border-radius:24px;padding:44px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.08);border:1px solid #e2e8f0;">
                    <div style="width:64px;height:64px;background:#fee2e2;color:#dc2626;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h2 style="color:#1e293b;font-size:19px;margin-bottom:10px;font-weight:600;">ไม่มีสิทธิ์เข้าถึงหน้านี้</h2>
                    <p style="color:#475569;font-size:14px;margin-bottom:26px;line-height:1.6;">${message}</p>
                    <button onclick="window.location.href='login.html'" style="background:#2F7FB8;color:#fff;border:none;padding:12px 30px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">
                        <i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ
                    </button>
                </div>
            </div>
        `;
    }

    async function requireAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) { window.location.href = 'login.html'; return null; }
        const { data: profile } = await supabaseClient
            .from('profiles').select('name, role').eq('id', session.user.id).maybeSingle();
        if (!profile || !ALLOWED_ROLES.includes(profile.role)) {
            await supabaseClient.auth.signOut();
            showAccessDenied('หน้ารายงานภาพรวมเปิดให้เฉพาะผู้ดูแลระบบ (admin) เท่านั้น');
            return null;
        }
        return profile;
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    }

    window.onload = async function() {
        currentProfile = await requireAuth();
        if (!currentProfile) return;
        await loadStatistics();
    };

    async function loadStatistics() {
        const { data, error } = await supabaseClient.from('request_statistics').select('*');
        if (error) {
            document.getElementById('sectionTableWrap').innerHTML =
                `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${error.message}</div>`;
            return;
        }
        statsRows = data || [];
        renderStats();
        renderVolumeChart();
        renderStatusChart();
        renderSectionTable();
    }

    function renderStats() {
        const sum = status => statsRows.filter(r => r.status === status).reduce((s, r) => s + r.total, 0);
        document.getElementById('statPending').textContent = sum('รออนุมัติ');
        document.getElementById('statApproved').textContent = sum('อนุมัติแล้ว');
        document.getElementById('statRejected').textContent = sum('ปฏิเสธ');
    }

    function renderVolumeChart() {
        const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        const now = new Date();
        const months = [];
        for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            months.push({ year: d.getFullYear(), month: d.getMonth(), label: thaiMonths[d.getMonth()], count: 0 });
        }
        statsRows.forEach(r => {
            if (!r.month) return;
            const d = new Date(r.month);
            const m = months.find(m => m.year === d.getFullYear() && m.month === d.getMonth());
            if (m) m.count += r.total;
        });

        const ctx = document.getElementById('volumeChart').getContext('2d');
        if (volumeChart) volumeChart.destroy();
        volumeChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: months.map(m => m.label), datasets: [{ label: 'จำนวนคำขอ', data: months.map(m => m.count), backgroundColor: '#2F7FB8', borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    function renderStatusChart() {
        const sum = status => statsRows.filter(r => r.status === status).reduce((s, r) => s + r.total, 0);
        const ctx = document.getElementById('statusChart').getContext('2d');
        if (statusChart) statusChart.destroy();
        statusChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['รออนุมัติ', 'อนุมัติแล้ว', 'ปฏิเสธ'],
                datasets: [{ data: [sum('รออนุมัติ'), sum('อนุมัติแล้ว'), sum('ปฏิเสธ')], backgroundColor: ['#f59e0b', '#10b981', '#ef4444'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }

    function renderSectionTable() {
        const bySection = {};
        statsRows.forEach(r => {
            const key = r.section || 'ไม่ระบุฝ่าย';
            if (!bySection[key]) bySection[key] = { total: 0, pending: 0, approved: 0, rejected: 0 };
            bySection[key].total += r.total;
            if (r.status === 'รออนุมัติ') bySection[key].pending += r.total;
            if (r.status === 'อนุมัติแล้ว') bySection[key].approved += r.total;
            if (r.status === 'ปฏิเสธ') bySection[key].rejected += r.total;
        });
        const rows = Object.entries(bySection).sort((a, b) => b[1].total - a[1].total);
        const wrap = document.getElementById('sectionTableWrap');
        if (!rows.length) { wrap.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูล</div>'; return; }
        wrap.innerHTML = `
            <table>
                <thead><tr><th>ฝ่าย</th><th>ทั้งหมด</th><th>รออนุมัติ</th><th>อนุมัติแล้ว</th><th>ปฏิเสธ</th></tr></thead>
                <tbody>
                    ${rows.map(([name, s]) => `
                        <tr><td><strong>${name}</strong></td><td>${s.total}</td><td>${s.pending}</td><td>${s.approved}</td><td>${s.rejected}</td></tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }
</script>
</body>
</html>
