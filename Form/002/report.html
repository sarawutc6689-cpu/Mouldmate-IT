<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานสรุปผล | IT Request System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 30px 20px;
  }
  .top-bar { max-width: 1100px; margin: 0 auto 20px; }
  .top-bar a { color: white; text-decoration: none; font-size: 14px; opacity: 0.9; }

  .header { text-align: center; color: white; margin-bottom: 30px; }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: 0.9; }

  .container { max-width: 1100px; margin: 0 auto; }

  /* Stats */
  .stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .stat-card {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 18px 20px; text-align: center; color: white;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .stat-card .number { font-size: 26px; font-weight: 700; display: block; }
  .stat-card .label { font-size: 12px; opacity: 0.85; margin-top: 4px; }

  /* Card */
  .card {
    background: white; border-radius: 20px; padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 24px;
  }
  .card h2 { font-size: 16px; color: #444; margin-bottom: 18px; }

  .charts-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  .chart-box { position: relative; height: 260px; }
  @media (max-width: 700px) {
    .charts-grid { grid-template-columns: 1fr; }
  }

  /* Filter + table */
  .filter-bar {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    padding: 9px 14px; border-radius: 10px; border: 1.5px solid #e0e0f0; font-size: 13px;
    font-family: inherit;
  }
  .btn-export {
    padding: 9px 18px; background: #43e97b; color: white; border: none;
    border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; margin-left: auto;
  }
  .btn-export:hover { opacity: 0.9; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #f7f7ff; color: #667eea;
    font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f0f5; color: #444; }
  tbody tr:hover { background: #fafaff; }

  .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.pending { background: #fff3cd; color: #856404; }
  .badge.approved { background: #d4edda; color: #155724; }
  .badge.rejected { background: #f8d7da; color: #721c24; }

  .table-scroll { overflow-x: auto; }

  .empty-state { text-align: center; color: #888; padding: 40px 20px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

  .loading { text-align: center; color: white; padding: 40px; opacity: 0.85; }
</style>
</head>
<body>

  <div class="top-bar"><a href="index.html">← กลับหน้าหลัก</a></div>

  <div class="header">
    <h1>📊 รายงานสรุปผลคำขอ IT</h1>
    <p>ภาพรวมสถิติและรายการคำขอทั้งหมดในระบบ</p>
  </div>

  <div class="container">

    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><span class="number" id="statTotal">–</span><span class="label">คำขอทั้งหมด</span></div>
      <div class="stat-card"><span class="number" id="statPending">–</span><span class="label">รออนุมัติ</span></div>
      <div class="stat-card"><span class="number" id="statApproved">–</span><span class="label">อนุมัติแล้ว</span></div>
      <div class="stat-card"><span class="number" id="statRejected">–</span><span class="label">ปฏิเสธ</span></div>
    </div>

    <div class="card">
      <h2>สรุปภาพรวม</h2>
      <div class="charts-grid">
        <div class="chart-box"><canvas id="statusChart"></canvas></div>
        <div class="chart-box"><canvas id="typeChart"></canvas></div>
      </div>
    </div>

    <div class="card">
      <h2>รายการคำขอทั้งหมด</h2>
      <div class="filter-bar">
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">ทุกสถานะ</option>
          <option value="รออนุมัติ">รออนุมัติ</option>
          <option value="อนุมัติแล้ว">อนุมัติแล้ว</option>
          <option value="ปฏิเสธ">ปฏิเสธ</option>
        </select>
        <select id="typeFilter" onchange="applyFilters()">
          <option value="">ทุกประเภท</option>
          <option value="สร้างบัญชีใหม่">สร้างบัญชีใหม่</option>
          <option value="แก้ไขสิทธิ์การใช้งาน">แก้ไขสิทธิ์</option>
          <option value="ยกเลิกบัญชี">ยกเลิกบัญชี</option>
        </select>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อ / เลขคำขอ..." oninput="applyFilters()">
        <button class="btn-export" onclick="exportCSV()">⬇ ส่งออก CSV</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>เลขคำขอ</th>
              <th>ชื่อ-นามสกุล</th>
              <th>แผนก</th>
              <th>ตำแหน่ง</th>
              <th>ประเภท</th>
              <th>ผู้อนุมัติ</th>
              <th>วันที่ยื่น</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8"><div class="loading">กำลังโหลดข้อมูล...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
  const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRequests = [];
  let statusChart = null;
  let typeChart = null;

  const badgeClass = { 'รออนุมัติ': 'pending', 'อนุมัติแล้ว': 'approved', 'ปฏิเสธ': 'rejected' };

  async function loadData() {
    const { data, error } = await supabaseClient
      .from('requests')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="8"><div class="empty-state"><div class="icon">⚠️</div><p>โหลดข้อมูลไม่สำเร็จ: ${error.message}</p></div></td></tr>`;
      return;
    }

    allRequests = data || [];
    updateStats();
    renderCharts();
    applyFilters();
  }

  function updateStats() {
    const total = allRequests.length;
    const pending = allRequests.filter(r => r.status === 'รออนุมัติ').length;
    const approved = allRequests.filter(r => r.status === 'อนุมัติแล้ว').length;
    const rejected = allRequests.filter(r => r.status === 'ปฏิเสธ').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statRejected').textContent = rejected;
  }

  function renderCharts() {
    const statusCounts = {
      'รออนุมัติ': allRequests.filter(r => r.status === 'รออนุมัติ').length,
      'อนุมัติแล้ว': allRequests.filter(r => r.status === 'อนุมัติแล้ว').length,
      'ปฏิเสธ': allRequests.filter(r => r.status === 'ปฏิเสธ').length,
    };

    const typeLabels = [...new Set(allRequests.map(r => r.email_type).filter(Boolean))];
    const typeCounts = typeLabels.map(t => allRequests.filter(r => r.email_type === t).length);

    if (statusChart) statusChart.destroy();
    if (typeChart) typeChart.destroy();

    statusChart = new Chart(document.getElementById('statusChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(statusCounts),
        datasets: [{
          data: Object.values(statusCounts),
          backgroundColor: ['#f6c945', '#43e97b', '#f5576c']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'สัดส่วนตามสถานะ' } }
      }
    });

    typeChart = new Chart(document.getElementById('typeChart'), {
      type: 'bar',
      data: {
        labels: typeLabels.length ? typeLabels : ['ไม่มีข้อมูล'],
        datasets: [{
          label: 'จำนวนคำขอ',
          data: typeCounts.length ? typeCounts : [0],
          backgroundColor: '#667eea'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: true, text: 'จำนวนคำขอตามประเภท' } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }

  function applyFilters() {
    const status = document.getElementById('statusFilter').value;
    const type = document.getElementById('typeFilter').value;
    const search = document.getElementById('searchInput').value.trim().toLowerCase();

    let filtered = allRequests.filter(r => {
      if (status && r.status !== status) return false;
      if (type && r.email_type !== type) return false;
      if (search) {
        const haystack = `${r.ticket_id || ''} ${r.name_thai || ''} ${r.name_eng || ''}`.toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    renderTable(filtered);
  }

  function renderTable(rows) {
    const tbody = document.getElementById('tableBody');
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="icon">📭</div><p>ไม่พบข้อมูลที่ตรงกับเงื่อนไข</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${r.ticket_id || '-'}</td>
        <td>${r.name_thai || '-'}</td>
        <td>${r.department || '-'}</td>
        <td>${r.position || '-'}</td>
        <td>${r.email_type || '-'}</td>
        <td>${r.approval_manager || '-'}</td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleDateString('th-TH') : '-'}</td>
        <td><span class="badge ${badgeClass[r.status] || ''}">${r.status || '-'}</span></td>
      </tr>
    `).join('');
  }

  function exportCSV() {
    const status = document.getElementById('statusFilter').value;
    const type = document.getElementById('typeFilter').value;
    const search = document.getElementById('searchInput').value.trim().toLowerCase();

    const rows = allRequests.filter(r => {
      if (status && r.status !== status) return false;
      if (type && r.email_type !== type) return false;
      if (search) {
        const haystack = `${r.ticket_id || ''} ${r.name_thai || ''} ${r.name_eng || ''}`.toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    const headers = ['เลขคำขอ', 'ชื่อ-นามสกุล', 'แผนก', 'ตำแหน่ง', 'ประเภท', 'ผู้อนุมัติ', 'วันที่ยื่น', 'สถานะ', 'วัตถุประสงค์'];
    const csvRows = rows.map(r => [
      r.ticket_id || '',
      r.name_thai || '',
      r.department || '',
      r.position || '',
      r.email_type || '',
      r.approval_manager || '',
      r.created_at ? new Date(r.created_at).toLocaleDateString('th-TH') : '',
      r.status || '',
      (r.objective || '').replace(/"/g, '""')
    ]);

    let csvContent = '\uFEFF' + headers.join(',') + '\n' +
      csvRows.map(row => row.map(v => `"${v}"`).join(',')).join('\n');

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `it_requests_report_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  }

  loadData();
</script>
</body>
</html>
