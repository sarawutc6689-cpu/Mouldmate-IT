<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - IT Account Request</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Sarabun',Tahoma,Geneva,Verdana,sans-serif;}
    :root{--primary:#2F7FB8;--primary-light:#E7F2FB;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--green-light:#d1fae5;--green:#059669;}
    body{background:#F7FBFE;min-height:100vh;}
    .layout-wrapper{display:flex;min-height:100vh;}

    .sidebar{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);position:sticky;top:0;height:100vh;overflow-y:auto;}
    .sidebar-brand{text-align:center;padding:28px 20px 22px;border-bottom:1px solid var(--gray-200);}
    .sidebar-brand i{width:56px;height:56px;background:var(--primary-light);color:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;}
    .sidebar-brand h1{font-size:16px;font-weight:800;color:var(--gray-800);margin-bottom:3px;}
    .sidebar-brand p{font-size:11.5px;color:var(--gray-600);}
    .sidebar-menu{display:flex;flex-direction:column;gap:4px;padding:16px 12px;}
    .sidebar-menu a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--gray-700);font-size:14px;font-weight:600;transition:.15s;}
    .sidebar-menu a:hover{background:var(--gray-50);}
    .sidebar-menu a.active{background:var(--primary-light);color:var(--primary);}
    .menu-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--gray-100);color:var(--gray-600);}
    .sidebar-menu a.active .menu-icon{background:var(--primary);color:#fff;}
    .menu-badge{margin-left:auto;background:#e11d48;color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;}
    .menu-badge.zero{display:none;}

    .main-content{flex-grow:1;min-width:0;padding:32px 24px;}
    .page{max-width:1000px;margin:0 auto;}
    @media(max-width:820px){.layout-wrapper{flex-direction:column;}.sidebar{width:100%;height:auto;position:relative;}.sidebar-menu{flex-direction:row;overflow-x:auto;}}

    .page-title{font-size:21px;font-weight:800;color:var(--gray-800);margin-bottom:4px;}
    .page-sub{font-size:13.5px;color:var(--gray-600);margin-bottom:24px;}

    .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
    @media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
    .stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:18px;}
    .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px;}
    .stat-value{font-size:24px;font-weight:800;color:var(--gray-800);}
    .stat-label{font-size:12px;color:var(--gray-600);margin-top:2px;}
    .icon-blue{background:#dbeafe;color:#2563eb;}
    .icon-purple{background:#ede9fe;color:#7c3aed;}
    .icon-orange{background:#fef3c7;color:#d97706;}
    .icon-green{background:var(--green-light);color:var(--green);}
    .icon-red{background:#fee2e2;color:var(--danger);}

    .chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
    @media(max-width:820px){.chart-grid{grid-template-columns:1fr;}}
    .chart-card{background:#fff;border:1px solid var(--gray-200);border-radius:18px;padding:20px;}
    .chart-card h3{font-size:14.5px;font-weight:700;color:var(--gray-800);margin-bottom:16px;}
    .section-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700);}
    .section-row:last-child{border:none;}
    .section-row b{color:var(--primary);}
</style>
</head>
<body>
<div class="layout-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-key"></i>
            <h1>IT Account Request</h1>
            <p>ระบบขอ Username/Password</p>
        </div>
        <nav class="sidebar-menu">
            <a href="form.html"><span class="menu-icon"><i class="fas fa-plus-circle"></i></span>แจ้งคำขอ</a>
            <a href="approve.html"><span class="menu-icon"><i class="fas fa-clipboard-check"></i></span>อนุมัติคำขอ<span class="menu-badge zero" id="pending-count">0</span></a>
            <a href="dashboard.html" class="active"><span class="menu-icon"><i class="fas fa-chart-pie"></i></span>Dashboard</a>
            <a href="history.html"><span class="menu-icon"><i class="fas fa-history"></i></span>ประวัติคำขอ</a>
            <a href="report.html" id="reportLink" style="display:none;"><span class="menu-icon"><i class="fas fa-chart-bar"></i></span>รายงาน</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page">
            <div class="page-title">Dashboard สรุปคำขอ</div>
            <div class="page-sub">ภาพรวมคำขอ Username/Password ประจำเดือนและปี</div>

            <div class="stat-grid">
                <div class="stat-card"><div class="stat-icon icon-blue"><i class="fas fa-calendar-day"></i></div><div class="stat-value" id="statMonth">0</div><div class="stat-label">คำขอเดือนนี้</div></div>
                <div class="stat-card"><div class="stat-icon icon-purple"><i class="fas fa-calendar"></i></div><div class="stat-value" id="statYear">0</div><div class="stat-label">คำขอปีนี้</div></div>
                <div class="stat-card"><div class="stat-icon icon-orange"><i class="fas fa-hourglass-half"></i></div><div class="stat-value" id="statPending">0</div><div class="stat-label">รออนุมัติ</div></div>
                <div class="stat-card"><div class="stat-icon icon-green"><i class="fas fa-check"></i></div><div class="stat-value" id="statApproved">0</div><div class="stat-label">อนุมัติแล้ว</div></div>
                <div class="stat-card"><div class="stat-icon icon-red"><i class="fas fa-times"></i></div><div class="stat-value" id="statRejected">0</div><div class="stat-label">ปฏิเสธ</div></div>
            </div>

            <div class="chart-grid">
                <div class="chart-card">
                    <h3>จำนวนคำขอรายเดือน (ปีนี้)</h3>
                    <canvas id="monthlyChart" height="230"></canvas>
                </div>
                <div class="chart-card">
                    <h3>สัดส่วนตามฝ่าย (ปีนี้)</h3>
                    <div id="sectionList"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const SUPABASE_URL = 'https://fnbkcgkuykdabbensvif.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuYmtjZ2t1eWtkYWJiZW5zdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDE0MTQsImV4cCI6MjEwNDg3NzQxNH0.L6x3nqAy2rqcxdtzyTs4MHLPubtBqD3Tnk9e97EfEJE';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const monthNames = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

    // โชว์เมนู "รายงาน" เฉพาะ role admin (เหมือนหน้า form.html / approve.html)
    async function checkAdminMenu() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        const { data: profile } = await supabaseClient
            .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
        if (profile?.role === 'admin') {
            document.getElementById('reportLink').style.display = 'flex';
        }
    }

    async function loadDashboard() {
        const { data, error } = await supabaseClient.rpc('get_dashboard_stats');
        if (error) { console.error(error); return; }

        document.getElementById('statMonth').textContent = data.total_month || 0;
        document.getElementById('statYear').textContent = data.total_year || 0;
        document.getElementById('statPending').textContent = data.pending || 0;
        document.getElementById('statApproved').textContent = data.approved || 0;
        document.getElementById('statRejected').textContent = data.rejected || 0;

        // แจ้งเตือน badge อนุมัติ
        const badge = document.getElementById('pending-count');
        if (data.pending > 0) { badge.textContent = data.pending; badge.classList.remove('zero'); }

        // กราฟรายเดือน
        const labels = Array.from({length:12}, (_,i) => monthNames[i]);
        const values = Array(12).fill(0);
        (data.monthly_chart || []).forEach(item => {
            const idx = parseInt(item.month, 10) - 1;
            values[idx] = item.count;
        });

        new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'จำนวนคำขอ', data: values, backgroundColor: '#2F7FB8', borderRadius: 6 }] },
            options: { plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{stepSize:1}} } }
        });

        // สัดส่วนตามฝ่าย
        const sectionList = document.getElementById('sectionList');
        if ((data.by_section || []).length === 0) {
            sectionList.innerHTML = '<div style="color:#94a3b8;font-size:13px;">ยังไม่มีข้อมูล</div>';
        } else {
            sectionList.innerHTML = data.by_section.map(s =>
                `<div class="section-row"><span>${s.section || 'ไม่ระบุ'}</span><b>${s.count}</b></div>`
            ).join('');
        }
    }

    checkAdminMenu();
    loadDashboard();
</script>
</body>
</html>
