<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนคอมพิวเตอร์ (Asset) — FOM 014</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%232563A8%22%2F%3E%3Cg%20transform%3D%22translate%2810%2C10%29%20scale%281.83%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%222.5%22%20y%3D%223.5%22%20width%3D%2219%22%20height%3D%2213%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M8%2021h8M12%2016.5V21%22%2F%3E%3Cpath%20d%3D%22M8%2010l2.6%202.6L16%207.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'AngsanaUPC', 'Angsana New', 'Sarabun', sans-serif;

    /* ── โทนสดใส เปร่งปรั่ง ── */
    --navy:        #2563A8;   /* ฟ้าหลัก สดใส */
    --navy-deep:   #1E4D82;   /* เข้มสำหรับ gradient */
    --navy-mid:    #3B82C4;   /* กลาง */
    --navy-light:  #5FA3DC;   /* อ่อน */
    --sky:         #14B8A6;   /* มินต์ สดชื่น — accent */
    --sky-light:   #B8E8E2;   /* มินต์อ่อน */
    --sky-pale:    #E8F7F5;   /* มินต์จาง */
    --gold:        #F59E0B;   /* เหลืองทอง สว่าง */

    --success:       #10B981;
    --success-light: #D1F4E4;
    --warning:       #F59E0B;
    --warning-light: #FEF3D0;
    --danger:        #EF4444;
    --danger-light:  #FDE4E4;

    --white:      #FFFFFF;
    --bg:         #F0F7FF;    /* ฟ้าอ่อนโปร่งสบาย */
    --surface:    #FAFCFF;
    --border:     #C8DDF2;
    --border-soft:#E1ECF8;
    --text:       #1A2B45;
    --text-mid:   #39537A;
    --text-muted: #6B82A0;
    --text-faint: #9CADC5;

    --sidebar-w:  256px;
    --radius-sm:  8px;
    --radius-md:  12px;
    --radius-lg:  16px;
    --shadow-sm:  0 1px 3px rgba(37,99,168,0.06), 0 1px 2px rgba(37,99,168,0.04);
    --shadow-md:  0 4px 14px rgba(37,99,168,0.09), 0 2px 4px rgba(37,99,168,0.05);
    --shadow-lg:  0 10px 32px rgba(37,99,168,0.13), 0 4px 10px rgba(37,99,168,0.06);
  }

  body {
    font-family: var(--font);
    font-size: 16pt;
    line-height: 1.65;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 0% 0%, rgba(20,184,166,0.06) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(37,99,168,0.06) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN PAGE ────────────────────────────────── */
  #login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(135deg, #1E4D82 0%, #2563A8 50%, #14B8A6 100%);
  }
  .login-box {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 48px 40px 40px;
    width: 420px;
    max-width: 95vw;
    box-shadow: var(--shadow-lg);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--sky) 100%);
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32pt;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(37,99,168,0.30);
  }
  .login-logo-title {
    font-family: var(--font);
    font-size: 20pt; font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .login-logo-sub {
    font-size: 13pt;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .login-roles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .role-btn {
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    cursor: pointer;
    text-align: center;
    background: var(--white);
    transition: all 0.18s;
    font-family: var(--font);
  }
  .role-btn:hover { border-color: var(--sky); background: var(--sky-pale); }
  .role-btn.selected { border-color: var(--navy-mid); background: var(--sky-pale); }
  .role-btn-icon { font-size: 28pt; margin-bottom: 8px; }
  .role-btn-label { font-size: 15pt; font-weight: 700; color: var(--navy); display: block; }
  .role-btn-sub { font-size: 12pt; color: var(--text-muted); }
  .login-field { margin-bottom: 16px; }
  .login-field label { font-size: 13pt; font-weight: 600; color: var(--text-mid); display: block; margin-bottom: 6px; }
  .login-field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-family: var(--font);
    color: var(--text);
    transition: all 0.18s;
    background: var(--surface);
  }
  .login-field input:focus { outline: none; border-color: var(--sky); background: var(--white); box-shadow: 0 0 0 3px rgba(20,184,166,0.18); }
  .login-error {
    background: var(--danger-light);
    border: 1px solid rgba(239,68,68,0.22);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13pt;
    color: var(--danger);
    margin-bottom: 16px;
    display: none;
  }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(37,99,168,0.25);
  }
  .login-btn:hover { box-shadow: 0 4px 14px rgba(37,99,168,0.35); transform: translateY(-1px); }
  .login-divider {
    text-align: center;
    font-size: 13pt;
    color: var(--text-faint);
    margin: 16px 0;
  }
  .user-login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--success) 0%, var(--sky) 100%);
    color: var(--white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15pt;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(16,185,129,0.25);
  }
  .user-login-btn:hover { box-shadow: 0 4px 14px rgba(16,185,129,0.35); transform: translateY(-1px); }

  /* ── ROLE BADGE ────────────────────────────────── */
  .role-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12pt; font-weight: 600;
    margin-right: 10px;
  }
  .role-badge.admin { background: linear-gradient(135deg, #D6E8FF 0%, #B8DDFF 100%); color: var(--navy-deep); }
  .role-badge.user  { background: linear-gradient(135deg, #D1F4E4 0%, #B8EFD8 100%); color: #067A54; }
  .role-badge.tech  { background: linear-gradient(135deg, #FEF3D0 0%, #FDE8AC 100%); color: #92600A; }
  .logout-btn {
    padding: 7px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13pt; font-weight: 600;
    cursor: pointer;
    color: var(--text-mid);
    font-family: var(--font);
    transition: all 0.18s;
  }
  .logout-btn:hover { background: var(--danger-light); color: var(--danger); border-color: rgba(239,68,68,0.30); }

  /* ── SIDEBAR ──────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    z-index: 200;
    box-shadow: 2px 0 20px rgba(37,99,168,0.20);
  }
  .sidebar-header {
    padding: 26px 22px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: rgba(0,0,0,0.12);
  }
  .sidebar-emblem {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .sidebar-emblem-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold) 0%, #FBBF24 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18pt; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(245,158,11,0.35);
  }
  .sidebar-logo {
    font-family: var(--font);
    font-size: 14pt; font-weight: 700;
    color: #FFFFFF; line-height: 1.4;
  }
  .sidebar-subtitle {
    font-size: 11pt;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.4px;
  }
  .nav-section { padding: 10px 0; }
  .nav-label {
    font-size: 10pt; font-weight: 700;
    color: rgba(255,255,255,0.40);
    text-transform: uppercase; letter-spacing: 2px;
    padding: 10px 22px 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 22px;
    cursor: pointer;
    font-size: 14.5pt;
    color: rgba(255,255,255,0.72);
    transition: all 0.18s ease;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.10); color: #FFFFFF; border-left-color: rgba(255,255,255,0.30); }
  .nav-item.active { background: rgba(20,184,166,0.28); color: #FFFFFF; border-left-color: #5FEEDB; font-weight: 600; }
  .nav-item.active .nav-icon { color: #7FF5E5; }
  .nav-icon { font-size: 17pt; width: 20px; text-align: center; }
  .nav-item.editor-only { display: none; }
  .nav-item.editor-only.show { display: flex; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 22px;
    border-top: 1px solid rgba(255,255,255,0.10);
    background: rgba(0,0,0,0.12);
  }
  .footer-line { font-size: 12pt; color: rgba(255,255,255,0.42); display: flex; align-items: center; gap: 8px; padding: 3px 0; }

  /* ── MAIN ─────────────────────────────────────────── */
  #app { display: none; width: 100%; }
  #app.show { display: flex; }
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border-soft);
    padding: 0 32px;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .topbar::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--sky) 100%);
    opacity: 0.7;
  }
  .page-title { font-family: var(--font); font-size: 19pt; font-weight: 700; color: var(--navy); }
  .page-subtitle { font-size: 13pt; color: var(--text-muted); margin-top: 2px; }
  .content { padding: 32px; flex: 1; }

  /* ── CARDS ────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s;
  }
  .card:hover { box-shadow: var(--shadow-md); }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border-soft);
  }
  .card-title {
    font-family: var(--font);
    font-size: 17pt; font-weight: 700; color: var(--navy);
    display: flex; align-items: center; gap: 10px;
  }
  .card-title-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--sky-pale) 0%, var(--sky-light) 100%);
    border: 1px solid var(--sky-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16pt;
    color: var(--sky);
  }

  /* ── STATS ────────────────────────────────────────── */
  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 28px; }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
    transition: all 0.25s;
  }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; }
  .stat-card.blue::before  { background: linear-gradient(90deg, var(--navy) 0%, var(--navy-light) 100%); }
  .stat-card.green::before { background: linear-gradient(90deg, var(--success) 0%, var(--sky) 100%); }
  .stat-card.amber::before { background: linear-gradient(90deg, var(--warning) 0%, #FBBF24 100%); }
  .stat-card.gray::before  { background: linear-gradient(90deg, var(--text-muted) 0%, var(--text-faint) 100%); }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-label { font-size: 12pt; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .stat-value { font-family: var(--font); font-size: 36pt; font-weight: 700; line-height: 1; margin-bottom: 6px; }
  .stat-sub { font-size: 13pt; color: var(--text-muted); }
  .stat-card.blue  .stat-value { color: var(--navy); }
  .stat-card.green .stat-value { color: var(--success); }
  .stat-card.amber .stat-value { color: var(--warning); }
  .stat-card.gray  .stat-value { color: var(--text-mid); }

  /* ── CHART ────────────────────────────────────────── */
  .chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding: 0 4px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; background: linear-gradient(180deg, var(--sky-light) 0%, var(--sky-pale) 100%); border-radius: 6px 6px 0 0; transition: all 0.4s; min-height: 3px; }
  .bar.active { background: linear-gradient(180deg, var(--navy-mid) 0%, var(--navy) 100%); }
  .bar-val { font-size: 12pt; font-weight: 700; color: var(--navy); }
  .bar-lbl { font-size: 11pt; color: var(--text-muted); }

  /* ── TABLES ───────────────────────────────────────── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 14pt; }
  thead tr { background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%); }
  th { color: rgba(255,255,255,0.92); font-size: 12pt; font-weight: 500; text-transform: uppercase; letter-spacing: 0.6px; padding: 13px 16px; text-align: left; white-space: nowrap; }
  td { padding: 13px 16px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; color: var(--text-mid); }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover td { background: var(--sky-pale); }
  tbody tr[data-key] { cursor: pointer; }
  tbody tr.selected-row td { background: #D4EBFF; }
  tbody tr.selected-row:hover td { background: #C4E3FF; }
  tbody tr.selected-row td:first-child { box-shadow: inset 3px 0 0 var(--navy); }

  /* ── BADGES ───────────────────────────────────────── */
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12pt; font-weight: 600; letter-spacing: 0.2px; }
  .badge-success { background: var(--success-light); color: #067A54; }
  .badge-warning { background: var(--warning-light); color: #92600A; }
  .badge-danger  { background: var(--danger-light);  color: #B91C1C; }
  .badge-blue    { background: var(--sky-light);     color: var(--navy-deep); }
  .badge-gray    { background: var(--bg); color: var(--text-mid); border: 1px solid var(--border-soft); }

  /* ── FORMS ────────────────────────────────────────── */
  .form-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .form-group  { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 13pt; font-weight: 600; color: var(--text-mid); letter-spacing: 0.2px; }
  input, select, textarea {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 15pt;
    font-family: var(--font);
    color: var(--text);
    background: var(--surface);
    width: 100%;
    transition: all 0.18s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--sky);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(20,184,166,0.18);
  }
  input[readonly] { background: var(--bg); color: var(--text-mid); cursor: default; }
  textarea { resize: vertical; min-height: 90px; }

  /* ── CHECKLIST ────────────────────────────────────── */
  .check-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer; font-size: 14pt;
    transition: all 0.18s;
    background: var(--white);
  }
  .check-item:hover { border-color: var(--sky); background: var(--sky-pale); color: var(--navy); }
  .check-item input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; accent-color: var(--sky); }
  .check-item.checked { border-color: var(--success); background: var(--success-light); color: #067A54; font-weight: 600; }

  /* ── BUTTONS ──────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    font-size: 14pt; font-weight: 600;
    cursor: pointer; border: none;
    transition: all 0.18s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .btn-primary  { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%); color: var(--white); box-shadow: 0 2px 8px rgba(37,99,168,0.28); }
  .btn-primary:hover  { box-shadow: 0 4px 14px rgba(37,99,168,0.38); transform: translateY(-1px); }
  .btn-success  { background: linear-gradient(135deg, var(--success) 0%, var(--sky) 100%); color: var(--white); box-shadow: 0 2px 8px rgba(16,185,129,0.28); }
  .btn-success:hover  { box-shadow: 0 4px 14px rgba(16,185,129,0.38); transform: translateY(-1px); }
  .btn-danger   { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239,68,68,0.28); }
  .btn-danger:hover   { background: #FBD0D0; }
  .btn-outline  { background: var(--white); border: 1.5px solid var(--border); color: var(--text-mid); }
  .btn-outline:hover  { background: var(--sky-pale); border-color: var(--sky); color: var(--navy); }
  .btn-sm { padding: 7px 16px; font-size: 13pt; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── MODAL ────────────────────────────────────────── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(30,77,130,0.42);
    backdrop-filter: blur(4px);
    z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 32px;
    width: 780px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-soft);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 26px; padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-title { font-family: var(--font); font-size: 19pt; font-weight: 700; color: var(--navy); }
  .modal-close {
    background: var(--surface); border: 1px solid var(--border);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 18pt; cursor: pointer; color: var(--text-muted);

const svg = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const nat = (a, b) => String(a || '').localeCompare(String(b || ''), 'th', { numeric: true });
const nameKey = v => String(v || '').trim().toUpperCase();
const toCamel = s => s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const toSnake = s => s.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const fromDb  = row => { const o = {}; for (const k in row) o[toCamel(k)] = row[k] == null ? '' : row[k]; return o; };
const toDb    = obj => { const o = {}; for (const k in obj) o[toSnake(k)] = (obj[k] === '' || obj[k] === undefined) ? null : obj[k]; return o; };
function fmtDT(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? String(d) : dt.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast-item ' + (type === 'err' ? 'err' : 'ok');
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6500 : 3200);
}
function friendlyError(err) {
  const msg = (err && err.message) || String(err);
  if (err && err.code === '23505') return 'ข้อมูลนี้มีอยู่ในระบบแล้ว';
  if ((err && err.code === '42501') || /row-level security/i.test(msg)) return 'ไม่มีสิทธิ์ดำเนินการ (ต้องเข้าสู่ระบบด้วยบัญชีที่มีสิทธิ์)';
  return msg;
}
async function run(p) { const { data, error } = await p; if (error) throw error; return data || []; }
// ดึงทีละ 1,000 แถว (Supabase จำกัด 1,000 แถว/ครั้ง)
async function fetchAll(table, order) {
  let all = [], from = 0; const size = 1000;
  while (true) {
    let qy = sb.from(table).select('*');
    if (order) qy = order(qy);
    const data = await run(qy.range(from, from + size - 1));
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}
async function loadProfile(uid) {
  try {
    const { data, error } = await sb.from('profiles').select('id,name,role,email').eq('id', uid).maybeSingle();
    if (error) throw error;
    return data;
  } catch (e) { console.error('loadProfile', e); return null; }
}

  brand:'ยี่ห้อ (Brand)', model:'รุ่น (Model)', sn:'Serial Number', cpu:'CPU', storage:'Harddisk', ram:'RAM', windows:'Windows',

  keyboard:'Keyboard', mouse:'Mouse', ip:'IP Address', vga:'VGA', mainboard:'Mainboard', remark:'หมายเหตุ' };

  ['ข้อมูลหลัก',                 ['department','type','computerName','loginName']],

  ['หมายเหตุ',                   ['remark']],
];
const FORM_KEYS = FORM_GROUPS.flatMap(g => g[1]);
const CHECKS = { '': 'ตรวจสอบข้อมูล: ทุกรายการ', dup: 'ชื่อซ้ำ / ไม่มีชื่อ', nosn: 'ยังไม่มี Serial Number',

function setRole(role, profile) {
  state.role = ROLE_CAN_EDIT.includes(role) || ROLE_CAN_DELETE.includes(role) ? role : 'user';
  state.me = profile || null;
  const badge = $('role-badge'), who = profile && profile.name ? ' · ' + profile.name : '';
  if (state.role === 'admin')           { badge.className = 'role-badge admin'; badge.textContent = '🔐 Admin' + who; }
  else if (state.role === 'technician') { badge.className = 'role-badge tech';  badge.textContent = '🛠 Technician' + who; }
  else if (profile)                     { badge.className = 'role-badge user';  badge.textContent = '👁 ' + (profile.name || 'User') + ' (ดูอย่างเดียว)'; }
  else                                  { badge.className = 'role-badge user';  badge.textContent = '👁 ดูอย่างเดียว'; }
  $('btn-login').style.display  = profile ? 'none' : '';
  $('btn-logout').style.display = profile ? '' : 'none';
  if (state.loadedAt) renderPage();
}
function openLogin() {
  $('modal-box').classList.remove('wide');
  $('modal-title').textContent = 'เข้าสู่ระบบ';
  $('modal-body').innerHTML = `
    <div class="form-group" style="margin-bottom:14px"><label>อีเมล</label>
      <input id="login-email" type="email" autocomplete="username" onkeydown="if(event.key==='Enter') $('login-pw').focus()"></div>
    <div class="form-group"><label>รหัสผ่าน</label>
      <input id="login-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitLogin()"></div>
    <div id="login-err" class="login-error" style="display:none;margin-top:14px"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="submitLogin()">${svg('lock')} เข้าสู่ระบบ</button></div>`;
  $('modal').classList.add('show');
  setTimeout(() => $('login-email') && $('login-email').focus(), 30);
}
async function submitLogin() {
  const err = $('login-err'), fail = m => { err.textContent = '❌ ' + m; err.style.display = 'block'; };
  if (!KEY_OK) return fail('ยังไม่ได้ใส่ SUPABASE_ANON_KEY จริงในโค้ด');
  const email = $('login-email').value.trim(), password = $('login-pw').value;
  if (!email || !password) return fail('กรุณากรอกอีเมลและรหัสผ่าน');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('login-pw').value = ''; return fail(error.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message); }
  const profile = await loadProfile(data.user.id);
  if (!profile) { try { await sb.auth.signOut(); } catch (e) {} return fail('บัญชีนี้ยังไม่ได้ตั้งสิทธิ์ในตาราง profiles — ติดต่อผู้ดูแลระบบ'); }
  closeModal(); setRole(profile.role, profile);
  toast(canEdit() ? 'เข้าสู่ระบบแล้ว — แก้ไขข้อมูลได้' : 'เข้าสู่ระบบแล้ว (บัญชีนี้ดูข้อมูลได้อย่างเดียว)');
}
async function logout() {
  try { await sb.auth.signOut(); } catch (e) { console.error(e); }
  setRole('user', null);
  toast('ออกจากระบบแล้ว');
}

async function loadAssets() {
  const [rows, depts] = await Promise.all([
    fetchAll('assets', q => q.order('id')),
    fetchAll('asset_departments', q => q.order('code')).then(r => r.map(x => x.code)).catch(() => [])
  ]);
  state.assets = rows.map(fromDb).sort((a, b) => nat(a.department, b.department) || nat(a.computerName, b.computerName));
  state.departments = [...new Set([...depts, ...state.assets.map(a => a.department)])].filter(Boolean).sort(nat);
  state.hasAudit = state.assets.length > 0 && 'updatedAt' in state.assets[0];
  state.loadedAt = Date.now();
}
async function refresh(quiet) {
  try { await loadAssets(); renderPage(); if (!quiet) toast('อัปเดตข้อมูลล่าสุดแล้ว'); }
  catch (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + friendlyError(e), 'err'); }
}
function nameCounts() {
  const c = {}; state.assets.forEach(a => { const k = nameKey(a.computerName); if (k) c[k] = (c[k] || 0) + 1; }); return c;
}
const isProblemName = (a, counts) => { const k = nameKey(a.computerName); return !k || counts[k] > 1; };

  const notice = !canEdit()

          <select id="cf-type" onchange="applyFilter()"><option value="">ทุกประเภท</option>${types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select>
          <select id="cf-check" onchange="applyFilter()">${Object.entries(CHECKS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
          <input id="cf-q" oninput="applyFilter()" placeholder="ค้นหา ชื่อเครื่อง / ผู้ใช้ / SN ...">

          <button class="btn btn-outline btn-sm" onclick="exportCsv()" title="ส่งออกรายการที่กรองอยู่เป็นไฟล์ CSV (เปิดใน Excel ได้)">${svg('download')} CSV</button>
          <button class="btn btn-outline btn-sm" onclick="printRegister()">${svg('printer')} พิมพ์ทะเบียน</button>
        </div>
      </div>
      <div class="table-wrap fit compact" id="cf-table"></div>
    </div>`;
  $('cf-dept').value = state.cf.dept; $('cf-type').value = state.cf.type; $('cf-check').value = state.cf.check; $('cf-q').value = state.cf.q;
  applyFilter();
}

function filteredAssets() {
  const d = $('cf-dept').value, t = $('cf-type').value, ck = $('cf-check').value, q = $('cf-q').value.trim().toLowerCase();
  state.cf = { dept: d, type: t, check: ck, q: $('cf-q').value };
  const counts = nameCounts();
  const blank = v => v == null || String(v).trim() === '';
  const passCheck = a => !ck
    || (ck === 'dup' && isProblemName(a, counts))
    || (ck === 'nosn' && blank(a.sn))
    || (ck === 'spare' && (blank(a.loginName) || String(a.loginName).trim() === 'ว่าง'))
    || (ck === 'nodetail' && blank(a.brand) && blank(a.cpu) && blank(a.ram));
  return state.assets.filter(a => (!d || a.department === d) && (!t || a.type === t) && passCheck(a) &&
    (!q || [a.computerName, a.loginName, a.brand, a.model, a.sn, a.cpu, a.department].some(v => String(v || '').toLowerCase().includes(q))));
}

function applyFilter() {
  const list = filteredAssets(), counts = nameCounts();
  const showEdit = canEdit(), showDel = canDelete(), hasAct = showEdit || showDel;
  const rows = list.map(a => {
    const k = nameKey(a.computerName);
    const flag = !k ? ' <span class="badge badge-warning">ไม่มีชื่อ</span>' : counts[k] > 1 ? ' <span class="badge badge-warning">ชื่อซ้ำ</span>' : '';
    const tds = SCREEN_COLS.map(col => {
      if (col === 'computerName') return `<td class="sticky-col"><strong>${esc(a.computerName)}</strong>${flag}</td>`;
      const v = String(a[col] == null ? '' : a[col]);
      return `<td><span class="clip"${v.length > 24 ? ` title="${esc(v)}"` : ''}>${esc(v)}</span></td>`;
    }).join('');
    const upd = state.hasAudit ? `<td><span class="clip muted">${esc(fmtDT(a.updatedAt))}${a.updatedBy ? ' · ' + esc(a.updatedBy) : ''}</span></td>` : '';
    const act = hasAct ? `<td class="sticky-act"><div class="btn-group">
      ${showEdit ? `<button class="btn btn-outline btn-sm" data-id="${esc(a.id)}" onclick="openAssetModal(this.dataset.id)">${svg('edit')} แก้ไข</button>` : ''}
      ${showDel ? `<button class="btn btn-danger btn-sm" data-id="${esc(a.id)}" onclick="deleteAsset(this.dataset.id)">${svg('trash')} ลบ</button>` : ''}
    </div></td>` : '';
    return `<tr data-key="${esc(a.id)}">${tds}${upd}${act}</tr>`;
  }).join('');
  const heads = SCREEN_COLS.map(k => `<th${k === 'computerName' ? ' class="sticky-col"' : ''}>${HEADS[k]}</th>`).join('')
    + (state.hasAudit ? '<th>Last Update</th>' : '') + (hasAct ? '<th class="sticky-act"></th>' : '');
  const n = t => list.filter(a => a.type === t).length;
  const bad = state.assets.filter(a => isProblemName(a, counts)).length;
  $('cf-summary').textContent = `พบ ${list.length} รายการ  (PC: ${n('PC')}  Laptop: ${n('Laptop')})` + (bad ? `  ·  ⚠ ชื่อซ้ำ/ไม่มีชื่อ ${bad} เครื่อง` : '');
  $('cf-table').innerHTML = list.length
    ? `<table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">ไม่พบข้อมูลที่ตรงกับการค้นหา</div>`;
  applySelection(); fitTables();
}

// แถบไฮไลท์สีฟ้าค้างไว้จนกว่าจะเลือกแถวอื่น (จำไว้แม้ค้นหา/รีเฟรช/แก้ไข)
function applySelection() {
  document.querySelectorAll('#content tbody tr[data-key]').forEach(tr => tr.classList.toggle('selected-row', state.sel !== null && tr.dataset.key === String(state.sel)));
}
$('content').addEventListener('click', e => {
  const tr = e.target.closest('tbody tr[data-key]'); if (!tr) return;
  state.sel = tr.dataset.key; applySelection();
});
function fitTables() {
  document.querySelectorAll('#content .table-wrap.fit').forEach(el => {
    const top = el.getBoundingClientRect().top + window.scrollY;
    const h = Math.max(260, window.innerHeight - top - 24);
    el.style.maxHeight = h + 'px';
    const over = document.documentElement.scrollHeight - window.innerHeight;
    if (over > 0) el.style.maxHeight = Math.max(260, h - over) + 'px';
  });
}
window.addEventListener('resize', fitTables);

function closeModal() { $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openAssetModal(id) {
  if (!canEdit()) return toast('เฉพาะผู้ที่ได้รับสิทธิ์เท่านั้นที่เพิ่ม/แก้ไขข้อมูลได้', 'err');
  const a = id ? state.assets.find(x => x.id === id) : null;
  if (id && !a) return toast('ไม่พบเครื่องนี้ (อาจถูกลบไปแล้ว) กรุณารีเฟรช', 'err');
  const val = k => esc(a ? a[k] : '');
  const dep = a ? a.department : state.cf.dept;
  const depList = [...new Set([...state.departments, dep])].filter(Boolean);
  const typeList = [...new Set([...COMPUTER_TYPES, a ? a.type : ''])].filter(Boolean);
  const field = k => {
    if (k === 'department') return `<div class="form-group"><label>${LABELS[k]}</label><select id="f-department" onchange="onDeptChange(this)">
      <option value="">— เลือกแผนก —</option>${depList.map(d => `<option value="${esc(d)}" ${d === dep ? 'selected' : ''}>${esc(d)}</option>`).join('')}
      ${isAdmin() ? '<option value="__new__">＋ เพิ่มแผนกใหม่…</option>' : ''}</select></div>`;
    if (k === 'type') return `<div class="form-group"><label>${LABELS[k]}</label><select id="f-type"><option value="">— เลือกประเภท —</option>
      ${typeList.map(t => `<option value="${esc(t)}" ${a && t === a.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
    if (k === 'remark') return `<div class="form-group full"><label>${LABELS[k]}</label><input id="f-remark" value="${val(k)}"></div>`;
    return `<div class="form-group"><label>${LABELS[k]}</label><input id="f-${k}" value="${val(k)}"></div>`;
  };
  const meta = a && state.hasAudit && a.updatedAt ? `แก้ไขล่าสุด ${esc(fmtDT(a.updatedAt))}${a.updatedBy ? ' โดย ' + esc(a.updatedBy) : ''}` : '';
  $('modal-box').classList.add('wide');
  $('modal-title').textContent = a ? '✏️ แก้ไขข้อมูลเครื่อง' : '➕ เพิ่มเครื่องใหม่';
  $('modal-body').innerHTML = FORM_GROUPS.map(([title, keys]) =>
    `<div class="section-heading">${title}</div><div class="${keys.length === 4 ? 'form-grid-4' : 'form-grid-3'}" style="margin-bottom:12px">${keys.map(field).join('')}</div>`).join('') + `
    <div class="modal-footer"><div class="modal-meta">${meta}</div>
      <button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" id="btn-save" data-id="${esc(a ? a.id : '')}" data-updated="${esc(a ? a.updatedAt : '')}" onclick="saveAsset(this)">${svg('save')} ${a ? 'บันทึกการแก้ไข' : 'เพิ่มเครื่อง'}</button></div>`;
  $('modal').classList.add('show');
  setTimeout(() => { const f = $('f-' + (a ? 'loginName' : 'computerName')); if (f) f.focus(); }, 30);
}

async function onDeptChange(sel) {
  if (sel.value !== '__new__') return;
  const code = (prompt('รหัสแผนกใหม่ (A-Z, 0-9, _ หรือ - ไม่เกิน 12 ตัว เช่น QC2)') || '').trim().toUpperCase();
  if (!code) { sel.value = ''; return; }
  if (!/^[A-Z0-9_-]{1,12}$/.test(code)) { toast('รหัสแผนกใช้ได้เฉพาะ A-Z 0-9 _ - และไม่เกิน 12 ตัว', 'err'); sel.value = ''; return; }
  try {
    if (!state.departments.includes(code)) await run(sb.from('asset_departments').insert({ code }));
    if (!state.departments.includes(code)) state.departments = [...state.departments, code].sort(nat);
    const opt = document.createElement('option'); opt.value = code; opt.textContent = code;
    sel.insertBefore(opt, sel.querySelector('option[value="__new__"]')); sel.value = code;
    toast('เพิ่มแผนก ' + code + ' แล้ว');
  } catch (e) { toast('เพิ่มแผนกไม่สำเร็จ: ' + friendlyError(e), 'err'); sel.value = ''; }
}

// อัปเดตแบบตรวจว่าไม่มีคนแก้ไขซ้อน: ต้องตรงกับเวลาแก้ไขล่าสุดที่โหลดมา ถ้าไม่มีแถวถูกแก้ = ถูกแก้ไปก่อน / ถูกลบ / ไม่มีสิทธิ์
async function updateAsset(id, fields, expectedUpdatedAt) {
  let q = sb.from('assets').update(toDb(fields)).eq('id', id);
  if (state.hasAudit) q = expectedUpdatedAt ? q.eq('updated_at', expectedUpdatedAt) : q.is('updated_at', null);
  const rows = await run(q.select('id'));
  if (rows.length) return;
  const now = await run(sb.from('assets').select('id,updated_at,updated_by').eq('id', id));
  if (!now.length) throw new Error('เครื่องนี้ถูกลบไปแล้วโดยผู้อื่น — กรุณารีเฟรช');
  if (state.hasAudit && String(now[0].updated_at) !== String(expectedUpdatedAt))
    throw new Error(`ข้อมูลนี้ถูกแก้ไขโดย ${now[0].updated_by || 'ผู้อื่น'} ไปก่อนแล้ว — ปิดหน้าต่างนี้ กด "รีเฟรช" แล้วแก้ไขใหม่ (ข้อมูลของคุณยังไม่ถูกบันทึก)`);
  throw new Error('ไม่มีสิทธิ์แก้ไขข้อมูลนี้ (ต้องเข้าสู่ระบบด้วยบัญชี admin หรือ technician)');
}

async function saveAsset(btn) {
  if (!canEdit()) return toast('ไม่มีสิทธิ์แก้ไข', 'err');
  const id = btn.dataset.id, expected = btn.dataset.updated;
  const d = {}; FORM_KEYS.forEach(k => { d[k] = $('f-' + k).value.trim(); });
  if (!d.department || d.department === '__new__' || !d.type || !d.computerName) return toast('กรุณากรอก แผนก / ประเภท / ชื่อเครื่อง', 'err');
  const old = id ? state.assets.find(a => a.id === id) : null;
  const nameChanged = !old || nameKey(old.computerName) !== nameKey(d.computerName);
  if (nameChanged && state.assets.some(a => a.id !== id && nameKey(a.computerName) === nameKey(d.computerName)))
    return toast(`ชื่อเครื่อง "${d.computerName}" มีอยู่แล้ว กรุณาใช้ชื่อที่ไม่ซ้ำ`, 'err');
  btn.disabled = true;
  try {
    let newId = id;
    if (id) await updateAsset(id, d, expected);
    else { const r = await run(sb.from('assets').insert(toDb(d)).select('id')); if (!r.length) throw new Error('ไม่มีสิทธิ์เพิ่มข้อมูล'); newId = r[0].id; }
    closeModal(); state.sel = newId; await loadAssets(); renderPage();
    toast(id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มเครื่องเรียบร้อย');
    const tr = document.querySelector(`#cf-table tr[data-key="${CSS.escape(String(newId))}"]`); if (tr && tr.scrollIntoView) tr.scrollIntoView({ block: 'nearest' });
  } catch (e) { btn.disabled = false; toast(friendlyError(e), 'err'); }
}

async function deleteAsset(id) {
  if (!canDelete()) return toast('เฉพาะ Admin เท่านั้นที่ลบได้', 'err');
  const a = state.assets.find(x => x.id === id); if (!a) return;
  if (!confirm(`ยืนยันการลบเครื่อง ${a.computerName || '(ไม่มีชื่อ)'}${a.loginName ? ' — ผู้ใช้: ' + a.loginName : ''} ?\n\n(ประวัติ PM ของเครื่องนี้ยังคงอยู่ และระบบเก็บสำเนาข้อมูลที่ลบไว้ในประวัติการเปลี่ยนแปลง)`)) return;
  try {
    const rows = await run(sb.from('assets').delete().eq('id', id).select('id'));
    if (!rows.length) throw new Error('ลบไม่สำเร็จ — ไม่มีสิทธิ์ หรือมีผู้อื่นลบเครื่องนี้ไปแล้ว');
    if (state.sel === id) state.sel = null;
    await loadAssets(); renderPage(); toast('ลบเครื่อง ' + (a.computerName || '') + ' แล้ว');
  } catch (e) { toast(friendlyError(e), 'err'); }
}

function buildCsv(list) {
  const cols = [...PRINT_COLS, 'keyboard', 'mouse', 'ip', 'vga', 'mainboard'];
  const heads = cols.map(k => HEADS[k] || LABELS[k].replace(' *', ''));
  const q = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\ufeff' + [heads.map(q).join(','), ...list.map(a => cols.map(k => q(a[k])).join(','))].join('\r\n');
}
function exportCsv() {
  const list = filteredAssets();
  if (!list.length) return toast('ไม่มีข้อมูลที่จะส่งออก', 'err');
  const blob = new Blob([buildCsv(list)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'assets-' + new Date().toLocaleDateString('en-CA') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function errorHint(e) {
  let hint = '';
  if (!KEY_OK) hint = '<br><small>สาเหตุที่น่าจะเป็น: ยังไม่ได้ใส่ SUPABASE_ANON_KEY จริงในโค้ด</small>';
  else if (/does not exist|schema cache|Could not find/i.test(e.message)) hint = '<br><small>ไม่พบตารางหรือคอลัมน์ — ตรวจว่า SUPABASE_URL เป็นโปรเจคที่มีตาราง assets และรัน step1_schema.sql / step3_asset_page.sql แล้ว</small>';
  return esc(friendlyError(e)) + hint;
}
(async function init() {
  $('footer-year').textContent = new Date().getFullYear();
  $('pm-link').href = PM_PAGE_URL;
  if (LOGO_URL) document.querySelectorAll('.brand-logo').forEach(el => {
    const def = el.innerHTML, img = new Image();
    img.alt = 'logo'; img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit';
    img.onerror = () => { el.innerHTML = def; el.style.background = ''; el.style.padding = ''; };
    img.src = LOGO_URL; el.innerHTML = ''; el.appendChild(img); el.style.background = '#fff'; el.style.padding = '4px';
  });
  setRole('user', null);
  try {
    if (KEY_OK) {
      const { data } = await sb.auth.getSession();
      if (data && data.session) { const p = await loadProfile(data.session.user.id); if (p) setRole(p.role, p); }
    }
    await loadAssets(); renderPage();
  } catch (e) {
    console.error(e);
    $('content').innerHTML = `<div class="card"><div class="empty">⚠️ โหลดข้อมูลไม่สำเร็จ: ${errorHint(e)}</div></div>`;
  }
  // เจ้าหน้าที่หลายคนใช้พร้อมกัน: กลับมาที่แท็บนี้หลังผ่านไปเกิน 1 นาที → โหลดข้อมูลล่าสุดให้เอง (ไม่รบกวนตอนกำลังแก้ไขอยู่)
  window.addEventListener('focus', () => {
    if (KEY_OK && state.loadedAt && Date.now() - state.loadedAt > 60000 && !$('modal').classList.contains('show')) refresh(true);
  });
})();
