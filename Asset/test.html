<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนคอมพิวเตอร์ (Asset) — FOM 014</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%233D4A6B%22%2F%3E%3Cg%20transform%3D%22translate%2810%2C10%29%20scale%281.83%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%222.5%22%20y%3D%223.5%22%20width%3D%2219%22%20height%3D%2213%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M8%2021h8M12%2016.5V21%22%2F%3E%3Cpath%20d%3D%22M8%2010l2.6%202.6L16%207.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'Sarabun', 'AngsanaUPC', 'Angsana New', sans-serif;

    --navy:        #3D4A6B;
    --navy-deep:   #2E3852;
    --navy-mid:    #4E5D82;
    --navy-light:  #6B7BA0;
    --sky:         #5B9B9B;
    --sky-light:   #D4E4E2;
    --sky-pale:    #EEF4F3;
    --gold:        #C9A961;

    --success:       #4A8060;
    --success-light: #E6EFE9;
    --warning:       #9A7844;
    --warning-light: #F5EDDD;
    --danger:        #9C5454;
    --danger-light:  #F2E4E4;

    --white:      #FFFFFF;
    --bg:         #F7F5F2;
    --surface:    #FCFBF9;
    --border:     #E0DAD2;
    --border-soft:#EDE8E1;
    --text:       #2A2F3D;
    --text-mid:   #4A5163;
    --text-muted: #7A8091;
    --text-faint: #A5A9B5;

    --sidebar-w:  0px;
    --radius-sm:  8px;
    --radius-md:  12px;
    --radius-lg:  16px;
    --shadow-sm:  0 1px 3px rgba(61,74,107,0.05), 0 1px 2px rgba(61,74,107,0.04);
    --shadow-md:  0 4px 14px rgba(61,74,107,0.07), 0 2px 4px rgba(61,74,107,0.04);
    --shadow-lg:  0 10px 32px rgba(61,74,107,0.10), 0 4px 10px rgba(61,74,107,0.05);
  }

  body {
    font-family: var(--font);
    font-size: 16px;          /* 14 → 16 */
    line-height: 1.65;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    letter-spacing: 0.1px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── ROLE BADGE ── */
  .role-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 13.5px; font-weight: 600;   /* 12 → 13.5 */
  }
  .role-badge.admin { background: var(--sky-light); color: var(--navy-mid); }
  .role-badge.user  { background: var(--success-light); color: var(--success); }
  .role-badge.tech  { background: var(--warning-light); color: var(--warning); }
  .logout-btn {
    padding: 7px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14.5px; font-weight: 600;   /* 13 → 14.5 */
    cursor: pointer;
    color: var(--text-mid);
    font-family: var(--font);
    transition: all 0.18s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .logout-btn:hover { background: var(--danger-light); color: var(--danger); border-color: rgba(156,84,84,0.22); }
  .logout-btn .ic { width: 15px; height: 15px; }

  /* ── MAIN ── */
  #app { display: none; width: 100%; }
  #app.show { display: flex; }
  #main { flex: 1; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border-soft);
    padding: 12px 26px;
    min-height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
    gap: 12px 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .brand .sidebar-emblem-icon { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; }
  .brand .sidebar-emblem-icon .ic { width: 26px; height: 26px; }
  .sidebar-emblem-icon {
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    color: var(--navy-deep);
  }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .page-title { font-family: var(--font); font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.3; }   /* 19 → 22 */
  .page-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.35; }   /* 12.5 → 14 */
  .content { padding: 26px; flex: 1; min-width: 0; }
  .page-foot { text-align: center; color: var(--text-faint); font-size: 13px; padding: 0 20px 16px; }   /* 11.5 → 13 */
  a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }

  /* ── CARDS ── */
  .card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
    min-width: 0;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 15px;
    border-bottom: 1px solid var(--border-soft);
  }
  .card-title {
    font-family: var(--font);
    font-size: 18px; font-weight: 700; color: var(--navy);   /* 16 → 18 */
    display: flex; align-items: center; gap: 10px;
  }
  .card-title-icon {
    width: 32px; height: 32px;
    background: var(--sky-pale);
    border: 1px solid var(--sky-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--sky);
  }
  .card-title-icon .ic { width: 18px; height: 18px; }

  /* ── TABLES ── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }   /* 13 → 15 */
  thead tr { background: var(--navy); }
  th { color: rgba(255,255,255,0.9); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 13px 16px; text-align: left; white-space: nowrap; }   /* 11 → 12.5 */
  td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; color: var(--text-mid); font-size: 15px; }   /* 13 → 15 */
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover td { background: var(--sky-pale); }
  tbody tr[data-key] { cursor: pointer; }
  tbody tr.selected-row td { background: #E4EEEC; }
  tbody tr.selected-row:hover td { background: #DCE9E7; }
  tbody tr.selected-row td:first-child { box-shadow: inset 3px 0 0 var(--sky); }

  /* ── BADGES ── */
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12.5px; font-weight: 600; }   /* 11 → 12.5 */
  .badge-success { background: var(--success-light); color: var(--success); }
  .badge-warning { background: var(--warning-light); color: var(--warning); }
  .badge-danger  { background: var(--danger-light);  color: var(--danger); }
  .badge-blue    { background: var(--sky-light);     color: var(--navy-mid); }
  .badge-gray    { background: var(--bg); color: var(--text-mid); border: 1px solid var(--border-soft); }

  /* ── FORMS ── */
  .form-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
  .form-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px; }
  .form-group  { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 14.5px; font-weight: 600; color: var(--text-mid); letter-spacing: 0.2px; }   /* 13 → 14.5 */
  input, select, textarea {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 13px;
    font-size: 15.5px;          /* 14 → 15.5 */
    font-family: var(--font);
    color: var(--text);
    background: var(--surface);
    width: 100%;
    transition: all 0.18s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--sky);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(91,155,155,0.12);
  }
  input[readonly] { background: var(--bg); color: var(--text-mid); cursor: default; }
  textarea { resize: vertical; min-height: 80px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;   /* 13.5 → 15 */
    cursor: pointer; border: none;
    transition: all 0.2s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .btn .ic { width: 17px; height: 17px; }
  .btn-primary  { background: var(--navy); color: var(--white); box-shadow: 0 1px 3px rgba(61,74,107,0.18); }
  .btn-primary:hover  { background: var(--navy-mid); box-shadow: 0 3px 10px rgba(61,74,107,0.22); }
  .btn-success  { background: var(--success); color: var(--white); box-shadow: 0 1px 3px rgba(74,128,96,0.18); }
  .btn-success:hover  { background: #3F7152; }
  .btn-danger   { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(156,84,84,0.22); }
  .btn-danger:hover   { background: #EAD6D6; }
  .btn-outline  { background: var(--white); border: 1.5px solid var(--border); color: var(--text-mid); }
  .btn-outline:hover  { background: var(--sky-pale); border-color: var(--sky); color: var(--navy); }
  .btn-sm { padding: 7px 14px; font-size: 14px; }   /* 12.5 → 14 */
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(46,56,82,0.42);
    backdrop-filter: blur(4px);
    z-index: 500;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 720px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border-soft);
  }
  .modal.wide { width: 940px; padding: 22px 26px; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; padding-bottom: 15px;
    border-bottom: 1px solid var(--border-soft);
  }
  .modal.wide .modal-header { margin-bottom: 14px; padding-bottom: 12px; }
  .modal-title { font-family: var(--font); font-size: 20px; font-weight: 700; color: var(--navy); }   /* 18 → 20 */
  .modal-close {
    background: var(--surface); border: 1px solid var(--border);
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 18px; cursor: pointer; color: var(--text-muted);
    transition: all 0.18s; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--danger-light); color: var(--danger); border-color: rgba(156,84,84,0.30); }
  .modal-footer {
    margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px;
    padding-top: 18px; border-top: 1px solid var(--border-soft);
  }
  .modal.wide .modal-footer {
    position: sticky; bottom: -22px; z-index: 2; background: var(--white);
    margin: 12px -26px -22px; padding: 14px 26px;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .modal-meta { margin-right: auto; color: var(--text-muted); font-size: 13.5px; align-self: center; }

  /* ── MISC ── */
  .search-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search-bar select { max-width: 200px; }
  .loading { display: flex; align-items: center; gap: 12px; color: var(--text-muted); padding: 50px; justify-content: center; font-size: 15.5px; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--sky-light); border-top-color: var(--sky); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 50px; color: var(--text-faint); font-size: 15.5px; }
  .section-heading { font-size: 14px; font-weight: 700; color: var(--text-mid); margin: 2px 0 8px; display: flex; align-items: center; gap: 7px; text-transform: uppercase; letter-spacing: 0.6px; }   /* 12.5 → 14 */
  .section-heading .ic { width: 17px; height: 17px; }

  /* ── READ-ONLY ── */
  .readonly-notice {
    display: flex; align-items: center; gap: 9px;
    background: var(--warning-light);
    border: 1px solid rgba(154,120,68,0.18);
    border-radius: var(--radius-md);
    padding: 11px 16px;
    font-size: 14.5px;          /* 13 → 14.5 */
    color: var(--warning);
    margin-bottom: 16px;
  }
  .content > .readonly-notice { padding: 10px 15px; margin-bottom: 12px; }

  @media (max-width: 900px) {
    .form-grid, .form-grid-3, .form-grid-4 { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .topbar { padding: 10px 16px; }
    .modal { padding: 20px; }
  }

  /* ── ICONS ── */
  .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.15em; flex-shrink: 0;
        fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  a.btn .ic { width: 17px; height: 17px; }

  /* ── STICKY TABLES ── */
  .table-wrap.fit { overflow: auto; position: relative; }
  .table-wrap.fit table { border-collapse: separate; border-spacing: 0; }
  .table-wrap.fit thead th { position: sticky; top: 0; z-index: 3; background: var(--navy); }
  .table-wrap.fit tbody tr { --row-bg: var(--white); }
  .table-wrap.fit tbody tr:nth-child(even) { --row-bg: #FBFAF8; }
  .table-wrap.fit tbody tr:hover { --row-bg: var(--sky-pale); }
  .table-wrap.fit tbody tr.selected-row { --row-bg: #E4EEEC; }
  .table-wrap.fit tbody tr.selected-row:hover { --row-bg: #DCE9E7; }
  .table-wrap.fit tbody tr td { background: var(--row-bg); }

  .table-wrap.compact th { padding: 11px 13px; }
  .table-wrap.compact td { padding: 8px 13px; line-height: 1.4; white-space: nowrap; font-size: 14.5px; }   /* 12.5 → 14.5 */
  .clip { display: inline-block; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  .clip.muted { color: var(--text-muted); font-size: 13px; }   /* 11.5 → 13 */

  .table-wrap.fit th.sticky-col, .table-wrap.fit td.sticky-col { position: sticky; left: 0; z-index: 2; }
  .table-wrap.fit th.sticky-act, .table-wrap.fit td.sticky-act { position: sticky; right: 0; z-index: 2; }
  .table-wrap.fit th.sticky-col, .table-wrap.fit th.sticky-act { z-index: 4; }
  .table-wrap.fit td.sticky-col { box-shadow: 4px 0 6px -4px rgba(61,74,107,0.14); }
  .table-wrap.fit td.sticky-act { box-shadow: -4px 0 6px -4px rgba(61,74,107,0.14); }
  .table-wrap.fit tbody tr.selected-row td.sticky-col { box-shadow: inset 3px 0 0 var(--sky), 4px 0 6px -4px rgba(61,74,107,0.14); }
  .table-wrap.compact td.sticky-act .btn-group { flex-wrap: nowrap; }
  .table-wrap.compact td .btn { padding: 5px 11px; font-size: 13.5px; gap: 4px; }   /* 12 → 13.5 */
  .table-wrap.compact td .btn .ic { width: 15px; height: 15px; }

  /* ── TOAST ── */
  #toast { position: fixed; top: 84px; right: 20px; z-index: 900; display: flex; flex-direction: column; gap: 8px; max-width: min(480px, 90vw); }
  .toast-item { padding: 12px 18px; border-radius: 10px; color: #fff; box-shadow: var(--shadow-md); font-size: 14.5px; line-height: 1.45; }
  .toast-item.ok { background: var(--success); }
  .toast-item.err { background: var(--danger); }

  /* ── TIGHT CARD ── */
  .card.tight { padding: 18px 22px 20px; }
  .card.tight .card-header { margin-bottom: 14px; padding-bottom: 0; border-bottom: none; gap: 10px 14px; flex-wrap: wrap; }
  .card.tight .card-title { flex-wrap: wrap; }
  .card-note { font-size: 13.5px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }   /* 12 → 13.5 */
  .card.tight .search-bar { gap: 8px; }
  .card.tight .search-bar select, .card.tight .search-bar input { padding: 7px 11px; font-size: 14px; width: auto; }   /* 12.5 → 14 */
  .card.tight .search-bar input { width: 220px; }
  .card.tight .search-bar select { max-width: 300px; }

  /* ── FORM GROUP COMPACT (in modal) ── */
  .modal.wide .form-group label { margin-bottom: 2px; font-size: 14px; }   /* 12.5 → 14 */
  .modal.wide .form-group input, .modal.wide .form-group select { padding: 7px 11px; font-size: 15px; }   /* 13.5 → 15 */
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<script>
// ═══════════ CONFIG ═══════════
const SUPABASE_URL      = 'https://fuarmmweqxxhczavkvqp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE';
const KEY_OK = !SUPABASE_ANON_KEY.includes('ตรงนี้');
const LOGO_URL    = '';
const ROLE_CAN_EDIT   = ['admin', 'technician'];
const ROLE_CAN_DELETE = ['admin'];
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══════════ UTIL ═══════════
const $   = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const svg = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const nat = (a, b) => String(a || '').localeCompare(String(b || ''), 'th', { numeric: true });
const nameKey = v => String(v || '').trim().toUpperCase();
const toCamel = s => s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const toSnake = s => s.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const fromDb  = row => { const o = {}; for (const k in row) o[toCamel(k)] = row[k] == null ? '' : row[k]; return o; };
const toDb    = obj => { const o = {}; for (const k in obj) o[toSnake(k)] = (obj[k] === '' || obj[k] === undefined) ? null : obj[k]; return o; };
function fmtDT(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? String(d) : dt.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast-item ' + (type === 'err' ? 'err' : 'ok');
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6500 : 3200);
}
function friendlyError(err) {
  const msg = (err && err.message) || String(err);
  if (err && err.code === '23505') return 'ข้อมูลนี้มีอยู่ในระบบแล้ว';
  if ((err && err.code === '42501') || /row-level security/i.test(msg)) return 'ไม่มีสิทธิ์ดำเนินการ (ต้องเข้าสู่ระบบด้วยบัญชีที่มีสิทธิ์)';
  return msg;
}
async function run(p) { const { data, error } = await p; if (error) throw error; return data || []; }
async function fetchAll(table, order) {
  let all = [], from = 0; const size = 1000;
  while (true) {
    let qy = sb.from(table).select('*');
    if (order) qy = order(qy);
    const data = await run(qy.range(from, from + size - 1));
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}
async function loadProfile(uid) {
  try {
    const { data, error } = await sb.from('profiles').select('id,name,role,email').eq('id', uid).maybeSingle();
    if (error) throw error;
    return data;
  } catch (e) { console.error('loadProfile', e); return null; }
}

// ═══════════ STATE ═══════════
const state = { role: 'user', me: null, assets: [], departments: [], hasAudit: false, loadedAt: 0,
                cf: { dept: '', type: '', check: '', q: '' }, sel: null };
const canEdit   = () => ROLE_CAN_EDIT.includes(state.role);
const canDelete = () => ROLE_CAN_DELETE.includes(state.role);
const isAdmin   = () => state.role === 'admin';

const COMPUTER_TYPES = ['PC', 'Laptop', 'Tablet', 'All-in-One'];
const SCREEN_COLS = ['computerName','department','type','loginName','brand','model','sn','cpu','storage','ram','windows',
  'msOffice','etc','monitor','modelMonitor','snMonitor','usb','remark'];
const HEADS = { computerName:'Computer Name', department:'Department', type:'Type', loginName:'User', brand:'Brand', model:'Model',
  sn:'SN', cpu:'CPU', storage:'Harddisk', ram:'RAM', windows:'Windows', msOffice:'MS Office', etc:'ETC', monitor:'Monitor',
  modelMonitor:'Model Monitor', snMonitor:'SN Monitor', usb:'USB', remark:'Remark' };
const PRINT_COLS = ['department','type','loginName','computerName','brand','model','sn','cpu','storage','ram','windows',
  'msOffice','etc','monitor','modelMonitor','snMonitor','usb','remark'];
const LABELS = { department:'แผนก *', type:'ประเภท *', computerName:'ชื่อเครื่อง (Computer Name) *', loginName:'ผู้ใช้ (User)',
  brand:'ยี่ห้อ (Brand)', model:'รุ่น (Model)', sn:'Serial Number', cpu:'CPU', storage:'Harddisk', ram:'RAM', windows:'Windows',
  msOffice:'MS Office', etc:'ETC', monitor:'Monitor', modelMonitor:'Model Monitor', snMonitor:'SN Monitor', usb:'USB',
  keyboard:'Keyboard', mouse:'Mouse', ip:'IP Address', vga:'VGA', mainboard:'Mainboard', remark:'หมายเหตุ' };
const FORM_GROUPS = [
  ['ข้อมูลหลัก',                 ['department','type','computerName','loginName']],
  ['ตัวเครื่อง',                  ['brand','model','sn','cpu','storage','ram','windows','msOffice','etc']],
  ['จอภาพและอุปกรณ์ต่อพ่วง',      ['monitor','modelMonitor','snMonitor','usb','keyboard','mouse']],
  ['เครือข่ายและฮาร์ดแวร์ (ใช้ในระบบ PM)', ['ip','vga','mainboard']],
  ['หมายเหตุ',                   ['remark']],
];
const FORM_KEYS = FORM_GROUPS.flatMap(g => g[1]);
const CHECKS = { '': 'ตรวจสอบข้อมูล: ทุกรายการ', dup: 'ชื่อซ้ำ / ไม่มีชื่อ', nosn: 'ยังไม่มี Serial Number',
                 spare: 'เครื่องว่าง (ไม่มีผู้ใช้)', nodetail: 'สเปกไม่ครบ (ไม่มียี่ห้อ/CPU/RAM)' };

// ═══════════ AUTH ═══════════
function setRole(role, profile) {
  state.role = ROLE_CAN_EDIT.includes(role) || ROLE_CAN_DELETE.includes(role) ? role : 'user';
  state.me = profile || null;
  const badge = $('role-badge'), who = profile && profile.name ? ' · ' + profile.name : '';
  if (state.role === 'admin')           { badge.className = 'role-badge admin'; badge.textContent = '🔐 Admin' + who; }
  else if (state.role === 'technician') { badge.className = 'role-badge tech';  badge.textContent = '🛠 Technician' + who; }
  else if (profile)                     { badge.className = 'role-badge user';  badge.textContent = '👁 ' + (profile.name || 'User') + ' (ดูอย่างเดียว)'; }
  else                                  { badge.className = 'role-badge user';  badge.textContent = '👁 ดูอย่างเดียว'; }
  $('btn-login').style.display  = profile ? 'none' : '';
  $('btn-logout').style.display = profile ? '' : 'none';
  if (state.loadedAt) renderPage();
}
function openLogin() {
  $('modal-box').classList.remove('wide');
  $('modal-title').textContent = 'เข้าสู่ระบบ';
  $('modal-body').innerHTML = `
    <div class="form-group" style="margin-bottom:14px"><label>อีเมล</label>
      <input id="login-email" type="email" autocomplete="username" onkeydown="if(event.key==='Enter') $('login-pw').focus()"></div>
    <div class="form-group"><label>รหัสผ่าน</label>
      <input id="login-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitLogin()"></div>
    <div id="login-err" class="login-error" style="display:none;margin-top:14px;background:var(--danger-light);border:1px solid rgba(156,84,84,0.18);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger)"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="submitLogin()">${svg('lock')} เข้าสู่ระบบ</button></div>`;
  $('modal').classList.add('show');
  setTimeout(() => $('login-email') && $('login-email').focus(), 30);
}
async function submitLogin() {
  const err = $('login-err'), fail = m => { err.textContent = '❌ ' + m; err.style.display = 'block'; };
  if (!KEY_OK) return fail('ยังไม่ได้ใส่ SUPABASE_ANON_KEY จริงในโค้ด');
  const email = $('login-email').value.trim(), password = $('login-pw').value;
  if (!email || !password) return fail('กรุณากรอกอีเมลและรหัสผ่าน');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('login-pw').value = ''; return fail(error.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message); }
  const profile = await loadProfile(data.user.id);
  if (!profile) { try { await sb.auth.signOut(); } catch (e) {} return fail('บัญชีนี้ยังไม่ได้ตั้งสิทธิ์ในตาราง profiles — ติดต่อผู้ดูแลระบบ'); }
  closeModal(); setRole(profile.role, profile);
  toast(canEdit() ? 'เข้าสู่ระบบแล้ว — แก้ไขข้อมูลได้' : 'เข้าสู่ระบบแล้ว (บัญชีนี้ดูข้อมูลได้อย่างเดียว)');
}
async function logout() {
  try { await sb.auth.signOut(); } catch (e) { console.error(e); }
  setRole('user', null);
  toast('ออกจากระบบแล้ว');
}

// ═══════════ DATA ═══════════
async function loadAssets() {
  const [rows, depts] = await Promise.all([
    fetchAll('assets', q => q.order('id')),
    fetchAll('asset_departments', q => q.order('code')).then(r => r.map(x => x.code)).catch(() => [])
  ]);
  state.assets = rows.map(fromDb).sort((a, b) => nat(a.department, b.department) || nat(a.computerName, b.computerName));
  state.departments = [...new Set([...depts, ...state.assets.map(a => a.department)])].filter(Boolean).sort(nat);
  state.hasAudit = state.assets.length > 0 && 'updatedAt' in state.assets[0];
  state.loadedAt = Date.now();
}
async function refresh(quiet) {
  try { await loadAssets(); renderPage(); if (!quiet) toast('อัปเดตข้อมูลล่าสุดแล้ว'); }
  catch (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + friendlyError(e), 'err'); }
}
function nameCounts() {
  const c = {}; state.assets.forEach(a => { const k = nameKey(a.computerName); if (k) c[k] = (c[k] || 0) + 1; }); return c;
}
const isProblemName = (a, counts) => { const k = nameKey(a.computerName); return !k || counts[k] > 1; };

// ═══════════ PAGE ═══════════
function renderPage() {
  const types = [...new Set([...COMPUTER_TYPES, ...state.assets.map(a => a.type)])].filter(Boolean);
  const notice = !canEdit()
    ? `<div class="readonly-notice">👁 โหมดดูอย่างเดียว — กด "เข้าสู่ระบบ" ที่มุมขวาบนเพื่อเพิ่ม / แก้ไข / ลบข้อมูล (เฉพาะผู้ที่ได้รับสิทธิ์)</div>` : '';
  const auditWarn = (!state.hasAudit && state.assets.length)
    ? `<div class="readonly-notice">⚠️ ฐานข้อมูลยังไม่ได้รัน <b>step3_asset_page.sql</b> — ยังไม่บันทึกว่าใครแก้ไขล่าสุด และยังไม่ป้องกันการแก้ไขซ้อนกัน</div>` : '';
  $('content').innerHTML = `${notice}${auditWarn}
    <div class="card tight">
      <div class="card-header">
        <div class="card-title"><div class="card-title-icon">${svg('computer')}</div>รายการเครื่อง <span id="cf-summary" class="card-note"></span></div>
        <div class="search-bar">
          ${canEdit() ? `<button class="btn btn-primary btn-sm" onclick="openAssetModal(null)">${svg('plus')} เพิ่มเครื่องใหม่</button>` : ''}
          <select id="cf-dept" onchange="applyFilter()"><option value="">ทุกแผนก</option>${state.departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select>
          <select id="cf-type" onchange="applyFilter()"><option value="">ทุกประเภท</option>${types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select>
          <select id="cf-check" onchange="applyFilter()">${Object.entries(CHECKS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
          <input id="cf-q" oninput="applyFilter()" placeholder="ค้นหา ชื่อเครื่อง / ผู้ใช้ / SN ...">
          <button class="btn btn-outline btn-sm" onclick="refresh()" title="โหลดข้อมูลล่าสุดจากฐานข้อมูล">${svg('refresh')} รีเฟรช</button>
          <button class="btn btn-outline btn-sm" onclick="exportCsv()" title="ส่งออกรายการที่กรองอยู่เป็นไฟล์ CSV (เปิดใน Excel ได้)">${svg('download')} CSV</button>
          <button class="btn btn-outline btn-sm" onclick="printRegister()">${svg('printer')} พิมพ์ทะเบียน</button>
        </div>
      </div>
      <div class="table-wrap fit compact" id="cf-table"></div>
    </div>`;
  $('cf-dept').value = state.cf.dept; $('cf-type').value = state.cf.type; $('cf-check').value = state.cf.check; $('cf-q').value = state.cf.q;
  applyFilter();
}
function filteredAssets() {
  const d = $('cf-dept').value, t = $('cf-type').value, ck = $('cf-check').value, q = $('cf-q').value.trim().toLowerCase();
  state.cf = { dept: d, type: t, check: ck, q: $('cf-q').value };
  const counts = nameCounts();
  const blank = v => v == null || String(v).trim() === '';
  const passCheck = a => !ck
    || (ck === 'dup' && isProblemName(a, counts))
    || (ck === 'nosn' && blank(a.sn))
    || (ck === 'spare' && (blank(a.loginName) || String(a.loginName).trim() === 'ว่าง'))
    || (ck === 'nodetail' && blank(a.brand) && blank(a.cpu) && blank(a.ram));
  return state.assets.filter(a => (!d || a.department === d) && (!t || a.type === t) && passCheck(a) &&
    (!q || [a.computerName, a.loginName, a.brand, a.model, a.sn, a.cpu, a.department].some(v => String(v || '').toLowerCase().includes(q))));
}
function applyFilter() {
  const list = filteredAssets(), counts = nameCounts();
  const showEdit = canEdit(), showDel = canDelete(), hasAct = showEdit || showDel;
  const rows = list.map(a => {
    const k = nameKey(a.computerName);
    const flag = !k ? ' <span class="badge badge-warning">ไม่มีชื่อ</span>' : counts[k] > 1 ? ' <span class="badge badge-warning">ชื่อซ้ำ</span>' : '';
    const tds = SCREEN_COLS.map(col => {
      if (col === 'computerName') return `<td class="sticky-col"><strong>${esc(a.computerName)}</strong>${flag}</td>`;
      const v = String(a[col] == null ? '' : a[col]);
      return `<td><span class="clip"${v.length > 24 ? ` title="${esc(v)}"` : ''}>${esc(v)}</span></td>`;
    }).join('');
    const upd = state.hasAudit ? `<td><span class="clip muted">${esc(fmtDT(a.updatedAt))}${a.updatedBy ? ' · ' + esc(a.updatedBy) : ''}</span></td>` : '';
    const act = hasAct ? `<td class="sticky-act"><div class="btn-group">
      ${showEdit ? `<button class="btn btn-outline btn-sm" data-id="${esc(a.id)}" onclick="openAssetModal(this.dataset.id)">${svg('edit')} แก้ไข</button>` : ''}
      ${showDel ? `<button class="btn btn-danger btn-sm" data-id="${esc(a.id)}" onclick="deleteAsset(this.dataset.id)">${svg('trash')} ลบ</button>` : ''}
    </div></td>` : '';
    return `<tr data-key="${esc(a.id)}">${tds}${upd}${act}</tr>`;
  }).join('');
  const heads = SCREEN_COLS.map(k => `<th${k === 'computerName' ? ' class="sticky-col"' : ''}>${HEADS[k]}</th>`).join('')
    + (state.hasAudit ? '<th>Last Update</th>' : '') + (hasAct ? '<th class="sticky-act"></th>' : '');
  const n = t => list.filter(a => a.type === t).length;
  const bad = state.assets.filter(a => isProblemName(a, counts)).length;
  $('cf-summary').textContent = `พบ ${list.length} รายการ  (PC: ${n('PC')}  Laptop: ${n('Laptop')})` + (bad ? `  ·  ⚠ ชื่อซ้ำ/ไม่มีชื่อ ${bad} เครื่อง` : '');
  $('cf-table').innerHTML = list.length
    ? `<table><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">ไม่พบข้อมูลที่ตรงกับการค้นหา</div>`;
  applySelection(); fitTables();
}
function applySelection() {
  document.querySelectorAll('#content tbody tr[data-key]').forEach(tr => tr.classList.toggle('selected-row', state.sel !== null && tr.dataset.key === String(state.sel)));
}
$('content').addEventListener('click', e => {
  const tr = e.target.closest('tbody tr[data-key]'); if (!tr) return;
  state.sel = tr.dataset.key; applySelection();
});
function fitTables() {
  document.querySelectorAll('#content .table-wrap.fit').forEach(el => {
    const top = el.getBoundingClientRect().top + window.scrollY;
    const h = Math.max(260, window.innerHeight - top - 24);
    el.style.maxHeight = h + 'px';
    const over = document.documentElement.scrollHeight - window.innerHeight;
    if (over > 0) el.style.maxHeight = Math.max(260, h - over) + 'px';
  });
}
window.addEventListener('resize', fitTables);

// ═══════════ ADD/EDIT/DELETE ═══════════
function closeModal() { $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openAssetModal(id) {
  if (!canEdit()) return toast('เฉพาะผู้ที่ได้รับสิทธิ์เท่านั้นที่เพิ่ม/แก้ไขข้อมูลได้', 'err');
  const a = id ? state.assets.find(x => x.id === id) : null;
  if (id && !a) return toast('ไม่พบเครื่องนี้ (อาจถูกลบไปแล้ว) กรุณารีเฟรช', 'err');
  const val = k => esc(a ? a[k] : '');
  const dep = a ? a.department : state.cf.dept;
  const depList = [...new Set([...state.departments, dep])].filter(Boolean);
  const typeList = [...new Set([...COMPUTER_TYPES, a ? a.type : ''])].filter(Boolean);
  const field = k => {
    if (k === 'department') return `<div class="form-group"><label>${LABELS[k]}</label><select id="f-department" onchange="onDeptChange(this)">
      <option value="">— เลือกแผนก —</option>${depList.map(d => `<option value="${esc(d)}" ${d === dep ? 'selected' : ''}>${esc(d)}</option>`).join('')}
      ${isAdmin() ? '<option value="__new__">＋ เพิ่มแผนกใหม่…</option>' : ''}</select></div>`;
    if (k === 'type') return `<div class="form-group"><label>${LABELS[k]}</label><select id="f-type"><option value="">— เลือกประเภท —</option>
      ${typeList.map(t => `<option value="${esc(t)}" ${a && t === a.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
    if (k === 'remark') return `<div class="form-group full"><label>${LABELS[k]}</label><input id="f-remark" value="${val(k)}"></div>`;
    return `<div class="form-group"><label>${LABELS[k]}</label><input id="f-${k}" value="${val(k)}"></div>`;
  };
  const meta = a && state.hasAudit && a.updatedAt ? `แก้ไขล่าสุด ${esc(fmtDT(a.updatedAt))}${a.updatedBy ? ' โดย ' + esc(a.updatedBy) : ''}` : '';
  $('modal-box').classList.add('wide');
  $('modal-title').textContent = a ? '✏️ แก้ไขข้อมูลเครื่อง' : '➕ เพิ่มเครื่องใหม่';
  $('modal-body').innerHTML = FORM_GROUPS.map(([title, keys]) =>
    `<div class="section-heading">${title}</div><div class="${keys.length === 4 ? 'form-grid-4' : 'form-grid-3'}" style="margin-bottom:12px">${keys.map(field).join('')}</div>`).join('') + `
    <div class="modal-footer"><div class="modal-meta">${meta}</div>
      <button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" id="btn-save" data-id="${esc(a ? a.id : '')}" data-updated="${esc(a ? a.updatedAt : '')}" onclick="saveAsset(this)">${svg('save')} ${a ? 'บันทึกการแก้ไข' : 'เพิ่มเครื่อง'}</button></div>`;
  $('modal').classList.add('show');
  setTimeout(() => { const f = $('f-' + (a ? 'loginName' : 'computerName')); if (f) f.focus(); }, 30);
}
async function onDeptChange(sel) {
  if (sel.value !== '__new__') return;
  const code = (prompt('รหัสแผนกใหม่ (A-Z, 0-9, _ หรือ - ไม่เกิน 12 ตัว เช่น QC2)') || '').trim().toUpperCase();
  if (!code) { sel.value = ''; return; }
  if (!/^[A-Z0-9_-]{1,12}$/.test(code)) { toast('รหัสแผนกใช้ได้เฉพาะ A-Z 0-9 _ - และไม่เกิน 12 ตัว', 'err'); sel.value = ''; return; }
  try {
    if (!state.departments.includes(code)) await run(sb.from('asset_departments').insert({ code }));
    if (!state.departments.includes(code)) state.departments = [...state.departments, code].sort(nat);
    const opt = document.createElement('option'); opt.value = code; opt.textContent = code;
    sel.insertBefore(opt, sel.querySelector('option[value="__new__"]')); sel.value = code;
    toast('เพิ่มแผนก ' + code + ' แล้ว');
  } catch (e) { toast('เพิ่มแผนกไม่สำเร็จ: ' + friendlyError(e), 'err'); sel.value = ''; }
}
async function updateAsset(id, fields, expectedUpdatedAt) {
  let q = sb.from('assets').update(toDb(fields)).eq('id', id);
  if (state.hasAudit) q = expectedUpdatedAt ? q.eq('updated_at', expectedUpdatedAt) : q.is('updated_at', null);
  const rows = await run(q.select('id'));
  if (rows.length) return;
  const now = await run(sb.from('assets').select('id,updated_at,updated_by').eq('id', id));
  if (!now.length) throw new Error('เครื่องนี้ถูกลบไปแล้วโดยผู้อื่น — กรุณารีเฟรช');
  if (state.hasAudit && String(now[0].updated_at) !== String(expectedUpdatedAt))
    throw new Error(`ข้อมูลนี้ถูกแก้ไขโดย ${now[0].updated_by || 'ผู้อื่น'} ไปก่อนแล้ว — ปิดหน้าต่างนี้ กด "รีเฟรช" แล้วแก้ไขใหม่ (ข้อมูลของคุณยังไม่ถูกบันทึก)`);
  throw new Error('ไม่มีสิทธิ์แก้ไขข้อมูลนี้ (ต้องเข้าสู่ระบบด้วยบัญชี admin หรือ technician)');
}
async function saveAsset(btn) {
  if (!canEdit()) return toast('ไม่มีสิทธิ์แก้ไข', 'err');
  const id = btn.dataset.id, expected = btn.dataset.updated;
  const d = {}; FORM_KEYS.forEach(k => { d[k] = $('f-' + k).value.trim(); });
  if (!d.department || d.department === '__new__' || !d.type || !d.computerName) return toast('กรุณากรอก แผนก / ประเภท / ชื่อเครื่อง', 'err');
  const old = id ? state.assets.find(a => a.id === id) : null;
  const nameChanged = !old || nameKey(old.computerName) !== nameKey(d.computerName);
  if (nameChanged && state.assets.some(a => a.id !== id && nameKey(a.computerName) === nameKey(d.computerName)))
    return toast(`ชื่อเครื่อง "${d.computerName}" มีอยู่แล้ว กรุณาใช้ชื่อที่ไม่ซ้ำ`, 'err');
  btn.disabled = true;
  try {
    let newId = id;
    if (id) await updateAsset(id, d, expected);
    else { const r = await run(sb.from('assets').insert(toDb(d)).select('id')); if (!r.length) throw new Error('ไม่มีสิทธิ์เพิ่มข้อมูล'); newId = r[0].id; }
    closeModal(); state.sel = newId; await loadAssets(); renderPage();
    toast(id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มเครื่องเรียบร้อย');
    const tr = document.querySelector(`#cf-table tr[data-key="${CSS.escape(String(newId))}"]`); if (tr && tr.scrollIntoView) tr.scrollIntoView({ block: 'nearest' });
  } catch (e) { btn.disabled = false; toast(friendlyError(e), 'err'); }
}
async function deleteAsset(id) {
  if (!canDelete()) return toast('เฉพาะ Admin เท่านั้นที่ลบได้', 'err');
  const a = state.assets.find(x => x.id === id); if (!a) return;
  if (!confirm(`ยืนยันการลบเครื่อง ${a.computerName || '(ไม่มีชื่อ)'}${a.loginName ? ' — ผู้ใช้: ' + a.loginName : ''} ?\n\n(ประวัติ PM ของเครื่องนี้ยังคงอยู่ และระบบเก็บสำเนาข้อมูลที่ลบไว้ในประวัติการเปลี่ยนแปลง)`)) return;
  try {
    const rows = await run(sb.from('assets').delete().eq('id', id).select('id'));
    if (!rows.length) throw new Error('ลบไม่สำเร็จ — ไม่มีสิทธิ์ หรือมีผู้อื่นลบเครื่องนี้ไปแล้ว');
    if (state.sel === id) state.sel = null;
    await loadAssets(); renderPage(); toast('ลบเครื่อง ' + (a.computerName || '') + ' แล้ว');
  } catch (e) { toast(friendlyError(e), 'err'); }
}

// ═══════════ EXPORT / PRINT ═══════════
function buildCsv(list) {
  const cols = [...PRINT_COLS, 'keyboard', 'mouse', 'ip', 'vga', 'mainboard'];
  const heads = cols.map(k => HEADS[k] || LABELS[k].replace(' *', ''));
  const q = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\ufeff' + [heads.map(q).join(','), ...list.map(a => cols.map(k => q(a[k])).join(','))].join('\r\n');
}
function exportCsv() {
  const list = filteredAssets();
  if (!list.length) return toast('ไม่มีข้อมูลที่จะส่งออก', 'err');
  const blob = new Blob([buildCsv(list)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'assets-' + new Date().toLocaleDateString('en-CA') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function printRegister() {
  const list = filteredAssets();
  if (!list.length) return toast('ไม่มีข้อมูลที่จะพิมพ์', 'err');
  const dept = $('cf-dept').value, n = t => list.filter(c => c.type === t).length;
  const pc = n('PC'), lp = n('Laptop'), tb = n('Tablet'), aio = n('All-in-One');
  const today = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
  const body = list.map((c, i) => `<tr><td class="c">${i + 1}</td>${PRINT_COLS.map(k => `<td>${esc(c[k])}</td>`).join('')}</tr>`).join('');
  const html = `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>ทะเบียนคอมพิวเตอร์และเทคโนโลยีสารสนเทศ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 8mm 8mm 12mm; }
  body { font-family: 'AngsanaUPC', 'Angsana New', 'Sarabun', sans-serif; color: #000; margin: 0; }
  .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
  .header h1 { margin: 0; font-size: 18px; }
  .info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 10px; }
  thead { display: table-header-group; }
  th, td { border: 1px solid #000; padding: 3px 4px; text-align: left; word-break: break-word; }
  th { background: #eee; text-align: center; }
  td.c { text-align: center; }
  tr { page-break-inside: avoid; }
  .summary { margin-top: 10px; font-size: 12px; }
  .footer { position: fixed; bottom: 0; right: 0; font-size: 10px; color: #444; }
  .bar { text-align: center; margin: 14px 0; }
  @media print { .bar { display: none; } }
</style></head><body>
  <div class="header"><h1>ทะเบียนคอมพิวเตอร์และเทคโนโลยีสารสนเทศ</h1><div style="font-size:13px">แผนก: ${dept ? esc(dept) : 'ทุกแผนก'}</div></div>
  <div class="info"><div>วันที่พิมพ์: ${today}</div><div>จำนวนทั้งหมด: ${list.length} รายการ</div></div>
  <table><thead><tr><th>No.</th>${PRINT_COLS.map(k => `<th>${HEADS[k]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
  <div class="summary">สรุป: PC ${pc} เครื่อง · Laptop ${lp} เครื่อง${tb ? ` · Tablet ${tb} เครื่อง` : ''}${aio ? ` · All-in-One ${aio} เครื่อง` : ''}</div>
  <div class="footer">FOM 014 IT Rev.01 (12/05/2026)</div>
  <div class="bar"><button onclick="window.print()" style="padding:8px 20px;font-size:15px">🖨 พิมพ์</button>
  <button onclick="window.close()" style="padding:8px 20px;font-size:15px;margin-left:10px">ปิด</button></div>
</body></html>`;
  const w = window.open('', '_blank');
  if (!w) return toast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต pop-up สำหรับหน้านี้', 'err');
  w.document.write(html); w.document.close();
}

// ═══════════ INIT ═══════════
function errorHint(e) {
  let hint = '';
  if (!KEY_OK) hint = '<br><small>สาเหตุที่น่าจะเป็น: ยังไม่ได้ใส่ SUPABASE_ANON_KEY จริงในโค้ด</small>';
  else if (/does not exist|schema cache|Could not find/i.test(e.message)) hint = '<br><small>ไม่พบตารางหรือคอลัมน์ — ตรวจว่า SUPABASE_URL เป็นโปรเจคที่มีตาราง assets และรัน step1_schema.sql / step3_asset_page.sql แล้ว</small>';
  return esc(friendlyError(e)) + hint;
}
(async function init() {
  $('footer-year').textContent = new Date().getFullYear();
  if (LOGO_URL) document.querySelectorAll('.brand-logo').forEach(el => {
    const def = el.innerHTML, img = new Image();
    img.alt = 'logo'; img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit';
    img.onerror = () => { el.innerHTML = def; el.style.background = ''; el.style.padding = ''; };
    img.src = LOGO_URL; el.innerHTML = ''; el.appendChild(img); el.style.background = '#fff'; el.style.padding = '4px';
  });
  setRole('user', null);
  try {
    if (KEY_OK) {
      const { data } = await sb.auth.getSession();
      if (data && data.session) { const p = await loadProfile(data.session.user.id); if (p) setRole(p.role, p); }
    }
    await loadAssets(); renderPage();
  } catch (e) {
    console.error(e);
    $('content').innerHTML = `<div class="card"><div class="empty">⚠️ โหลดข้อมูลไม่สำเร็จ: ${errorHint(e)}</div></div>`;
  }
  window.addEventListener('focus', () => {
    if (KEY_OK && state.loadedAt && Date.now() - state.loadedAt > 60000 && !$('modal').classList.contains('show')) refresh(true);
  });
})();
</script>
